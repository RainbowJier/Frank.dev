# 作品集数据 —— 中英双语描述（desc.zh / desc.en）+ 标签（tags.zh / tags.en）
# 布局 themes/pure/layout/projects.ejs 按 config.language 取子键。
# ⚠️ source_en/_data/projects.yml 需保持与本文件一致（双构建各读各自 source）。

items:
  - name: TradingAgents
    repo: https://github.com/RainbowJier/TradingAgents
    tags:
      zh: [AI, Python, Multi-Agent]
      en: [AI, Python, Multi-Agent]
    desc:
      zh: 基于多智能体 LLM 的金融交易框架。多个分工协作的 Agent 分析市场、辩论、给出交易决策——研究「让 LLM 像团队一样工作」。
      en: A multi-agent LLM financial trading framework. Multiple agents analyze markets, debate, and make trading decisions — exploring how LLMs can work as a team.

  - name: spring-cloud-gateway
    repo: https://github.com/RainbowJier/spring-cloud-gateway
    tags:
      zh: [Java, Spring Cloud, Gateway]
      en: [Java, Spring Cloud, Gateway]
    desc:
      zh: 基于 Spring Framework 与 Spring Boot 的 API 网关，提供路由转发与更多能力。动手实现网关核心机制的过程，也是吃透微服务治理的过程。
      en: An API gateway built on Spring Framework and Spring Boot, providing routing and more. Implementing the gateway's core mechanisms is also a deep dive into microservice governance.

  - name: Basic_Framework
    repo: https://github.com/RainbowJier/Basic_Framework
    tags:
      zh: [Java, Web, 框架]
      en: [Java, Web, Framework]
    desc:
      zh: 一套用于快速搭建 Web 系统的基础框架。把常用的认证、权限、分层等模块沉淀下来，新项目能更快起跑。
      en: A base framework for quickly building web systems, with auth, permissions and layered modules distilled for faster project starts.

  - name: MybatisPlus
    repo: https://github.com/RainbowJier/MybatisPlus
    tags:
      zh: [Java, MyBatis-Plus]
      en: [Java, MyBatis-Plus]
    desc:
      zh: MyBatis-Plus 的学习与实践仓库。从条件构造器到自动填充、分页插件，把常用特性都跑通并记录下来。
      en: A learning & practice repo for MyBatis-Plus — from condition wrappers to auto-fill and pagination plugins, all common features tried and documented.

  - name: AI-AIMBOT-YOLOV5
    repo: https://github.com/RainbowJier/AI-AIMBOT-YOLOV5
    tags:
      zh: [CV, YOLOv5]
      en: [CV, YOLOv5]
    desc:
      zh: 基于 YOLOv5 的目标检测实践。从模型训练到推理部署，完整走一遍计算机视觉工程化的流程。
      en: Object detection practice based on YOLOv5 — from model training to inference deployment, walking through the full CV engineering pipeline.

  - name: HandWrittenSpring
    repo: https://github.com/RainbowJier/HandWrittenSpring
    tags:
      zh: [Java, 手写框架]
      en: [Java, Hand-written Framework]
    desc:
      zh: 手写一个迷你版 Spring。IoC、AOP 这些听起来抽象的概念，自己实现一遍之后，就再也不会觉得玄学了。
      en: A mini Spring written by hand. Once you implement IoC and AOP yourself, these abstract concepts stop feeling magical.

all_link: https://github.com/RainbowJier?tab=repositories
