<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="700" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="699" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F39B7F"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A087"/>
    </marker>
  </defs>

  <!-- 主干：put 入口 -->
  <rect x="135" y="40" width="230" height="52" rx="8" fill="#3C5488" fill-opacity="0.08" stroke="#3C5488" stroke-width="1.5"/>
  <text x="250" y="62" text-anchor="middle" font-size="13.5" font-weight="600" fill="#252A33">put(key, value)</text>
  <text x="250" y="82" text-anchor="middle" font-size="11.5" fill="#6B7280">spread(key) 计算 hash</text>

  <!-- 判断 1：table 未初始化？ -->
  <path d="M 250 126 L 350 160 L 250 194 L 150 160 Z" fill="#F4F7FA" stroke="#5A6472" stroke-width="1.5"/>
  <text x="250" y="165" text-anchor="middle" font-size="13" fill="#252A33">table 未初始化？</text>
  <rect x="470" y="134" width="240" height="56" rx="8" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="590" y="156" text-anchor="middle" font-size="13" fill="#252A33">CAS 抢占 sizeCtl = -1</text>
  <text x="590" y="176" text-anchor="middle" font-size="11.5" fill="#6B7280">抢到的线程负责初始化表</text>

  <!-- 判断 2：空桶？ -->
  <path d="M 250 216 L 350 250 L 250 284 L 150 250 Z" fill="#F4F7FA" stroke="#5A6472" stroke-width="1.5"/>
  <text x="250" y="255" text-anchor="middle" font-size="13" fill="#252A33">table[i] 是空桶？</text>
  <rect x="470" y="222" width="240" height="56" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="590" y="244" text-anchor="middle" font-size="13" fill="#252A33">CAS 插入新 Node</text>
  <text x="590" y="264" text-anchor="middle" font-size="11.5" fill="#6B7280">无锁快路径 · 失败则重试</text>

  <!-- 判断 3：MOVED？ -->
  <path d="M 250 306 L 350 340 L 250 374 L 150 340 Z" fill="#F4F7FA" stroke="#5A6472" stroke-width="1.5"/>
  <text x="250" y="345" text-anchor="middle" font-size="13" fill="#252A33">头节点为 MOVED？</text>
  <rect x="470" y="312" width="240" height="56" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="590" y="334" text-anchor="middle" font-size="13" fill="#252A33">helpTransfer 协助扩容</text>
  <text x="590" y="354" text-anchor="middle" font-size="11.5" fill="#6B7280">帮完一段，回来重试 put</text>

  <!-- synchronized 锁头节点 -->
  <rect x="135" y="416" width="230" height="52" rx="8" fill="#3C5488" fill-opacity="0.15" stroke="#3C5488" stroke-width="2"/>
  <text x="250" y="438" text-anchor="middle" font-size="13.5" font-weight="600" fill="#252A33">synchronized 锁住头节点</text>
  <text x="250" y="458" text-anchor="middle" font-size="11.5" fill="#6B7280">只阻塞写同一个桶的线程</text>

  <!-- 插入 -->
  <rect x="135" y="500" width="230" height="52" rx="8" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="250" y="522" text-anchor="middle" font-size="13.5" fill="#252A33">链表尾插 / 红黑树插入</text>
  <text x="250" y="542" text-anchor="middle" font-size="11.5" fill="#6B7280">长度 ≥ 8 且 ≥ 64 → 树化</text>

  <!-- addCount -->
  <rect x="135" y="584" width="230" height="48" rx="8" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="250" y="604" text-anchor="middle" font-size="13" fill="#252A33">addCount：累加计数</text>
  <text x="250" y="623" text-anchor="middle" font-size="11.5" fill="#6B7280">超过阈值 → 发起 / 协助扩容</text>

  <!-- 主干箭头 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="250" y1="92"  x2="250" y2="122" marker-end="url(#arrow)"/>
    <line x1="250" y1="194" x2="250" y2="212" marker-end="url(#arrow)"/>
    <line x1="250" y1="284" x2="250" y2="302" marker-end="url(#arrow)"/>
    <line x1="250" y1="374" x2="250" y2="412" marker-end="url(#arrow)"/>
    <line x1="250" y1="468" x2="250" y2="496" marker-end="url(#arrow)"/>
    <line x1="250" y1="552" x2="250" y2="580" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="258" y="112">否</text>
    <text x="258" y="208">否</text>
    <text x="258" y="298">否</text>
  </g>

  <!-- 分支箭头 -->
  <line x1="350" y1="160" x2="466" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="152" font-size="11" fill="#6B7280">是</text>
  <line x1="350" y1="250" x2="466" y2="250" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="242" font-size="11" fill="#6B7280">是</text>
  <line x1="350" y1="340" x2="466" y2="340" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="330" font-size="11" fill="#6B7280">是（扩容中）</text>

  <!-- 重试回路 1：初始化后回到入口 -->
  <path d="M 590 134 L 590 66 L 373 66" fill="none" stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="598" y="100" font-size="11" fill="#6B7280">初始化完成，重试</text>

  <!-- 重试回路 2：协助扩容后回来锁新表的桶 -->
  <path d="M 590 368 L 590 442 L 373 442" fill="none" stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="430" y="430" font-size="11" fill="#6B7280">帮忙迁移一段后重试</text>

  <!-- 快路径：CAS 成功直达计数 -->
  <path d="M 710 250 L 748 250 L 748 608 L 373 608" fill="none" stroke="#00A087" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowT)"/>
  <text x="740" y="470" text-anchor="end" font-size="11" fill="#6B7280">CAS 成功 → 直接计数</text>

  <text x="410" y="676" text-anchor="middle" font-size="12" fill="#6B7280">图 11｜put 的加锁决策：CAS 快路径 + synchronized 慢路径</text>
</svg>
