<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="460" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="459" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 左列：装配输入 -->
  <g stroke-width="1.5">
    <rect x="48" y="70"  width="190" height="54" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="48" y="148" width="190" height="54" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="48" y="226" width="190" height="54" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="48" y="304" width="190" height="54" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="143" y="93">流式对话模型</text>
    <text x="143" y="171">ChatMemory</text>
    <text x="143" y="249">工具绑定</text>
    <text x="143" y="327">ContentRetriever</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="143" y="111">streamingChatModel</text>
    <text x="143" y="189">预装 DB 六轮历史</text>
    <text x="143" y="267">ToolSpec → Executor</text>
    <text x="143" y="345">知识库向量检索</text>
  </g>

  <!-- 中枢：AiServices 装配 -->
  <rect x="286" y="84" width="180" height="260" rx="10" fill="#4DBBD5" fill-opacity="0.08" stroke="#4DBBD5" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="376" y="178" font-size="15" font-weight="600" fill="#252A33">AiServices 装配</text>
    <text x="376" y="206" font-size="12" fill="#6B7280">ChatAssistant 接口</text>
    <text x="376" y="228" font-size="11" fill="#6B7280">@SystemMessage 模板</text>
    <text x="376" y="248" font-size="11" fill="#6B7280">@UserMessage 注入</text>
    <text x="376" y="268" font-size="11" fill="#6B7280">TokenStream 返回</text>
    <text x="376" y="296" font-size="11" fill="#6B7280">工具轮上限 5</text>
  </g>

  <!-- 左列 → 中枢 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="238" y1="97"  x2="282" y2="97"  marker-end="url(#arrow)"/>
    <line x1="238" y1="175" x2="282" y2="175" marker-end="url(#arrow)"/>
    <line x1="238" y1="253" x2="282" y2="253" marker-end="url(#arrow)"/>
    <line x1="238" y1="331" x2="282" y2="331" marker-end="url(#arrow)"/>
  </g>

  <!-- 中枢 → 右列 -->
  <line x1="466" y1="214" x2="510" y2="214" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右列：回调翻译 -->
  <rect x="510" y="84" width="262" height="260" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="641" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">TokenStream → LlmTokenHandler</text>
  <g font-size="12" fill="#252A33">
    <text x="534" y="146">onPartialResponse → onToken</text>
    <text x="534" y="180">onRetrieved → RagHit 溯源</text>
    <text x="534" y="214">beforeToolExecution → onToolCall</text>
    <text x="534" y="248">onCompleteResponse → onComplete</text>
    <text x="534" y="282">onError → error 事件</text>
  </g>
  <text x="534" y="318" font-size="11" fill="#6B7280">domain 层零 LangChain4j 依赖</text>

  <!-- 底部输出 -->
  <line x1="641" y1="344" x2="641" y2="368" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="510" y="372" width="262" height="48" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="641" y="392" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">SseEmitter 推送事件</text>
  <text x="641" y="410" text-anchor="middle" font-size="11" fill="#6B7280">token · tool · done · error</text>

  <!-- 说明 -->
  <text x="48" y="392" font-size="11" fill="#6B7280">工具执行委托 domain 的 ToolCallDispatcher，</text>
  <text x="48" y="410" font-size="11" fill="#6B7280">异常转 error JSON 回填模型，不中断生成</text>

  <text x="410" y="446" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜AiServices 声明式编排：记忆、工具、RAG 在引擎层装配，回调翻译成 domain 事件推送</text>
</svg>
