<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="420" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="419" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F39B7F"/>
    </marker>
  </defs>

  <!-- 客户端 -->
  <rect x="30" y="140" width="96" height="56" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="78" y="172" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">客户端</text>

  <!-- 网关容器 -->
  <rect x="160" y="70" width="440" height="200" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="380" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#3C5488">Spring Cloud Gateway</text>

  <!-- 网关内部：路由匹配 -> 熔断过滤器 -> 转发 -->
  <rect x="180" y="112" width="118" height="46" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="239" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">路由匹配</text>

  <rect x="312" y="112" width="150" height="46" rx="6" fill="#3C5488" fill-opacity="0.15" stroke="#3C5488" stroke-width="1.5"/>
  <text x="387" y="131" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">CircuitBreaker</text>
  <text x="387" y="148" text-anchor="middle" font-size="11" fill="#6B7280">熔断过滤器</text>

  <rect x="476" y="112" width="104" height="46" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="528" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">转发下游</text>

  <line x1="300" y1="135" x2="308" y2="135" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="462" y1="135" x2="470" y2="135" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Resilience4j -->
  <line x1="387" y1="158" x2="387" y2="188" stroke="#9AA4B2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="400" y="177" font-size="11" fill="#6B7280">委托判断是否放行</text>
  <rect x="272" y="192" width="230" height="58" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="387" y="215" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Resilience4j 熔断器</text>
  <text x="387" y="236" text-anchor="middle" font-size="11" fill="#6B7280">滑动窗口统计 · 三态状态机</text>

  <!-- 下游服务 -->
  <rect x="644" y="140" width="140" height="56" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="714" y="162" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">订单服务</text>
  <text x="714" y="182" text-anchor="middle" font-size="11" fill="#6B7280">lb://order-service</text>

  <!-- 正常路径 -->
  <line x1="128" y1="168" x2="156" y2="168" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="604" y1="168" x2="640" y2="168" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="152" text-anchor="middle" font-size="11" fill="#6B7280">正常放行</text>

  <!-- 降级路径 -->
  <line x1="387" y1="254" x2="387" y2="304" stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="402" y="284" font-size="11" fill="#6B7280">熔断打开 · 快速失败</text>

  <rect x="272" y="310" width="230" height="58" rx="6" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="387" y="333" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">降级接口 /fallback/order</text>
  <text x="387" y="354" text-anchor="middle" font-size="11" fill="#6B7280">返回缓存或默认兜底数据</text>

  <path d="M 268 339 C 150 339, 78 270, 78 200" fill="none" stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#6B7280">兜底响应</text>

  <text x="410" y="395" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜CircuitBreaker 过滤器请求流转：Closed 正常放行，Open 时走降级路径</text>
</svg>
