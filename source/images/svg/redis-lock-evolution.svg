<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="310" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="309" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 主轴 -->
  <line x1="50" y1="160" x2="780" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 里程碑 v1（红：有问题） -->
  <circle cx="130" cy="160" r="5" fill="#E64B35"/>
  <text x="130" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">v1  SETNX + EXPIRE</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#6B7280">两条命令非原子</text>
  <text x="130" y="186" text-anchor="middle" font-size="11" fill="#E64B35">中途宕机 → 死锁</text>

  <!-- v2 -->
  <circle cx="290" cy="160" r="5" fill="#3C5488"/>
  <text x="290" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">v2  SET NX EX</text>
  <text x="290" y="134" text-anchor="middle" font-size="11" fill="#6B7280">一条命令原子加锁</text>
  <text x="290" y="186" text-anchor="middle" font-size="11" fill="#6B7280">但可能删错别人的锁</text>

  <!-- v3 -->
  <circle cx="450" cy="160" r="5" fill="#4DBBD5"/>
  <text x="450" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">v3  唯一 value + Lua</text>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#6B7280">比对标识再删，防误删</text>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#6B7280">TTL 仍难定：长崩等 / 短失效</text>

  <!-- v4 -->
  <circle cx="610" cy="160" r="5" fill="#00A087"/>
  <text x="610" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">v4  Redisson 看门狗</text>
  <text x="610" y="134" text-anchor="middle" font-size="11" fill="#6B7280">每 10s 自动续期到 30s</text>
  <text x="610" y="186" text-anchor="middle" font-size="11" fill="#6B7280">工业级默认答案</text>

  <!-- v5 -->
  <circle cx="750" cy="160" r="5" fill="#8491B4"/>
  <text x="750" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">v5  RedLock</text>
  <text x="750" y="134" text-anchor="middle" font-size="11" fill="#6B7280">多实例多数派加锁</text>
  <text x="750" y="186" text-anchor="middle" font-size="11" fill="#6B7280">存在时钟与停顿争议</text>

  <text x="410" y="262" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜分布式锁的四次进化：每一步都在修上一步的坑</text>
  <text x="410" y="284" text-anchor="middle" font-size="12" fill="#6B7280">主线：原子性 → 归属权 → 存活期 三个问题依次解决</text>
</svg>
