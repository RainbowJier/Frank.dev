<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="390" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="389" fill="none" stroke="#D9DFE8"/>

  <!-- 顶部：请求结构 -->
  <text x="410" y="34" text-anchor="middle" font-size="12" fill="#6B7280">ChatRequest = 消息列表 + 模型参数 + 工具声明</text>

  <!-- 角色标签（左） -->
  <g font-size="11" fill="#6B7280" text-anchor="end">
    <text x="238" y="78">system</text>
    <text x="238" y="137">user</text>
    <text x="238" y="196">assistant</text>
    <text x="238" y="255">tool</text>
    <text x="238" y="314">assistant</text>
  </g>

  <!-- 消息栈 -->
  <g stroke-width="1.5">
    <rect x="250" y="52"  width="320" height="46" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4"/>
    <rect x="250" y="111" width="320" height="46" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="250" y="170" width="320" height="46" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
    <rect x="250" y="229" width="320" height="46" rx="6" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F"/>
    <rect x="250" y="288" width="320" height="46" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
  </g>
  <g font-size="14" font-weight="500" fill="#252A33">
    <text x="266" y="72">SystemMessage</text>
    <text x="266" y="131">UserMessage</text>
    <text x="266" y="190">AiMessage</text>
    <text x="266" y="249">ToolExecutionResultMessage</text>
    <text x="266" y="308">AiMessage（最终回答）</text>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="266" y="89">人设与规则，每轮置顶</text>
    <text x="266" y="148">本轮输入；RAG 命中内容注入处</text>
    <text x="266" y="207">模型决策：直接回答 或 请求调用工具</text>
    <text x="266" y="266">工具执行结果回填（JSON 字符串）</text>
    <text x="266" y="325">流式逐 token 输出</text>
  </g>

  <!-- 右侧引线标注 -->
  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="570" y1="133" x2="610" y2="133"/>
    <line x1="570" y1="193" x2="610" y2="193"/>
  </g>
  <circle cx="574" cy="133" r="2.5" fill="#9AA4B2"/>
  <circle cx="574" cy="193" r="2.5" fill="#9AA4B2"/>
  <g font-size="11" fill="#6B7280">
    <text x="616" y="130">检索增强的注入点</text>
    <text x="616" y="146">（默认拼在用户消息里）</text>
    <text x="616" y="190">toolExecutionRequests</text>
    <text x="616" y="206">→ 交给 ToolExecutor</text>
  </g>

  <!-- 底部：响应结构 -->
  <text x="410" y="366" text-anchor="middle" font-size="12" fill="#6B7280">ChatResponse = AiMessage + TokenUsage + FinishReason</text>

  <text x="410" y="384" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜LangChain4j 的消息模型：一次请求就是一个有序的 ChatMessage 列表</text>
</svg>
