<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="399" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：无熔断 -->
  <rect x="40" y="40" width="360" height="310" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">没有熔断：一路雪崩</text>

  <rect x="90" y="90" width="260" height="48" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="220" y="119" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">订单服务突然宕机</text>

  <line x1="220" y1="140" x2="220" y2="154" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="152" font-size="11" fill="#6B7280">请求还在源源不断进来</text>

  <rect x="90" y="158" width="260" height="48" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="220" y="187" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">每个请求都等满 30s 超时</text>

  <line x1="220" y1="208" x2="220" y2="222" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="220" font-size="11" fill="#6B7280">同步等待占用线程</text>

  <rect x="90" y="226" width="260" height="48" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="220" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">网关线程池 200 个线程耗尽</text>

  <line x1="220" y1="276" x2="220" y2="290" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="288" font-size="11" fill="#6B7280">其他服务也排不上队</text>

  <rect x="90" y="294" width="260" height="48" rx="6" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="1.5"/>
  <text x="220" y="323" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">全站接口集体 502</text>

  <!-- 面板 B：有熔断 -->
  <rect x="420" y="40" width="360" height="310" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="466" y="71" font-size="14" font-weight="600" fill="#252A33">有熔断：故障被隔离</text>

  <rect x="470" y="90" width="260" height="48" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="600" y="119" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">订单服务突然宕机</text>

  <line x1="600" y1="140" x2="600" y2="154" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="152" font-size="11" fill="#6B7280">失败率超过熔断阈值</text>

  <rect x="470" y="158" width="260" height="48" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="600" y="187" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">熔断器打开，请求毫秒级失败</text>

  <line x1="600" y1="208" x2="600" y2="222" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="220" font-size="11" fill="#6B7280">快速失败走降级</text>

  <rect x="470" y="226" width="260" height="48" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="600" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">降级接口返回兜底数据</text>

  <line x1="600" y1="276" x2="600" y2="290" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="288" font-size="11" fill="#6B7280">网关线程几乎不占用</text>

  <rect x="470" y="294" width="260" height="48" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="600" y="323" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">商品、用户服务不受影响</text>

  <text x="410" y="378" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜同一场下游故障：无熔断时雪崩拖垮全站，有熔断时被隔离在单个接口内</text>
</svg>
