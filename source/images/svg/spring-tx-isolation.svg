<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="356" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="355" fill="none" stroke="#D9DFE8"/>

  <!-- 图例 -->
  <circle cx="596" cy="38" r="5" fill="#E64B35"/>
  <text x="606" y="42" font-size="11" fill="#6B7280">可能发生</text>
  <circle cx="676" cy="38" r="5" fill="#00A087"/>
  <text x="686" y="42" font-size="11" fill="#6B7280">已杜绝</text>

  <!-- 表头 -->
  <rect x="60" y="54" width="700" height="38" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="80" y="78" font-size="13" font-weight="600" fill="#252A33">隔离级别</text>
  <text x="410" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">脏读</text>
  <text x="550" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">不可重复读</text>
  <text x="690" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">幻读</text>

  <!-- MySQL 默认行高亮 -->
  <rect x="61" y="196.5" width="698" height="51" fill="#00A087" fill-opacity="0.05"/>

  <!-- 分隔线 -->
  <g stroke="#E8EDF3" stroke-width="1">
    <line x1="60" y1="92"  x2="760" y2="92"/>
    <line x1="60" y1="144" x2="760" y2="144"/>
    <line x1="60" y1="196" x2="760" y2="196"/>
    <line x1="60" y1="248" x2="760" y2="248"/>
    <line x1="60" y1="300" x2="760" y2="300"/>
    <line x1="340" y1="54" x2="340" y2="300"/>
    <line x1="480" y1="54" x2="480" y2="300"/>
    <line x1="620" y1="54" x2="620" y2="300"/>
  </g>
  <rect x="60" y="54" width="700" height="246" fill="none" stroke="#D9DFE8"/>

  <!-- 行 1：READ UNCOMMITTED -->
  <text x="80" y="116" font-size="13" font-weight="600" fill="#252A33">READ UNCOMMITTED</text>
  <text x="80" y="132" font-size="11" fill="#6B7280">几乎不使用</text>
  <circle cx="410" cy="118" r="6" fill="#E64B35"/>
  <circle cx="550" cy="118" r="6" fill="#E64B35"/>
  <circle cx="690" cy="118" r="6" fill="#E64B35"/>

  <!-- 行 2：READ COMMITTED -->
  <text x="80" y="168" font-size="13" font-weight="600" fill="#252A33">READ COMMITTED</text>
  <text x="80" y="184" font-size="11" fill="#6B7280">Oracle / PostgreSQL 默认</text>
  <circle cx="410" cy="170" r="6" fill="#00A087"/>
  <circle cx="550" cy="170" r="6" fill="#E64B35"/>
  <circle cx="690" cy="170" r="6" fill="#E64B35"/>

  <!-- 行 3：REPEATABLE READ -->
  <text x="80" y="220" font-size="13" font-weight="600" fill="#252A33">REPEATABLE READ</text>
  <text x="80" y="236" font-size="11" fill="#6B7280">MySQL InnoDB 默认</text>
  <circle cx="410" cy="222" r="6" fill="#00A087"/>
  <circle cx="550" cy="222" r="6" fill="#00A087"/>
  <circle cx="690" cy="222" r="6" fill="#00A087"/>

  <!-- 行 4：SERIALIZABLE -->
  <text x="80" y="272" font-size="13" font-weight="600" fill="#252A33">SERIALIZABLE</text>
  <text x="80" y="288" font-size="11" fill="#6B7280">完全串行，性能开销最大</text>
  <circle cx="410" cy="274" r="6" fill="#00A087"/>
  <circle cx="550" cy="274" r="6" fill="#00A087"/>
  <circle cx="690" cy="274" r="6" fill="#00A087"/>

  <text x="410" y="318" text-anchor="middle" font-size="11" fill="#6B7280">注：InnoDB 的 REPEATABLE READ 通过 MVCC 与间隙锁基本杜绝幻读</text>
  <text x="410" y="340" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜四大隔离级别与三类读异常对照</text>
</svg>
