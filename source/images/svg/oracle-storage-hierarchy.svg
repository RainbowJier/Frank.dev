<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="450" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="449" fill="none" stroke="#D9DFE8"/>

  <!-- 表空间（最外层） -->
  <rect x="60" y="56" width="560" height="310" rx="10" fill="#3C5488" fill-opacity="0.08" stroke="#3C5488" stroke-width="2"/>
  <text x="84" y="86" font-size="14" font-weight="600" fill="#252A33">表空间 Tablespace</text>
  <text x="84" y="106" font-size="11" fill="#6B7280">逻辑容器：USERS、SYSTEM…</text>

  <!-- 段 -->
  <rect x="100" y="124" width="480" height="216" rx="8" fill="#4DBBD5" fill-opacity="0.10" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="124" y="152" font-size="13" font-weight="600" fill="#252A33">段 Segment</text>
  <text x="124" y="170" font-size="11" fill="#6B7280">一张表（或一个索引）对应一个段</text>

  <!-- 区 ×3 -->
  <g fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5">
    <rect x="124" y="186" width="132" height="90" rx="6"/>
    <rect x="268" y="186" width="132" height="90" rx="6"/>
    <rect x="412" y="186" width="132" height="90" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#252A33">
    <text x="190" y="214">区 Extent</text>
    <text x="334" y="214">区 Extent</text>
    <text x="478" y="214">区 Extent</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="334" y="238">连续的数据块</text>
    <text x="334" y="256">（默认 1MB 起）</text>
    <text x="478" y="238">扩容的单位</text>
    <text x="478" y="256">（空间按区增长）</text>
  </g>

  <!-- 区 1 内的数据块 -->
  <g fill="#F39B7F" fill-opacity="0.25" stroke="#F39B7F" stroke-width="1">
    <rect x="140" y="230" width="18" height="18" rx="2"/>
    <rect x="162" y="230" width="18" height="18" rx="2"/>
    <rect x="184" y="230" width="18" height="18" rx="2"/>
    <rect x="206" y="230" width="18" height="18" rx="2"/>
    <rect x="228" y="230" width="18" height="18" rx="2"/>
  </g>
  <text x="190" y="268" text-anchor="middle" font-size="11" fill="#6B7280">8KB 块（最小 I/O）</text>

  <!-- 右侧引线标注 -->
  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="620" y1="91" x2="668" y2="91"/>
    <line x1="580" y1="148" x2="668" y2="148"/>
    <line x1="544" y1="231" x2="668" y2="231"/>
  </g>
  <circle cx="620" cy="91" r="2.5" fill="#9AA4B2"/>
  <circle cx="580" cy="148" r="2.5" fill="#9AA4B2"/>
  <circle cx="544" cy="231" r="2.5" fill="#9AA4B2"/>
  <g font-size="11" fill="#6B7280">
    <text x="674" y="89">对应一个或多个</text>
    <text x="674" y="105">.dbf 数据文件</text>
    <text x="674" y="152">表 = 段（索引同）</text>
    <text x="674" y="229">连续块的集合</text>
    <text x="674" y="245">扩容按区进行</text>
  </g>

  <text x="410" y="388" text-anchor="middle" font-size="11" fill="#6B7280">例：USERS 表空间 → users01.dbf → 表 FRANK.USERS 的段 → 若干区 → 8KB 块</text>
  <text x="410" y="420" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜Oracle 逻辑存储层级：表空间 → 段 → 区 → 块（按区扩容、按块读写）</text>
</svg>
