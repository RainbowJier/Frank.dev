<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="470" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="469" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：created 发请求 -->
  <rect x="40" y="36" width="740" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="60" y="68" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="82" y="67" font-size="14" font-weight="600" fill="#252A33">created / setup 发请求 —— 渲染与请求并行</text>
  <text x="748" y="105" text-anchor="end" font-size="11" fill="#6B7280">总耗时 ≈ max(渲染, 请求)</text>

  <text x="118" y="105" text-anchor="end" font-size="11" fill="#6B7280">组件</text>
  <rect x="130" y="94" width="60"  height="16" fill="#3C5488" fill-opacity="0.85"/>
  <rect x="190" y="94" width="140" height="16" fill="#4DBBD5" fill-opacity="0.85"/>
  <rect x="330" y="94" width="70"  height="16" fill="#F39B7F" fill-opacity="0.85"/>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="160" y="124">初始化</text>
    <text x="260" y="124">渲染 DOM</text>
    <text x="365" y="124">更新</text>
  </g>

  <text x="118" y="153" text-anchor="end" font-size="11" fill="#6B7280">网络</text>
  <rect x="190" y="142" width="140" height="16" fill="#8491B4" fill-opacity="0.45"/>
  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#6B7280">等待响应（与渲染并行）</text>

  <line x1="190" y1="112" x2="190" y2="138" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="130" font-size="11" fill="#6B7280">created 发出请求</text>

  <line x1="400" y1="90" x2="400" y2="178" stroke="#00A087" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="192" text-anchor="middle" font-size="11" fill="#00A087">首屏数据就绪</text>

  <!-- 面板 B：mounted 发请求 -->
  <rect x="40" y="246" width="740" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="60" y="278" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="82" y="277" font-size="14" font-weight="600" fill="#252A33">mounted 发请求 —— 渲染完才发，串行等待</text>
  <text x="748" y="296" text-anchor="end" font-size="11" fill="#6B7280">总耗时 = 渲染 + 请求（串行）</text>

  <text x="118" y="315" text-anchor="end" font-size="11" fill="#6B7280">组件</text>
  <rect x="130" y="304" width="60"  height="16" fill="#3C5488" fill-opacity="0.85"/>
  <rect x="190" y="304" width="140" height="16" fill="#4DBBD5" fill-opacity="0.85"/>
  <rect x="650" y="304" width="70"  height="16" fill="#F39B7F" fill-opacity="0.85"/>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="160" y="334">初始化</text>
    <text x="260" y="334">渲染 DOM</text>
    <text x="685" y="334">更新</text>
  </g>

  <text x="118" y="363" text-anchor="end" font-size="11" fill="#6B7280">网络</text>
  <rect x="330" y="352" width="320" height="16" fill="#8491B4" fill-opacity="0.45"/>
  <text x="490" y="382" text-anchor="middle" font-size="11" fill="#6B7280">等待响应（同样的时长）</text>

  <!-- 红色警示：网络空等 -->
  <rect x="190" y="348" width="140" height="24" rx="4" fill="none" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#E64B35">网络空等</text>

  <line x1="330" y1="322" x2="330" y2="348" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="336" y="340" font-size="11" fill="#6B7280">mounted 才发请求</text>

  <line x1="720" y1="300" x2="720" y2="388" stroke="#00A087" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="720" y="402" text-anchor="middle" font-size="11" fill="#00A087">首屏数据就绪</text>

  <text x="410" y="456" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜同一请求放不同钩子：created 与渲染并行，mounted 串行空等（时长为示意）</text>
</svg>
