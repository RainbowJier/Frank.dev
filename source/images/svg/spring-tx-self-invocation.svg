<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="440" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="439" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E64B35"/>
    </marker>
  </defs>

  <!-- 面板 A：外部调用，事务生效 -->
  <rect x="40" y="40" width="360" height="350" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="88" y="71" font-size="14" font-weight="600" fill="#252A33">外部调用 · 事务生效</text>

  <rect x="150" y="100" width="140" height="40" rx="6" fill="#F4F7FA" stroke="#8491B4" stroke-width="1.5"/>
  <text x="220" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">调用方</text>

  <line x1="220" y1="140" x2="220" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="155" font-size="11" fill="#6B7280">经代理</text>

  <rect x="130" y="166" width="180" height="46" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="220" y="188" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">事务代理</text>
  <text x="220" y="204" text-anchor="middle" font-size="11" fill="#6B7280">TransactionInterceptor</text>

  <line x1="220" y1="212" x2="220" y2="232" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="227" font-size="11" fill="#6B7280">开启事务后放行</text>

  <rect x="130" y="238" width="180" height="46" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="220" y="260" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">methodB()</text>
  <text x="220" y="276" text-anchor="middle" font-size="11" fill="#6B7280">@Transactional</text>

  <circle cx="158" cy="374" r="3.5" fill="#00A087"/>
  <text x="170" y="378" font-size="12" fill="#252A33">事务生效：注解被代理拦截</text>

  <!-- 面板 B：同类自调用，事务失效 -->
  <rect x="420" y="40" width="360" height="350" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="468" y="71" font-size="14" font-weight="600" fill="#252A33">同类自调用 · 事务失效</text>

  <rect x="510" y="100" width="140" height="40" rx="6" fill="#F4F7FA" stroke="#8491B4" stroke-width="1.5"/>
  <text x="580" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">调用方</text>

  <line x1="580" y1="140" x2="580" y2="158" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="164" width="180" height="46" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="580" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">事务代理</text>
  <text x="580" y="200" text-anchor="middle" font-size="11" fill="#6B7280">methodA 无注解，直接放行</text>

  <line x1="580" y1="210" x2="580" y2="226" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="232" width="180" height="46" rx="6" fill="#3C5488" fill-opacity="0.06" stroke="#3C5488" stroke-width="1.5"/>
  <text x="580" y="252" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">methodA()</text>
  <text x="580" y="268" text-anchor="middle" font-size="11" fill="#6B7280">无 @Transactional</text>

  <!-- this 调用：绕过代理 -->
  <line x1="580" y1="278" x2="580" y2="296" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="568" y="291" text-anchor="end" font-size="11" fill="#6B7280">绕过代理</text>
  <text x="592" y="291" font-size="11" fill="#6B7280">this.methodB()</text>

  <rect x="490" y="302" width="180" height="46" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="580" y="324" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">methodB()</text>
  <text x="580" y="340" text-anchor="middle" font-size="11" fill="#6B7280">@Transactional 被无视</text>

  <circle cx="458" cy="374" r="3.5" fill="#E64B35"/>
  <text x="470" y="378" font-size="12" fill="#252A33">事务失效：注解从未被拦截</text>

  <text x="410" y="420" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜自调用失效根源：this 调用直达目标对象，绕过了代理</text>
</svg>
