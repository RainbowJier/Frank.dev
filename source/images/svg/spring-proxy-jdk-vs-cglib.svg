<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="430" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="429" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：JDK 动态代理 -->
  <rect x="40" y="40" width="360" height="290" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">JDK 动态代理：基于接口</text>

  <rect x="120" y="86" width="200" height="38" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="220" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">UserService 接口</text>

  <line x1="139" y1="164" x2="170" y2="126" stroke="#9AA4B2" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="132" y="150" font-size="11" fill="#6B7280">implements</text>
  <line x1="321" y1="164" x2="270" y2="126" stroke="#9AA4B2" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="308" y="150" font-size="11" fill="#6B7280">implements</text>

  <rect x="64" y="164" width="150" height="46" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="139" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Proxy$0</text>
  <text x="139" y="200" text-anchor="middle" font-size="11" fill="#6B7280">运行时生成</text>
  <rect x="246" y="164" width="150" height="46" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="321" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">UserServiceImpl</text>
  <text x="321" y="200" text-anchor="middle" font-size="11" fill="#6B7280">目标对象</text>

  <g font-size="11" fill="#6B7280">
    <text x="64" y="238">调用先进入 InvocationHandler.invoke()</text>
    <text x="64" y="258">方法内部再用反射调用目标</text>
    <text x="64" y="278">前提：目标类必须实现接口</text>
  </g>

  <!-- 面板 B：CGLIB -->
  <rect x="420" y="40" width="360" height="290" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="466" y="71" font-size="14" font-weight="600" fill="#252A33">CGLIB：基于继承</text>

  <rect x="500" y="86" width="220" height="38" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="610" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">UserServiceImpl（目标类）</text>

  <line x1="610" y1="124" x2="610" y2="156" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="146" font-size="11" fill="#6B7280">继承并覆写方法</text>

  <rect x="500" y="162" width="220" height="46" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="610" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Enhancer 生成的子类</text>
  <text x="610" y="198" text-anchor="middle" font-size="11" fill="#6B7280">FastClass 索引调用，不走反射</text>

  <g font-size="11" fill="#6B7280">
    <text x="444" y="238">final / private / static 方法拦不住</text>
    <text x="444" y="258">final 类无法生成子类</text>
    <text x="444" y="278">无需接口，对业务类零侵入</text>
  </g>

  <!-- 关键事实 -->
  <rect x="40" y="350" width="740" height="42" rx="8" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="410" y="376" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">Spring Boot 2.x 起 AOP 默认 proxy-target-class=true —— 有没有接口，都走 CGLIB</text>

  <text x="410" y="414" text-anchor="middle" font-size="12" fill="#6B7280">图 5｜JDK 动态代理与 CGLIB 的构造方式及默认选型</text>
</svg>
