<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="399" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：注解声明式 -->
  <rect x="40" y="40" width="232" height="290" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="70" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="69" font-size="14" font-weight="600" fill="#252A33">注解声明式</text>
  <g font-size="12" fill="#252A33">
    <circle cx="72" cy="110" r="3" fill="#00A087"/>
    <text x="86" y="114">方法即工具，@Tool 标注</text>
    <circle cx="72" cy="146" r="3" fill="#00A087"/>
    <text x="86" y="150">参数自动生成 JSON Schema</text>
    <circle cx="72" cy="182" r="3" fill="#00A087"/>
    <text x="86" y="186">@P 补充参数含义描述</text>
    <circle cx="72" cy="218" r="3" fill="#00A087"/>
    <text x="86" y="222">tools(myService) 一行注册</text>
  </g>
  <text x="64" y="268" font-size="11" fill="#6B7280">适合：工具固定、与业务 Bean</text>
  <text x="64" y="286" font-size="11" fill="#6B7280">方法一一对应的场景</text>

  <!-- 面板 B：手工绑定式 -->
  <rect x="294" y="40" width="232" height="290" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="318" y="70" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="340" y="69" font-size="14" font-weight="600" fill="#252A33">手工绑定式</text>
  <g font-size="12" fill="#252A33">
    <circle cx="326" cy="110" r="3" fill="#4DBBD5"/>
    <text x="340" y="114">ToolSpecification 显式声明</text>
    <circle cx="326" cy="146" r="3" fill="#4DBBD5"/>
    <text x="340" y="150">tools(Map) 绑定执行器</text>
    <circle cx="326" cy="182" r="3" fill="#4DBBD5"/>
    <text x="340" y="186">工具目录可运行时增删</text>
    <circle cx="326" cy="218" r="3" fill="#4DBBD5"/>
    <text x="340" y="222">按用户/智能体过滤可用集</text>
  </g>
  <text x="318" y="268" font-size="11" fill="#6B7280">适合：工具来自注册表、需要</text>
  <text x="318" y="286" font-size="11" fill="#6B7280">权限过滤的动态场景</text>

  <!-- 面板 C：执行与钩子 -->
  <rect x="548" y="40" width="232" height="290" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="572" y="70" font-size="18" font-weight="700" fill="#3C5488">C</text>
  <text x="594" y="69" font-size="14" font-weight="600" fill="#252A33">执行与钩子</text>
  <g font-size="12" fill="#252A33">
    <circle cx="580" cy="110" r="3" fill="#F39B7F"/>
    <text x="594" y="114">beforeToolExecution 前置回调</text>
    <circle cx="580" cy="146" r="3" fill="#F39B7F"/>
    <text x="594" y="150">onToolExecuted 完成回调</text>
    <circle cx="580" cy="182" r="3" fill="#F39B7F"/>
    <text x="594" y="186">返回 String 自由决定</text>
    <circle cx="580" cy="218" r="3" fill="#F39B7F"/>
    <text x="594" y="222">异常可转 error JSON 回填</text>
  </g>
  <text x="572" y="268" font-size="11" fill="#6B7280">钩子统一做推送、日志、审计，</text>
  <text x="572" y="286" font-size="11" fill="#6B7280">业务工具保持纯粹</text>

  <text x="410" y="372" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜工具的三种接入姿态：注解声明、手工绑定与执行钩子</text>
</svg>
