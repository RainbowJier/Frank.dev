<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="470" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="469" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F39B7F"/>
    </marker>
  </defs>

  <!-- 面板 A：惰性删除 -->
  <rect x="40" y="40" width="740" height="185" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">惰性删除 · 访问时才检查</text>

  <rect x="70" y="95" width="120" height="50" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="130" y="124" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">命令访问 key</text>
  <line x1="192" y1="120" x2="218" y2="120" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="222" y="95" width="120" height="50" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="282" y="116" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">查过期字典</text>
  <text x="282" y="136" text-anchor="middle" font-size="11" fill="#6B7280">expires dict</text>
  <line x1="344" y1="108" x2="370" y2="108" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="357" y="100" text-anchor="middle" font-size="11" fill="#6B7280">未过期</text>
  <rect x="374" y="87" width="110" height="42" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="429" y="113" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">正常执行</text>
  <line x1="344" y1="138" x2="370" y2="138" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="357" y="156" text-anchor="middle" font-size="11" fill="#6B7280">已过期</text>
  <rect x="374" y="117" width="110" height="42" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="429" y="143" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">删除返回 nil</text>

  <text x="530" y="110" font-size="12" fill="#6B7280">优点：CPU 友好，</text>
  <text x="530" y="130" font-size="12" fill="#6B7280">不访问不花一分开销</text>
  <circle cx="534" cy="151" r="3" fill="#E64B35"/>
  <text x="544" y="155" font-size="12" fill="#252A33">漏洞：无人访问的过期</text>
  <text x="544" y="173" font-size="12" fill="#252A33">key 持续占用内存</text>

  <!-- 面板 B：定期删除 -->
  <rect x="40" y="245" width="740" height="185" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="277" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="86" y="276" font-size="14" font-weight="600" fill="#252A33">定期删除 · 默认每秒 10 次（hz=10）</text>

  <rect x="70" y="300" width="130" height="50" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="135" y="322" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">随机抽 20 个</text>
  <text x="135" y="340" text-anchor="middle" font-size="11" fill="#6B7280">过期字典中抽样</text>
  <line x1="202" y1="325" x2="228" y2="325" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="232" y="300" width="120" height="50" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="292" y="329" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">删除已过期</text>
  <line x1="354" y1="325" x2="380" y2="325" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="384" y="300" width="140" height="50" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="454" y="322" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">过期比例超 25%？</text>
  <text x="454" y="340" text-anchor="middle" font-size="11" fill="#6B7280">自适应节奏</text>

  <!-- 反馈回路：比例高 → 再来一轮 -->
  <path d="M454 354 C454 376 135 376 135 354" stroke="#F39B7F" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="294" y="380" text-anchor="middle" font-size="11" fill="#F39B7F">是：堆积严重，再来一轮抽样</text>
  <line x1="526" y1="325" x2="552" y2="325" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="539" y="317" text-anchor="middle" font-size="11" fill="#6B7280">否</text>
  <rect x="556" y="300" width="100" height="50" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="606" y="329" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">本轮结束</text>

  <text x="410" y="452" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜过期删除：惰性删除与定期删除双管齐下</text>
</svg>
