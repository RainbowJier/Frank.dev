<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="420" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="419" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E64B35"/>
    </marker>
  </defs>

  <!-- 生产者 -->
  <rect x="30" y="160" width="150" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="105" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">RecordServiceImpl</text>
  <text x="105" y="202" text-anchor="middle" font-size="11" fill="#6B7280">convertAndSend</text>

  <!-- 交换机 -->
  <rect x="230" y="160" width="160" height="56" rx="28" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="310" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Topic 交换机</text>
  <text x="310" y="202" text-anchor="middle" font-size="11" fill="#6B7280">data-download.exchange</text>

  <line x1="182" y1="188" x2="226" y2="188" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 三个业务队列 -->
  <g stroke="#3C5488" stroke-width="1.5" fill="#3C5488" fill-opacity="0.10">
    <rect x="460" y="60"  width="170" height="56" rx="6"/>
    <rect x="460" y="160" width="170" height="56" rx="6"/>
    <rect x="460" y="260" width="170" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="545" y="84">basic.queue</text>
    <text x="545" y="184">core.queue</text>
    <text x="545" y="284">core-old.queue</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="545" y="102">基础类 · 优先级队列</text>
    <text x="545" y="202">新核心类 · 优先级队列</text>
    <text x="545" y="302">旧核心类 · 优先级队列</text>
  </g>

  <!-- 路由键标注（队列上方） -->
  <g font-size="11" fill="#6B7280">
    <text x="460" y="52">data-download.basic</text>
    <text x="460" y="152">data-download.core</text>
    <text x="460" y="252">data-download.core-old</text>
  </g>

  <!-- 交换机 → 队列 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="390" y1="172" x2="456" y2="92"  marker-end="url(#arrow)"/>
    <line x1="390" y1="188" x2="456" y2="188" marker-end="url(#arrow)"/>
    <line x1="390" y1="204" x2="456" y2="284" marker-end="url(#arrow)"/>
  </g>

  <!-- 消费者 -->
  <g stroke="#00A087" stroke-width="1.5" fill="#FFFFFF">
    <rect x="676" y="60"  width="110" height="56" rx="6"/>
    <rect x="676" y="160" width="110" height="56" rx="6"/>
    <rect x="676" y="260" width="110" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="731" y="84">消费者</text>
    <text x="731" y="184">消费者</text>
    <text x="731" y="284">消费者</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="731" y="102">Basic</text>
    <text x="731" y="202">Core</text>
    <text x="731" y="302">CoreOld</text>
  </g>

  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="632" y1="88"  x2="672" y2="88"  marker-end="url(#arrow)"/>
    <line x1="632" y1="188" x2="672" y2="188" marker-end="url(#arrow)"/>
    <line x1="632" y1="288" x2="672" y2="288" marker-end="url(#arrow)"/>
  </g>
  <text x="653" y="176" text-anchor="middle" font-size="11" fill="#6B7280">CAS 抢占</text>

  <!-- 死信：红色虚线（全图唯一警示色） -->
  <g stroke="#E64B35" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M 545 118 C 545 230, 505 250, 505 326" marker-end="url(#arrowRed)"/>
    <path d="M 545 218 C 545 268, 520 280, 512 326" marker-end="url(#arrowRed)"/>
    <path d="M 545 318 C 545 332, 536 336, 530 330" marker-end="url(#arrowRed)"/>
  </g>
  <circle cx="530" cy="290" r="2.5" fill="#9AA4B2"/>
  <line x1="530" y1="290" x2="400" y2="290" stroke="#9AA4B2" stroke-width="1"/>
  <text x="394" y="294" text-anchor="end" font-size="11" fill="#6B7280">消费失败 · 重试 3 次耗尽</text>

  <rect x="460" y="330" width="170" height="52" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="545" y="351" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">DLX 交换机</text>
  <text x="545" y="369" text-anchor="middle" font-size="11" fill="#6B7280">dlx.exchange</text>

  <rect x="676" y="330" width="110" height="52" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="731" y="351" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">死信队列</text>
  <text x="731" y="369" text-anchor="middle" font-size="11" fill="#6B7280">dlx.queue</text>

  <line x1="632" y1="356" x2="672" y2="356" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>

  <text x="410" y="404" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜RabbitMQ 队列拓扑与死信路由</text>
</svg>
