<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" width="820" height="510"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="510" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="509" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F39B7F"/>
    </marker>
  </defs>

  <!-- 面板 A：近似 LRU -->
  <rect x="40" y="36" width="740" height="170" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="66" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="65" font-size="14" font-weight="600" fill="#252A33">近似 LRU · 随机采样淘汰</text>

  <rect x="70" y="88" width="110" height="48" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="125" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">内存达到</text>
  <text x="125" y="128" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">maxmemory</text>
  <line x1="182" y1="112" x2="208" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="212" y="88" width="140" height="48" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="282" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">随机采样 N 个</text>
  <text x="282" y="128" text-anchor="middle" font-size="11" fill="#6B7280">maxmemory-samples=5</text>
  <line x1="354" y1="112" x2="380" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="384" y="88" width="150" height="48" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="459" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">淘汰池挑最久未用</text>
  <text x="459" y="128" text-anchor="middle" font-size="11" fill="#6B7280">eviction pool 排序</text>
  <line x1="536" y1="112" x2="562" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="566" y="88" width="100" height="48" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="616" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">腾出空间</text>
  <text x="616" y="128" text-anchor="middle" font-size="11" fill="#6B7280">仍满则再来</text>

  <text x="70" y="168" font-size="12" fill="#6B7280">无需全局双向链表，开销 O(采样数)；采样数越大越接近真 LRU，也越耗 CPU</text>

  <!-- 面板 B：LFU -->
  <rect x="40" y="222" width="740" height="120" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="252" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="86" y="251" font-size="14" font-weight="600" fill="#252A33">LFU · 按访问频率淘汰（4.0+）</text>

  <circle cx="78" cy="278" r="3" fill="#4DBBD5"/>
  <text x="92" y="282" font-size="13" fill="#252A33">8-bit Morris 概率计数：越热越难 +1，只存相对频率</text>
  <circle cx="78" cy="304" r="3" fill="#4DBBD5"/>
  <text x="92" y="308" font-size="13" fill="#252A33">衰减：长时间不访问自动降温（lfu-decay-time 默认 1 分钟）</text>
  <circle cx="78" cy="330" r="3" fill="#00A087"/>
  <text x="92" y="334" font-size="13" fill="#252A33">专治「偶然被访问一次的伪热点」：LRU 的盲区</text>

  <!-- 八种策略一览 -->
  <text x="40" y="382" font-size="13" font-weight="600" fill="#3C5488">maxmemory-policy 八种策略</text>
  <text x="200" y="382" font-size="11" fill="#6B7280">（volatile-* 只作用于设置了 TTL 的 key）</text>

  <g font-size="11" text-anchor="middle" fill="#252A33">
    <rect x="40" y="396" width="170" height="30" rx="15" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35" stroke-width="1.5"/>
    <text x="125" y="415" fill="#252A33">noeviction（写满报错）</text>
    <rect x="230" y="396" width="170" height="30" rx="15" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
    <text x="315" y="415">volatile-lru</text>
    <rect x="420" y="396" width="170" height="30" rx="15" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
    <text x="505" y="415">allkeys-lru（缓存常用）</text>
    <rect x="610" y="396" width="170" height="30" rx="15" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
    <text x="695" y="415">volatile-lfu</text>

    <rect x="40" y="434" width="170" height="30" rx="15" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
    <text x="125" y="453">allkeys-lfu（冷热分层）</text>
    <rect x="230" y="434" width="170" height="30" rx="15" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
    <text x="315" y="453">volatile-random</text>
    <rect x="420" y="434" width="170" height="30" rx="15" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
    <text x="505" y="453">allkeys-random</text>
    <rect x="610" y="434" width="170" height="30" rx="15" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
    <text x="695" y="453">volatile-ttl</text>
  </g>

  <text x="410" y="492" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜内存淘汰：近似 LRU 采样流程、LFU 计数衰减与八种策略</text>
</svg>
