<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="360" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="359" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A -->
  <rect x="40" y="40" width="350" height="260" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">单线程：两次自增必然正确</text>

  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="139" y="104">t1</text><text x="205" y="104">t2</text>
    <text x="271" y="104">t3</text><text x="337" y="104">t4</text>
  </g>
  <text x="64" y="148" font-size="12" fill="#252A33">线程 A</text>
  <g stroke="#3C5488" stroke-width="1.5" fill="#3C5488" fill-opacity="0.10">
    <rect x="108" y="124" width="62" height="38" rx="6"/>
    <rect x="174" y="124" width="62" height="38" rx="6"/>
    <rect x="240" y="124" width="62" height="38" rx="6"/>
    <rect x="306" y="124" width="62" height="38" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#252A33">
    <text x="139" y="148">读 i=0</text>
    <text x="205" y="140">写回</text><text x="205" y="156">i=1</text>
    <text x="271" y="148">读 i=1</text>
    <text x="337" y="140">写回</text><text x="337" y="156">i=2</text>
  </g>

  <circle cx="70" cy="196" r="3" fill="#00A087"/>
  <text x="82" y="200" font-size="13" fill="#252A33">最终 i = 2，两次自增都生效</text>
  <text x="64" y="244" font-size="12" fill="#6B7280">串行执行，读改写期间没有他人插入</text>

  <!-- 面板 B -->
  <rect x="430" y="40" width="350" height="260" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="454" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="476" y="71" font-size="14" font-weight="600" fill="#252A33">多线程：交错执行丢失更新</text>

  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="539" y="104">t1</text><text x="605" y="104">t2</text>
    <text x="671" y="104">t3</text><text x="737" y="104">t4</text>
  </g>

  <!-- 行 A：线程 A -->
  <text x="464" y="148" font-size="12" fill="#252A33">线程 A</text>
  <rect x="508" y="124" width="62" height="38" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="574" y="124" width="62" height="38" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="640" y="124" width="62" height="38" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="706" y="124" width="62" height="38" rx="6" fill="#F4F7FA" stroke="#E8EDF3" stroke-width="1"/>
  <g text-anchor="middle" font-size="11" fill="#252A33">
    <text x="539" y="148">读 i=0</text>
    <text x="605" y="148">加 1</text>
    <text x="671" y="140">写回</text><text x="671" y="156">i=1</text>
    <text x="737" y="148" fill="#6B7280">—</text>
  </g>

  <!-- 行 B：线程 B -->
  <text x="464" y="192" font-size="12" fill="#252A33">线程 B</text>
  <rect x="508" y="168" width="62" height="38" rx="6" fill="#F4F7FA" stroke="#E8EDF3" stroke-width="1"/>
  <rect x="574" y="168" width="62" height="38" rx="6" fill="#4DBBD5" fill-opacity="0.10" stroke="#4DBBD5" stroke-width="1.5"/>
  <rect x="640" y="168" width="62" height="38" rx="6" fill="#4DBBD5" fill-opacity="0.10" stroke="#4DBBD5" stroke-width="1.5"/>
  <rect x="706" y="168" width="62" height="38" rx="6" fill="#4DBBD5" fill-opacity="0.10" stroke="#4DBBD5" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="11" fill="#252A33">
    <text x="539" y="192" fill="#6B7280">—</text>
    <text x="605" y="192">读 i=0</text>
    <text x="671" y="192">加 1</text>
    <text x="737" y="184">写回</text><text x="737" y="200">i=1</text>
  </g>

  <circle cx="474" cy="248" r="3" fill="#E64B35"/>
  <text x="486" y="252" font-size="13" fill="#E64B35">最终 i = 1，丢失一次自增</text>
  <text x="464" y="284" font-size="12" fill="#6B7280">双方都读到旧值 0，后写者覆盖前写者</text>

  <text x="410" y="338" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜i++ 竞态条件：读-改-写交错导致更新丢失</text>
</svg>
