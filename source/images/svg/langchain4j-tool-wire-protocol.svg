<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="440" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="439" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 1：请求 -->
  <rect x="40" y="50" width="232" height="310" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="156" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">① 声明工具</text>
  <rect x="56" y="90" width="200" height="212" rx="6" fill="#FFFFFF" stroke="#D9DFE8"/>
  <g font-size="11" fill="#252A33" font-family="'Courier New',monospace">
    <text x="68" y="112">tools: [{</text>
    <text x="80" y="130">type: "function",</text>
    <text x="80" y="148">function: {</text>
    <text x="92" y="166">name: "get_user",</text>
    <text x="92" y="184">description: "按ID查用户",</text>
    <text x="92" y="202">parameters: {</text>
    <text x="104" y="220">JSON Schema</text>
    <text x="92" y="238">}</text>
    <text x="80" y="256">}</text>
    <text x="68" y="274">}]</text>
  </g>
  <text x="156" y="336" text-anchor="middle" font-size="11" fill="#3C5488">→ ToolSpecification</text>

  <!-- 面板 2：响应 -->
  <rect x="294" y="50" width="232" height="310" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="410" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">② 模型请求调用</text>
  <rect x="310" y="90" width="200" height="212" rx="6" fill="#FFFFFF" stroke="#D9DFE8"/>
  <g font-size="11" fill="#252A33" font-family="'Courier New',monospace">
    <text x="322" y="112">message: {</text>
    <text x="334" y="130">role: "assistant",</text>
    <text x="334" y="148">tool_calls: [{</text>
    <text x="346" y="166">id: "call_1",</text>
    <text x="346" y="184">function: {</text>
    <text x="358" y="202">name: "get_user",</text>
    <text x="358" y="220">arguments: "{\"id\":1}"</text>
    <text x="346" y="238">}</text>
    <text x="334" y="256">}]</text>
    <text x="322" y="274">}</text>
  </g>
  <text x="410" y="336" text-anchor="middle" font-size="11" fill="#3C5488">→ AiMessage.toolExecutionRequests</text>

  <!-- 面板 3：回填 -->
  <rect x="548" y="50" width="232" height="310" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="664" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">③ 结果作为消息回填</text>
  <rect x="564" y="90" width="200" height="212" rx="6" fill="#FFFFFF" stroke="#D9DFE8"/>
  <g font-size="11" fill="#252A33" font-family="'Courier New',monospace">
    <text x="576" y="112">{</text>
    <text x="588" y="130">role: "tool",</text>
    <text x="588" y="148">tool_call_id: "call_1",</text>
    <text x="588" y="166">content: "{",</text>
    <text x="600" y="184">"name": "张三",</text>
    <text x="600" y="202">"dept": "利用处"</text>
    <text x="588" y="220">}"</text>
    <text x="576" y="238">}</text>
  </g>
  <text x="664" y="336" text-anchor="middle" font-size="11" fill="#3C5488">→ ToolExecutionResultMessage</text>

  <!-- 面板间箭头 -->
  <line x1="272" y1="205" x2="288" y2="205" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="526" y1="205" x2="542" y2="205" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 664 360 C 664 400 156 400 156 366" fill="none" stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="410" y="416" text-anchor="middle" font-size="11" fill="#F39B7F">带着工具结果再次发起请求，循环直至模型不再调用</text>

  <text x="410" y="436" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜Function Calling 的线上协议：声明 → 请求 → 回填（OpenAI 兼容格式）</text>
</svg>
