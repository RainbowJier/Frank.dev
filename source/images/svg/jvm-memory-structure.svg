<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="500" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="499" fill="none" stroke="#D9DFE8"/>

  <!-- ===== 左组：线程共享 ===== -->
  <rect x="40" y="40" width="440" height="408" rx="10" fill="#3C5488" fill-opacity="0.05" stroke="#3C5488" stroke-width="1.5"/>
  <text x="64" y="70" font-size="15" font-weight="600" fill="#3C5488">线程共享</text>

  <!-- 堆 -->
  <rect x="64" y="84" width="392" height="250" rx="8" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="260" y="108" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">堆 Heap</text>

  <!-- OOM 高发区徽章（全图唯一红色警示） -->
  <rect x="356" y="92" width="88" height="24" rx="4" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="1.5"/>
  <text x="400" y="108" text-anchor="middle" font-size="11" fill="#252A33">OOM 高发区</text>

  <!-- 新生代 -->
  <rect x="80" y="120" width="360" height="126" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#6B7280">新生代 Young</text>
  <rect x="92" y="148" width="200" height="86" rx="4" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="192" y="186" text-anchor="middle" font-size="13" fill="#252A33">Eden</text>
  <text x="192" y="204" text-anchor="middle" font-size="11" fill="#6B7280">伊甸区</text>
  <rect x="300" y="148" width="60" height="86" rx="4" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="330" y="186" text-anchor="middle" font-size="13" fill="#252A33">S0</text>
  <text x="330" y="204" text-anchor="middle" font-size="11" fill="#6B7280">幸存者</text>
  <rect x="368" y="148" width="60" height="86" rx="4" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="398" y="186" text-anchor="middle" font-size="13" fill="#252A33">S1</text>
  <text x="398" y="204" text-anchor="middle" font-size="11" fill="#6B7280">幸存者</text>

  <!-- 老年代 -->
  <rect x="80" y="258" width="360" height="64" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="260" y="295" text-anchor="middle" font-size="13" fill="#252A33">老年代 Old Gen</text>

  <!-- 方法区（元空间） -->
  <rect x="64" y="350" width="392" height="60" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="260" y="386" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">方法区（元空间 Metaspace）</text>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#6B7280">JDK 8 起取代永久代，使用本地内存</text>

  <!-- ===== 右组：线程私有 ===== -->
  <rect x="510" y="40" width="270" height="408" rx="10" fill="#00A087" fill-opacity="0.05" stroke="#00A087" stroke-width="1.5"/>
  <text x="534" y="70" font-size="15" font-weight="600" fill="#00A087">线程私有</text>
  <text x="596" y="69" font-size="11" fill="#6B7280">（每线程一份）</text>

  <!-- 程序计数器 -->
  <rect x="534" y="104" width="222" height="48" rx="8" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="645" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">程序计数器</text>
  <text x="645" y="141" text-anchor="middle" font-size="11" fill="#6B7280">Program Counter</text>

  <!-- 虚拟机栈 -->
  <rect x="534" y="168" width="222" height="168" rx="8" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="645" y="190" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">虚拟机栈 VM Stack</text>
  <rect x="550" y="200" width="190" height="26" rx="4" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1"/>
  <text x="645" y="217" text-anchor="middle" font-size="12" fill="#252A33">栈帧 · 当前方法</text>
  <rect x="550" y="234" width="190" height="26" rx="4" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1"/>
  <text x="645" y="251" text-anchor="middle" font-size="12" fill="#252A33">栈帧</text>
  <rect x="550" y="268" width="190" height="26" rx="4" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1"/>
  <text x="645" y="285" text-anchor="middle" font-size="12" fill="#252A33">栈帧</text>
  <text x="550" y="312" font-size="11" fill="#6B7280">栈帧含：局部变量表、操作数栈、</text>
  <text x="550" y="328" font-size="11" fill="#6B7280">动态链接、方法返回地址</text>

  <!-- 本地方法栈 -->
  <rect x="534" y="352" width="222" height="48" rx="8" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="645" y="372" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">本地方法栈</text>
  <text x="645" y="389" text-anchor="middle" font-size="11" fill="#6B7280">Native Method Stack</text>
  <text x="645" y="424" text-anchor="middle" font-size="11" fill="#6B7280">随线程创建 / 销毁</text>

  <text x="410" y="478" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜JVM 运行时数据区结构（JDK 8+）</text>
</svg>
