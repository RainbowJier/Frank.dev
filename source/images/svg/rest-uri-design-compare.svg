<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="390" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="389" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：反例 -->
  <rect x="40" y="40" width="360" height="300" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">动词式 URI（反例）</text>

  <circle cx="78" cy="104" r="3" fill="#8491B4"/>
  <text x="92" y="108" font-size="12" font-weight="500" fill="#252A33">GET /getUserById?id=1</text>
  <text x="92" y="125" font-size="11" fill="#6B7280">动词挤占了方法的位置</text>

  <circle cx="78" cy="160" r="3" fill="#E64B35"/>
  <text x="92" y="164" font-size="12" font-weight="500" fill="#252A33">POST /user/delete?id=1</text>
  <text x="92" y="181" font-size="11" fill="#6B7280">要删除却用 POST，语义只能靠猜</text>

  <circle cx="78" cy="216" r="3" fill="#8491B4"/>
  <text x="92" y="220" font-size="12" font-weight="500" fill="#252A33">GET /user/getUserList</text>
  <text x="92" y="237" font-size="11" fill="#6B7280">URL 冗长，集合未用复数</text>

  <circle cx="78" cy="272" r="3" fill="#8491B4"/>
  <text x="92" y="276" font-size="12" font-weight="500" fill="#252A33">POST /user/update?id=1</text>
  <text x="92" y="293" font-size="11" fill="#6B7280">无资源定位，无法缓存、无法安全重试</text>

  <!-- 面板 B：正例 -->
  <rect x="420" y="40" width="360" height="300" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="466" y="71" font-size="14" font-weight="600" fill="#252A33">资源式 URI（REST 推荐）</text>

  <circle cx="458" cy="104" r="3" fill="#00A087"/>
  <text x="472" y="108" font-size="12" font-weight="500" fill="#252A33">GET /users/1</text>
  <text x="472" y="125" font-size="11" fill="#6B7280">查询 id=1 的用户</text>

  <circle cx="458" cy="160" r="3" fill="#00A087"/>
  <text x="472" y="164" font-size="12" font-weight="500" fill="#252A33">DELETE /users/1</text>
  <text x="472" y="181" font-size="11" fill="#6B7280">方法即语义，一眼看懂意图</text>

  <circle cx="458" cy="216" r="3" fill="#00A087"/>
  <text x="472" y="220" font-size="12" font-weight="500" fill="#252A33">GET /users?page=1&amp;size=20</text>
  <text x="472" y="237" font-size="11" fill="#6B7280">过滤、分页、排序交给查询参数</text>

  <circle cx="458" cy="272" r="3" fill="#00A087"/>
  <text x="472" y="276" font-size="12" font-weight="500" fill="#252A33">PUT /users/1</text>
  <text x="472" y="293" font-size="11" fill="#6B7280">URI 定位到具体资源，可缓存可重试</text>

  <text x="410" y="368" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜URI 设计对照：把动作交给 HTTP 方法，URI 只负责定位资源</text>
</svg>
