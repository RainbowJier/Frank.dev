<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="420" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="419" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E64B35"/>
    </marker>
  </defs>

  <line x1="408" y1="64" x2="408" y2="300" stroke="#E8EDF3" stroke-width="1"/>

  <!-- 左：外部调用 -->
  <text x="225" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">外部调用：先过代理</text>

  <rect x="130" y="90" width="190" height="38" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="225" y="114" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Controller</text>

  <line x1="225" y1="128" x2="225" y2="156" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="147" font-size="11" fill="#6B7280">注入的是代理</text>

  <rect x="130" y="162" width="190" height="52" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="225" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">OrderService 代理</text>
  <text x="225" y="200" text-anchor="middle" font-size="11" fill="#6B7280">带事务 / 日志拦截</text>

  <line x1="225" y1="214" x2="225" y2="242" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="233" font-size="11" fill="#6B7280">拦截器先干活再放行</text>

  <rect x="130" y="248" width="190" height="38" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="225" y="272" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">原始对象.updateOrder()</text>

  <circle cx="172" cy="312" r="3" fill="#00A087"/>
  <text x="182" y="316" font-size="11" fill="#6B7280">增强生效</text>

  <!-- 右：自调用 -->
  <text x="600" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">自调用：抄了近路</text>

  <rect x="460" y="90" width="280" height="34" rx="6" fill="#4DBBD5" fill-opacity="0.06" stroke="#4DBBD5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="600" y="112" text-anchor="middle" font-size="12" fill="#6B7280">OrderService 代理（本次没人经过它）</text>

  <rect x="460" y="140" width="280" height="110" rx="8" fill="#8491B4" fill-opacity="0.06" stroke="#8491B4" stroke-width="1.5"/>
  <rect x="480" y="158" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="600" y="177" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">batchUpdate()</text>
  <rect x="480" y="198" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="600" y="217" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">updateOrder() · @Transactional</text>

  <path d="M724,173 C764,173 764,213 724,213" fill="none" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="779" y="197" text-anchor="middle" font-size="11" fill="#6B7280">this</text>

  <circle cx="500" cy="268" r="3" fill="#E64B35"/>
  <text x="510" y="272" font-size="11" fill="#252A33">this = 原始对象，不经过代理，增强全部失效</text>

  <text x="410" y="352" text-anchor="middle" font-size="12" fill="#6B7280">解法：注入自身代理、AopContext.currentProxy()，或把方法拆到另一个 Bean</text>

  <text x="410" y="396" text-anchor="middle" font-size="12" fill="#6B7280">图 6｜自调用为什么失效：this 拿到的是原始对象</text>
</svg>
