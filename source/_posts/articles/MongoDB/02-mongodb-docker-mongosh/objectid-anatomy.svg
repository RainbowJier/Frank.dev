<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA4B2"/>
    </marker>
  </defs>

  <!-- 顶部总结标注 -->
  <text x="410" y="66" text-anchor="middle" font-size="12" fill="#6B7280">共 12 字节 · 十六进制展示为 24 个字符（下方 hex 为示意值）</text>
  <line x1="256" y1="76" x2="196" y2="104" stroke="#9AA4B2" stroke-width="1" marker-end="url(#arrowG)"/>

  <!-- 12 格字节条：时间戳(深蓝) / 随机值(青) / 计数器(橙) -->
  <g stroke-width="1.5">
    <rect x="184" y="108" width="34" height="44" rx="5" fill="#3C5488" fill-opacity="0.15" stroke="#3C5488"/>
    <rect x="222" y="108" width="34" height="44" rx="5" fill="#3C5488" fill-opacity="0.15" stroke="#3C5488"/>
    <rect x="260" y="108" width="34" height="44" rx="5" fill="#3C5488" fill-opacity="0.15" stroke="#3C5488"/>
    <rect x="298" y="108" width="34" height="44" rx="5" fill="#3C5488" fill-opacity="0.15" stroke="#3C5488"/>
    <rect x="336" y="108" width="34" height="44" rx="5" fill="#4DBBD5" fill-opacity="0.15" stroke="#4DBBD5"/>
    <rect x="374" y="108" width="34" height="44" rx="5" fill="#4DBBD5" fill-opacity="0.15" stroke="#4DBBD5"/>
    <rect x="412" y="108" width="34" height="44" rx="5" fill="#4DBBD5" fill-opacity="0.15" stroke="#4DBBD5"/>
    <rect x="450" y="108" width="34" height="44" rx="5" fill="#4DBBD5" fill-opacity="0.15" stroke="#4DBBD5"/>
    <rect x="488" y="108" width="34" height="44" rx="5" fill="#4DBBD5" fill-opacity="0.15" stroke="#4DBBD5"/>
    <rect x="526" y="108" width="34" height="44" rx="5" fill="#F39B7F" fill-opacity="0.18" stroke="#F39B7F"/>
    <rect x="564" y="108" width="34" height="44" rx="5" fill="#F39B7F" fill-opacity="0.18" stroke="#F39B7F"/>
    <rect x="602" y="108" width="34" height="44" rx="5" fill="#F39B7F" fill-opacity="0.18" stroke="#F39B7F"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">
    <text x="201" y="135">67</text><text x="239" y="135">C4</text>
    <text x="277" y="135">A1</text><text x="315" y="135">E2</text>
    <text x="353" y="135">3F</text><text x="391" y="135">8B</text>
    <text x="429" y="135">91</text><text x="467" y="135">04</text>
    <text x="505" y="135">D7</text>
    <text x="543" y="135">01</text><text x="581" y="135">A2</text><text x="619" y="135">F3</text>
  </g>

  <!-- 分组括线与说明 -->
  <g stroke-linecap="round">
    <path d="M184 168 v8 h148 v-8" fill="none" stroke="#3C5488" stroke-width="1.5"/>
    <path d="M336 168 v8 h186 v-8" fill="none" stroke="#4DBBD5" stroke-width="1.5"/>
    <path d="M526 168 v8 h110 v-8" fill="none" stroke="#F39B7F" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="258" y="198" font-size="13" font-weight="600" fill="#252A33">时间戳 · 4 字节</text>
    <text x="258" y="216" font-size="11" fill="#6B7280">Unix 秒，让 _id 趋势递增</text>
    <text x="429" y="198" font-size="13" font-weight="600" fill="#252A33">随机值 · 5 字节</text>
    <text x="429" y="216" font-size="11" fill="#6B7280">进程启动时生成，同进程不变</text>
    <text x="581" y="198" font-size="13" font-weight="600" fill="#252A33">计数器 · 3 字节</text>
    <text x="581" y="216" font-size="11" fill="#6B7280">同秒内自增防重复</text>
  </g>

  <!-- 右侧引线注释 -->
  <line x1="640" y1="122" x2="668" y2="122" stroke="#9AA4B2" stroke-width="1"/>
  <circle cx="638" cy="122" r="2.5" fill="#9AA4B2"/>
  <g font-size="12" fill="#6B7280">
    <text x="674" y="119">趋势递增：</text>
    <text x="674" y="137">插入顺序 ≈ 时间顺序</text>
  </g>

  <!-- 底部应用提示 -->
  <rect x="184" y="248" width="452" height="40" rx="6" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="410" y="273" text-anchor="middle" font-size="12" fill="#252A33">好用的一面：可当排序依据；隐患：单调写入会集中到最后一个分片（第 10 篇展开）</text>

  <text x="410" y="316" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜ObjectId 的 12 字节构成</text>
</svg>
