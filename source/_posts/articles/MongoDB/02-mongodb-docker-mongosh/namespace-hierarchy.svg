<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="399" fill="none" stroke="#D9DFE8"/>

  <!-- Database 层 -->
  <rect x="40" y="44" width="380" height="300" rx="12" fill="#3C5488" fill-opacity="0.05" stroke="#3C5488" stroke-width="2"/>
  <rect x="62" y="64" width="11" height="11" fill="#3C5488"/>
  <text x="82" y="74" font-size="15" font-weight="600" fill="#252A33">Database：shop</text>
  <text x="396" y="73" text-anchor="end" font-size="11" fill="#6B7280">use shop 之后一切操作的上下文</text>

  <!-- Collection 条 -->
  <rect x="66" y="98" width="328" height="54" rx="8" fill="#4DBBD5" fill-opacity="0.10" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="86" y="120" font-size="13" font-weight="600" fill="#252A33">Collection：products</text>
  <text x="374" y="119" text-anchor="end" font-size="11" fill="#6B7280">本文示例主角</text>
  <text x="86" y="140" font-size="11" fill="#6B7280">四份结构不同的商品文档共存于此</text>
  <rect x="66" y="164" width="328" height="44" rx="8" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="86" y="190" font-size="13" fill="#252A33">Collection：orders　　<tspan fill="#6B7280" font-size="11">订单（第 03 篇起使用）</tspan></text>
  <rect x="66" y="220" width="328" height="44" rx="8" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="86" y="246" font-size="13" fill="#252A33">Collection：users　　　<tspan fill="#6B7280" font-size="11">用户（暂未创建，同样合法）</tspan></text>
  <text x="66" y="300" font-size="11" fill="#6B7280">首个文档插入时，库与集合才真正落盘</text>
  <text x="66" y="320" font-size="11" fill="#6B7280">（惰性创建：use shop 当时它并不存在）</text>

  <!-- products 展开的文档卡 -->
  <rect x="470" y="88" width="310" height="96" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="488" y="110" font-size="12" font-weight="600" fill="#252A33">文档 1（数码）</text>
  <text x="488" y="132" font-size="11" fill="#252A33">{ name: "手机 X", price: 4999,</text>
  <text x="488" y="150" font-size="11" fill="#252A33">  spec: { color: "黑", memoryGB: 12 },</text>
  <text x="488" y="168" font-size="11" fill="#252A33">  tags: ["数码", "旗舰"] }</text>
  <rect x="470" y="200" width="310" height="96" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="488" y="222" font-size="12" font-weight="600" fill="#252A33">文档 2（图书）</text>
  <text x="488" y="244" font-size="11" fill="#252A33">{ name: "深入理解 Java 虚拟机", price: 129,</text>
  <text x="488" y="262" font-size="11" fill="#252A33">  author: "周志明", isbn: "978-…",</text>
  <text x="488" y="280" font-size="11" fill="#252A33">  tags: ["图书", "Java"] }</text>
  <line x1="394" y1="125" x2="464" y2="130" stroke="#9AA4B2" stroke-width="1"/>
  <circle cx="394" cy="125" r="2.5" fill="#9AA4B2"/>

  <text x="686" y="140" font-size="11" fill="#6B7280">同一个集合里</text>
  <text x="686" y="158" font-size="11" fill="#6B7280">字段组合可以完全不同</text>

  <text x="410" y="382" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜库、集合、文档三级结构与惰性创建</text>
</svg>
