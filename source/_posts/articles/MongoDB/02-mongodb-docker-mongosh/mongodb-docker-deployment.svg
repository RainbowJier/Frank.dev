<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="360" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="359" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A087"/>
    </marker>
  </defs>

  <!-- Docker Host 外框 -->
  <rect x="300" y="40" width="480" height="286" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <rect x="322" y="60" width="11" height="11" fill="#3C5488"/>
  <text x="342" y="70" font-size="14" font-weight="600" fill="#252A33">Docker Host</text>
  <text x="758" y="69" text-anchor="end" font-size="11" fill="#6B7280">docker compose up -d</text>

  <!-- 容器 -->
  <rect x="340" y="88" width="240" height="118" rx="10" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="364" y="113" font-size="13" font-weight="600" fill="#252A33">容器 mongo-dev</text>
  <text x="556" y="112" text-anchor="end" font-size="11" fill="#6B7280">image: mongo:7.0</text>
  <rect x="364" y="128" width="192" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="460" y="151" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">mongod</text>
  <text x="460" y="170" text-anchor="middle" font-size="11" fill="#6B7280">监听容器内 27017</text>

  <!-- 数据卷 -->
  <path d="M370 236 a20 10 0 0 1 40 0 v52 a20 10 0 0 1 -40 0 z" transform="translate(90 0)"
        fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1.5"/>
  <ellipse cx="480" cy="236" rx="20" ry="10" fill="#00A087" fill-opacity="0.18" stroke="#00A087" stroke-width="1.5"/>
  <text x="480" y="272" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">mongo-data</text>
  <text x="480" y="290" text-anchor="middle" font-size="11" fill="#6B7280">挂载 /data/db</text>
  <line x1="460" y1="206" x2="476" y2="230" stroke="#00A087" stroke-width="1.5"
        marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>

  <!-- 左侧客户端 -->
  <rect x="40" y="92" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="130" y="116" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">mongosh</text>
  <text x="130" y="136" text-anchor="middle" font-size="11" fill="#6B7280">官方命令行 Shell</text>
  <rect x="40" y="196" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="130" y="220" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">Compass</text>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#6B7280">官方 GUI 客户端</text>

  <!-- 连接线与端口标注 -->
  <line x1="224" y1="120" x2="330" y2="142" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="224" y1="224" x2="330" y2="188" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="277" y="150">localhost:27017</text>
    <text x="277" y="196">URI 连接</text>
  </g>
  <text x="540" y="248" font-size="11" fill="#6B7280">端口映射：宿主机 27017 → 容器 27017</text>

  <text x="410" y="348" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜Docker 部署 MongoDB 的组件与连接拓扑</text>
</svg>
