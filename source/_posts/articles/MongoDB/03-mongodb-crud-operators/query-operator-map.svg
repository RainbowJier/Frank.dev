<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="410" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="409" fill="none" stroke="#D9DFE8"/>

  <!-- 顶部查询表达式 -->
  <rect x="250" y="38" width="320" height="42" rx="8" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="410" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">db.collection.find({ 条件… })</text>

  <!-- 四象限卡片 -->
  <g stroke-width="1.5">
    <rect x="56"  y="106" width="344" height="126" rx="10" fill="#FFFFFF" stroke="#3C5488"/>
    <rect x="420" y="106" width="344" height="126" rx="10" fill="#FFFFFF" stroke="#4DBBD5"/>
    <rect x="56"  y="246" width="344" height="126" rx="10" fill="#FFFFFF" stroke="#F39B7F"/>
    <rect x="420" y="246" width="344" height="126" rx="10" fill="#FFFFFF" stroke="#00A087"/>
  </g>

  <!-- 比较 -->
  <rect x="72" y="120" width="10" height="10" fill="#3C5488"/>
  <text x="90" y="130" font-size="14" font-weight="600" fill="#252A33">比较 Comparison</text>
  <text x="90" y="154" font-size="13" fill="#252A33">$eq · $ne · $gt · $gte · $lt · $lte</text>
  <text x="90" y="178" font-size="13" fill="#252A33">$in · $nin　<tspan font-size="11" fill="#6B7280">对应 SQL 的 IN / NOT IN</tspan></text>
  <text x="90" y="206" font-size="11" fill="#6B7280">值的类型必须匹配："120" ≠ 数字 120</text>

  <!-- 逻辑 -->
  <rect x="436" y="120" width="10" height="10" fill="#4DBBD5"/>
  <text x="454" y="130" font-size="14" font-weight="600" fill="#252A33">逻辑 Logic</text>
  <text x="454" y="154" font-size="13" fill="#252A33">$and（隐式）· $or · $not · $nor</text>
  <text x="454" y="182" font-size="11" fill="#6B7280">同一字段出现多个条件时必须显式 $and</text>
  <text x="454" y="202" font-size="11" fill="#6B7280">$not 修饰操作符而非字段名</text>

  <!-- 字段 -->
  <rect x="72" y="260" width="10" height="10" fill="#F39B7F"/>
  <text x="90" y="270" font-size="14" font-weight="600" fill="#252A33">字段判断 Field</text>
  <text x="90" y="294" font-size="13" fill="#252A33">$exists · $type · null</text>
  <text x="90" y="318" font-size="11" fill="#6B7280">{ f: null } ＝「缺失」∪「值为 null」双重命中</text>
  <text x="90" y="340" font-size="11" fill="#6B7280">精确判空：$exists: true 搭配 $ne: null</text>

  <!-- 数组 -->
  <rect x="436" y="260" width="10" height="10" fill="#00A087"/>
  <text x="454" y="270" font-size="14" font-weight="600" fill="#252A33">数组 Array</text>
  <text x="454" y="294" font-size="13" fill="#252A33">含某元素直写字段值 · $all · $size</text>
  <text x="454" y="318" font-size="13" fill="#252A33">$elemMatch　<tspan font-size="11" fill="#6B7280">同元素多条件 AND</tspan></text>
  <text x="454" y="340" font-size="11" fill="#6B7280">点路径按下标直达：sizes.0 = "M"</text>

  <text x="410" y="396" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜find 查询条件的操作符地图</text>
</svg>
