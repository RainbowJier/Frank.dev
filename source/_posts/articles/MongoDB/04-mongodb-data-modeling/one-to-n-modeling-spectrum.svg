<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="399" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：一对几 · 嵌入 -->
  <rect x="40" y="40" width="236" height="296" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="62" y="68" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="67" font-size="14" font-weight="600" fill="#252A33">一对几 · 嵌入</text>
  <rect x="60" y="88" width="196" height="128" rx="8" fill="#00A087" fill-opacity="0.06" stroke="#00A087" stroke-width="1.5"/>
  <text x="76" y="110" font-size="12" font-weight="600" fill="#252A33">users</text>
  <text x="240" y="109" text-anchor="end" font-size="10" fill="#6B7280">{ _id: u1 }</text>
  <rect x="76" y="120" width="164" height="26" rx="5" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="158" y="137" text-anchor="middle" font-size="11" fill="#252A33">addresses[0]</text>
  <rect x="76" y="152" width="164" height="26" rx="5" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="158" y="169" text-anchor="middle" font-size="11" fill="#252A33">addresses[1]</text>
  <circle cx="70" cy="238" r="3" fill="#00A087"/>
  <text x="82" y="242" font-size="12" fill="#252A33">一次 find 全部带回</text>
  <circle cx="70" cy="264" r="3" fill="#8491B4"/>
  <text x="82" y="268" font-size="12" fill="#252A33">前提：总量有界</text>
  <rect x="56" y="290" width="204" height="30" rx="6" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="158" y="310" text-anchor="middle" font-size="11" fill="#252A33">地址 · 规格 · 权限项</text>

  <!-- 面板 B：一对多 · 父引用 -->
  <rect x="292" y="40" width="236" height="296" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="314" y="68" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="338" y="67" font-size="14" font-weight="600" fill="#252A33">一对多 · 父引用</text>
  <rect x="312" y="88" width="196" height="42" rx="8" fill="#3C5488" fill-opacity="0.08" stroke="#3C5488" stroke-width="1.5"/>
  <text x="328" y="106" font-size="12" font-weight="600" fill="#252A33">orders</text>
  <text x="492" y="105" text-anchor="end" font-size="10" fill="#6B7280">{ _id: o1 }</text>
  <text x="328" y="122" font-size="10" fill="#6B7280">写入即完事，无需动父</text>
  <line x1="410" y1="130" x2="410" y2="162" stroke="#4DBBD5" stroke-width="1.5"/>
  <rect x="312" y="164" width="196" height="52" rx="8" fill="#4DBBD5" fill-opacity="0.08" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="328" y="184" font-size="12" font-weight="600" fill="#252A33">order_items</text>
  <text x="328" y="204" font-size="10" fill="#6B7280">{ orderId: o1 } × N 条</text>
  <circle cx="308" cy="240" r="3" fill="#4DBBD5"/>
  <text x="320" y="244" font-size="12" fill="#252A33">子侧可独立分页检索</text>
  <circle cx="308" cy="266" r="3" fill="#8491B4"/>
  <text x="320" y="270" font-size="12" fill="#252A33">带子查询需付联表成本</text>
  <rect x="308" y="290" width="204" height="30" rx="6" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="410" y="310" text-anchor="middle" font-size="11" fill="#252A33">订单明细 · 文章附件</text>

  <!-- 面板 C：一对巨 · 子集模式 -->
  <rect x="544" y="40" width="236" height="296" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="566" y="68" font-size="18" font-weight="700" fill="#3C5488">C</text>
  <text x="590" y="67" font-size="14" font-weight="600" fill="#252A33">一对巨 · 子集模式</text>
  <rect x="564" y="88" width="196" height="58" rx="8" fill="#F39B7F" fill-opacity="0.10" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="580" y="108" font-size="12" font-weight="600" fill="#252A33">posts</text>
  <text x="580" y="128" font-size="10" fill="#6B7280">latestComments[≤10]</text>
  <text x="580" y="141" font-size="10" fill="#6B7280">commentCount: 128</text>
  <line x1="662" y1="146" x2="662" y2="170" stroke="#9AA4B2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="674" y="163" font-size="10" fill="#6B7280">其余留在子集合</text>
  <rect x="564" y="172" width="196" height="42" rx="8" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="580" y="190" font-size="12" font-weight="600" fill="#252A33">comments</text>
  <text x="580" y="207" font-size="10" fill="#6B7280">{ postId } 分页、搜索在此</text>
  <circle cx="560" cy="240" r="3" fill="#F39B7F"/>
  <text x="572" y="244" font-size="12" fill="#252A33">列表页零联表直出</text>
  <circle cx="560" cy="266" r="3" fill="#8491B4"/>
  <text x="572" y="270" font-size="12" fill="#252A33">深翻页再访问子集合</text>
  <rect x="560" y="290" width="204" height="30" rx="6" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="662" y="310" text-anchor="middle" font-size="11" fill="#252A33">评论 · 点赞 · 浏览流水</text>

  <text x="410" y="378" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜一对 N 的三种建模形态</text>
</svg>
