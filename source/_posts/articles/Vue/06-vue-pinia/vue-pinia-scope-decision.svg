<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="320" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="319" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 起点 -->
  <rect x="40" y="126" width="130" height="56" rx="8" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
  <text x="105" y="149" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">一个状态</text>
  <text x="105" y="168" text-anchor="middle" font-size="11" fill="#6B7280">放哪里管理？</text>

  <line x1="174" y1="154" x2="216" y2="154" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 问题一 -->
  <rect x="220" y="126" width="150" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="295" y="149" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">谁在用？</text>
  <text x="295" y="168" text-anchor="middle" font-size="11" fill="#6B7280">跨组件 / 跨页面吗</text>

  <!-- 上分支 -->
  <line x1="370" y1="140" x2="426" y2="84" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="56" width="180" height="56" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="520" y="79" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">仅本组件或父子链</text>
  <text x="520" y="98" text-anchor="middle" font-size="11" fill="#6B7280">局部关系</text>
  <line x1="614" y1="84" x2="656" y2="84" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="56" width="120" height="56" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="720" y="79" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">ref / props</text>
  <text x="720" y="98" text-anchor="middle" font-size="11" fill="#6B7280">本地态即正义</text>

  <!-- 下分支 -->
  <line x1="370" y1="168" x2="426" y2="224" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="196" width="180" height="56" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="520" y="219" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">跨页面 / 多处共享</text>
  <text x="520" y="238" text-anchor="middle" font-size="11" fill="#6B7280">全局关系</text>
  <line x1="614" y1="224" x2="656" y2="224" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="196" width="120" height="56" rx="8" fill="#00A087" fill-opacity="0.18" stroke="#00A087" stroke-width="2"/>
  <text x="720" y="219" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Pinia store</text>
  <text x="720" y="238" text-anchor="middle" font-size="11" fill="#6B7280">useXxxStore</text>

  <!-- 持久化追加条件 -->
  <rect x="430" y="272" width="350" height="28" rx="6" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="290" text-anchor="middle" font-size="11" fill="#6B7280">追加一问：刷新后仍需要？→ persist: true 持久化</text>

  <text x="410" y="314" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜状态放哪的决策：先问谁在用，再问刷新后是否仍需要</text>
</svg>
