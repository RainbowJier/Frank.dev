<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="300" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="299" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- env 文件族 -->
  <rect x="40" y="60" width="200" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">.env.development</text>
  <text x="140" y="101" text-anchor="middle" font-size="11" fill="#6B7280">npm run dev 时生效</text>

  <rect x="40" y="150" width="200" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="140" y="172" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">.env.production</text>
  <text x="140" y="191" text-anchor="middle" font-size="11" fill="#6B7280">npm run build 时生效</text>

  <!-- Vite 选取 -->
  <line x1="244" y1="86" x2="296" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="244" y1="176" x2="296" y2="150" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="106" width="210" height="56" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="405" y="129" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Vite 构建进程</text>
  <text x="405" y="149" text-anchor="middle" font-size="11" fill="#6B7280">按 mode 选取对应文件</text>

  <line x1="514" y1="134" x2="556" y2="134" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 注入 -->
  <rect x="560" y="106" width="210" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="665" y="129" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">import.meta.env</text>
  <text x="665" y="149" text-anchor="middle" font-size="11" fill="#6B7280">编译期静态替换</text>

  <!-- 警示（唯一红色） -->
  <rect x="200" y="230" width="570" height="30" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="485" y="249" text-anchor="middle" font-size="12" fill="#252A33">仅 VITE_ 前缀暴露；注入即随产物公开，密钥类信息必须留在后端</text>

  <text x="140" y="249" text-anchor="middle" font-size="12" fill="#252A33">对照 Spring：</text>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#6B7280">application-{profile}.yml</text>

  <text x="410" y="288" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜环境变量注入链路：按模式选取 .env 文件，编译期注入前端代码</text>
</svg>
