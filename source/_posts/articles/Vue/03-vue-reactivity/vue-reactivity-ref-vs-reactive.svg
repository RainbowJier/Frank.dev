<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="356" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="355" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：ref 盒子 -->
  <rect x="28" y="24" width="764" height="140" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="48" y="56" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="72" y="56" font-size="16" font-weight="600" fill="#252A33">ref：盒子方案</text>

  <rect x="48" y="78" width="220" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="158" y="96" text-anchor="middle" font-size="11" fill="#6B7280">结构</text>
  <text x="158" y="119" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">{ value: 0 }</text>

  <line x1="274" y1="106" x2="300" y2="106" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="304" y="78" width="240" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="424" y="96" text-anchor="middle" font-size="11" fill="#6B7280">读写约定</text>
  <text x="424" y="119" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">一切读写都过 .value</text>

  <rect x="572" y="78" width="192" height="56" rx="6" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1.5"/>
  <text x="668" y="99" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">解构 / 传参均安全</text>
  <text x="668" y="120" text-anchor="middle" font-size="11" fill="#6B7280">官方推荐默认用它</text>

  <!-- 面板 B：reactive 代理 -->
  <rect x="28" y="180" width="764" height="140" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="48" y="212" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="72" y="212" font-size="16" font-weight="600" fill="#252A33">reactive：代理方案</text>

  <rect x="48" y="234" width="220" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="158" y="252" text-anchor="middle" font-size="11" fill="#6B7280">结构</text>
  <text x="158" y="275" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">Proxy 直接包对象</text>

  <line x1="274" y1="262" x2="300" y2="262" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="304" y="234" width="240" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="424" y="252" text-anchor="middle" font-size="11" fill="#6B7280">读写约定</text>
  <text x="424" y="275" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">user.name 直接读写</text>

  <rect x="572" y="234" width="192" height="56" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="668" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">解构 / 整体替换即断</text>
  <text x="668" y="276" text-anchor="middle" font-size="11" fill="#6B7280">响应式挂在代理对象上</text>

  <text x="410" y="344" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜ref 与 reactive 的结构对比：盒子方案与代理方案的风险差异</text>
</svg>
