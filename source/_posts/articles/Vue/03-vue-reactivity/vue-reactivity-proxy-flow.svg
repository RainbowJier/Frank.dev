<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="356" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="355" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 顶部：副作用 -->
  <rect x="310" y="36" width="200" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="410" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">副作用 / 渲染函数</text>
  <text x="410" y="80" text-anchor="middle" font-size="11" fill="#6B7280">组件 render · computed · watch</text>

  <!-- 左下：响应式数据 -->
  <rect x="60" y="190" width="220" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="170" y="215" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">响应式数据（Proxy）</text>
  <text x="170" y="237" text-anchor="middle" font-size="11" fill="#6B7280">ref.value / reactive 属性</text>

  <!-- 右下：依赖登记簿 -->
  <rect x="540" y="190" width="220" height="64" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="650" y="215" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">依赖登记簿</text>
  <text x="650" y="237" text-anchor="middle" font-size="11" fill="#6B7280">数据 → 依赖它的副作用集合</text>

  <!-- ① 读取 -->
  <line x1="300" y1="86" x2="180" y2="184" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="216" y="120" text-anchor="middle" font-size="12" fill="#252A33">① 读取（拦截 get）</text>
  <text x="216" y="137" text-anchor="middle" font-size="11" fill="#6B7280">模板渲染时读 count</text>

  <!-- ② track 登记 -->
  <line x1="284" y1="222" x2="536" y2="222" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#252A33">② track：登记"谁依赖这份数据"</text>

  <!-- ③ trigger 派发 -->
  <line x1="640" y1="184" x2="520" y2="102" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="606" y="120" text-anchor="middle" font-size="12" fill="#252A33">③ trigger：派发更新</text>
  <text x="606" y="137" text-anchor="middle" font-size="11" fill="#6B7280">副作用重跑 → diff → 更新 DOM</text>

  <!-- 写操作示例（唯一红色警示点） -->
  <rect x="240" y="292" width="340" height="30" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="410" y="311" text-anchor="middle" font-size="12" fill="#252A33">写操作 count.value++ 触发 set 拦截，进入 ③</text>

  <text x="410" y="348" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜拦截 → 收集 → 派发：一次完整的响应式循环</text>
</svg>
