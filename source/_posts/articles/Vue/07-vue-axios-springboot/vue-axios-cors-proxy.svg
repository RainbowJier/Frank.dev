<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="356" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="355" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：直连跨域 -->
  <rect x="28" y="24" width="764" height="140" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="48" y="52" font-size="14" font-weight="600" fill="#252A33">A · 浏览器直连后端（跨域 + 预检）</text>

  <rect x="48" y="66" width="150" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="123" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">浏览器</text>
  <text x="123" y="110" text-anchor="middle" font-size="11" fill="#6B7280">localhost:5173</text>

  <rect x="620" y="66" width="150" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="695" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Spring Boot</text>
  <text x="695" y="110" text-anchor="middle" font-size="11" fill="#6B7280">localhost:8080</text>

  <line x1="202" y1="80" x2="616" y2="80" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="409" y="73" text-anchor="middle" font-size="11" fill="#6B7280">① OPTIONS 预检（不带自定义头）</text>
  <line x1="616" y1="98" x2="202" y2="98" stroke="#5A6472" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="409" y="118" text-anchor="middle" font-size="11" fill="#6B7280">② 响应 Access-Control-Allow-* 头</text>
  <line x1="202" y1="136" x2="616" y2="136" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="409" y="130" text-anchor="middle" font-size="11" fill="#6B7280">③ 预检通过才发真请求（带 Authorization）</text>

  <!-- 面板 B：Vite 代理 -->
  <rect x="28" y="180" width="764" height="140" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="48" y="208" font-size="14" font-weight="600" fill="#252A33">B · 走 Vite 代理（同源，无跨域）</text>

  <rect x="48" y="222" width="150" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="123" y="246" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">浏览器</text>
  <text x="123" y="266" text-anchor="middle" font-size="11" fill="#6B7280">只认识 5173</text>

  <rect x="300" y="222" width="170" height="60" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="385" y="246" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Vite dev server</text>
  <text x="385" y="266" text-anchor="middle" font-size="11" fill="#6B7280">server.proxy 转发</text>

  <rect x="620" y="222" width="150" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="695" y="246" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Spring Boot</text>
  <text x="695" y="266" text-anchor="middle" font-size="11" fill="#6B7280">localhost:8080</text>

  <line x1="202" y1="252" x2="296" y2="252" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="249" y="245" text-anchor="middle" font-size="11" fill="#6B7280">同源</text>
  <line x1="474" y1="252" x2="616" y2="252" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="245" text-anchor="middle" font-size="11" fill="#6B7280">服务器转发</text>

  <rect x="300" y="292" width="340" height="26" rx="6" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1.5"/>
  <text x="470" y="309" text-anchor="middle" font-size="12" fill="#252A33">浏览器全程无感知，后端零 CORS 配置</text>

  <text x="410" y="346" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜跨域两种解法：直连需预检协商，开发期代理让跨域根本不发生</text>
</svg>
