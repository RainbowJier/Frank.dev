<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 456" width="820" height="456"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="456" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="455" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E64B35"/>
    </marker>
  </defs>

  <!-- 三条泳道 -->
  <rect x="40" y="32" width="240" height="32" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="160" y="53" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">登录页 / 业务组件</text>
  <rect x="290" y="32" width="240" height="32" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="410" y="53" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Pinia auth store</text>
  <rect x="540" y="32" width="240" height="32" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="660" y="53" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Spring Boot 后端</text>

  <line x1="285" y1="80" x2="285" y2="410" stroke="#E8EDF3" stroke-width="1.5"/>
  <line x1="535" y1="80" x2="535" y2="410" stroke="#E8EDF3" stroke-width="1.5"/>

  <!-- ① 登录请求 -->
  <text x="410" y="102" text-anchor="middle" font-size="12" fill="#252A33">① POST /api/login（账号密码）</text>
  <line x1="170" y1="112" x2="648" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ② 返回 token -->
  <text x="410" y="142" text-anchor="middle" font-size="12" fill="#252A33">② Result{ data: token + 用户信息 }</text>
  <line x1="650" y1="152" x2="172" y2="152" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③ 存 store -->
  <text x="285" y="182" text-anchor="middle" font-size="12" fill="#252A33">③ 存入 store，persist 落 localStorage</text>
  <line x1="175" y1="192" x2="398" y2="192" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ④ 跳首页 -->
  <rect x="70" y="216" width="180" height="28" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
  <text x="160" y="234" text-anchor="middle" font-size="12" fill="#252A33">④ router.push 首页</text>

  <!-- ⑤ 带凭证请求 -->
  <text x="410" y="272" text-anchor="middle" font-size="12" fill="#252A33">⑤ GET /api/orders（请求拦截器挂 Authorization）</text>
  <line x1="170" y1="282" x2="648" y2="282" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑥ 返回数据 -->
  <text x="410" y="312" text-anchor="middle" font-size="12" fill="#252A33">⑥ 业务数据，响应拦截器拆包后渲染列表</text>
  <line x1="650" y1="322" x2="172" y2="322" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑦ 过期兜底（唯一红色警示） -->
  <text x="410" y="352" text-anchor="middle" font-size="12" fill="#252A33">⑦ token 过期 → 401</text>
  <line x1="650" y1="362" x2="172" y2="362" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <rect x="200" y="380" width="420" height="30" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="410" y="399" text-anchor="middle" font-size="12" fill="#252A33">响应拦截器统一 logout + 跳登录（业务代码无感知）</text>

  <text x="410" y="440" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜登录态完整时序：token 入库、请求挂头、过期统一兜底</text>
</svg>
