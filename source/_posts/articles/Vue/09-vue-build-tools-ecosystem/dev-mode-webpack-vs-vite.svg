<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="360" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="359" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：WebPack dev server -->
  <rect x="40" y="40" width="360" height="260" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">Webpack dev server</text>
  <circle cx="78" cy="106" r="3" fill="#E64B35"/>
  <text x="92" y="110" font-size="13" fill="#252A33">启动即全量打包整个工程</text>
  <circle cx="78" cy="144" r="3" fill="#8491B4"/>
  <text x="92" y="148" font-size="13" fill="#252A33">每个文件过 loader 链后进内存</text>
  <circle cx="78" cy="182" r="3" fill="#8491B4"/>
  <text x="92" y="186" font-size="13" fill="#252A33">改动触发受影响子图重编译</text>
  <circle cx="78" cy="220" r="3" fill="#8491B4"/>
  <text x="92" y="224" font-size="13" fill="#252A33">HMR 以增量 patch 热替换模块</text>
  <text x="78" y="266" font-size="12" fill="#6B7280">— 冷启动耗时随模块数线性增长</text>

  <!-- 面板 B：Vite dev server -->
  <rect x="420" y="40" width="360" height="260" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="466" y="71" font-size="14" font-weight="600" fill="#252A33">Vite dev server</text>
  <circle cx="458" cy="106" r="3" fill="#00A087"/>
  <text x="472" y="110" font-size="13" fill="#252A33">启动只起服务器，近乎瞬时</text>
  <circle cx="458" cy="144" r="3" fill="#8491B4"/>
  <text x="472" y="148" font-size="13" fill="#252A33">浏览器要哪个模块才即时转换哪个</text>
  <circle cx="458" cy="182" r="3" fill="#8491B4"/>
  <text x="472" y="186" font-size="13" fill="#252A33">依赖经 esbuild 预构建并强缓存</text>
  <circle cx="458" cy="220" r="3" fill="#8491B4"/>
  <text x="472" y="224" font-size="13" fill="#252A33">HMR 推送更新，体验同样无缝</text>
  <text x="458" y="266" font-size="12" font-weight="600" fill="#00A087">— 冷启动与项目规模基本无关</text>

  <text x="410" y="336" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜开发期工作方式对比——Webpack 先攒整张依赖图，Vite 边请求边转换</text>
</svg>
