<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="300" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="299" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 父组件 -->
  <rect x="48" y="100" width="180" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="138" y="127" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">父组件</text>
  <text x="138" y="148" text-anchor="middle" font-size="11" fill="#6B7280">state / 事件处理函数</text>

  <!-- 子组件 -->
  <rect x="592" y="100" width="180" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="682" y="127" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">子组件</text>
  <text x="682" y="148" text-anchor="middle" font-size="11" fill="#6B7280">defineProps / defineEmits</text>

  <!-- props 下行 -->
  <line x1="232" y1="118" x2="588" y2="118" stroke="#3C5488" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="108" text-anchor="middle" font-size="12" fill="#252A33">props：数据下行</text>

  <!-- emit 上行 -->
  <line x1="588" y1="150" x2="232" y2="150" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="170" text-anchor="middle" font-size="12" fill="#252A33">emit：事件上报</text>
  <text x="410" y="188" text-anchor="middle" font-size="11" fill="#6B7280">confirm · update:modelValue</text>

  <!-- 只读警示 -->
  <rect x="592" y="180" width="180" height="26" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="682" y="197" text-anchor="middle" font-size="11" fill="#252A33">props 只读，不可直接改</text>

  <!-- v-model 合并 -->
  <rect x="200" y="224" width="420" height="34" rx="8" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="246" text-anchor="middle" font-size="12" fill="#252A33">v-model = :modelValue + @update:modelValue</text>

  <text x="410" y="288" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜单向数据流回路：props 下行、事件上行，v-model 只是两根线的合并写法</text>
</svg>
