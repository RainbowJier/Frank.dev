<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="300" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="299" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 父组件 -->
  <rect x="60" y="32" width="340" height="96" rx="10" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="80" y="58" font-size="14" font-weight="600" fill="#252A33">父组件（模板的提供方）</text>
  <text x="80" y="82" font-size="11" fill="#6B7280">&lt;UserList&gt;&lt;template #default="{ user, index }"&gt;</text>
  <text x="80" y="102" font-size="11" fill="#6B7280">  #{{ index }} {{ user.name }}&lt;/template&gt;&lt;/UserList&gt;</text>

  <!-- 子组件 -->
  <rect x="60" y="170" width="340" height="110" rx="10" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="80" y="196" font-size="14" font-weight="600" fill="#252A33">子组件 UserList（骨架）</text>
  <rect x="84" y="210" width="130" height="52" rx="6" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="149" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">slot 站位</text>
  <text x="149" y="249" text-anchor="middle" font-size="11" fill="#6B7280">渲染发生地</text>
  <rect x="270" y="210" width="110" height="52" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="325" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">每行数据</text>
  <text x="325" y="249" text-anchor="middle" font-size="11" fill="#6B7280">user / index</text>

  <!-- ① 模板传入 -->
  <line x1="230" y1="128" x2="230" y2="166" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="151" font-size="12" fill="#252A33">① 模板传入</text>

  <!-- ② 数据回传 -->
  <line x1="266" y1="236" x2="218" y2="236" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="278" text-anchor="middle" font-size="12" fill="#252A33">② 数据回传（slot props）</text>

  <!-- 渲染结果 -->
  <rect x="470" y="170" width="300" height="110" rx="10" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="620" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">③ 渲染结果（长在子组件里）</text>
  <text x="500" y="226" font-size="13" fill="#252A33">#1 张三（VIP 加粗标红）</text>
  <text x="500" y="252" font-size="13" fill="#252A33">#2 李四</text>
  <line x1="404" y1="225" x2="464" y2="225" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="410" y="292" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜作用域插槽：数据子组件出，模板父组件出，渲染发生在 slot 站位处</text>
</svg>
