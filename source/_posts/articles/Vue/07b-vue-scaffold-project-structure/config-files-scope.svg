<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="270" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="269" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：编码期 -->
  <rect x="40" y="40" width="230" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="60" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="82" y="71" font-size="14" font-weight="600" fill="#252A33">编码期 · 编辑器内</text>
  <circle cx="76" cy="110" r="3" fill="#8491B4"/>
  <text x="90" y="114" font-size="13" fill="#252A33">tsconfig 族定类型规则</text>
  <circle cx="76" cy="148" r="3" fill="#8491B4"/>
  <text x="90" y="152" font-size="13" fill="#252A33">ESLint/Prettier 双轨分工</text>
  <circle cx="76" cy="186" r="3" fill="#8491B4"/>
  <text x="90" y="190" font-size="13" fill="#252A33">.vscode 推荐统一插件</text>
  <text x="155" y="216" text-anchor="middle" font-size="11" fill="#6B7280">管好坏与长相，不碰运行时</text>

  <!-- 面板 B：开发期 -->
  <rect x="295" y="40" width="230" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="315" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="337" y="71" font-size="14" font-weight="600" fill="#252A33">开发期 · vite dev</text>
  <circle cx="331" cy="110" r="3" fill="#8491B4"/>
  <text x="345" y="114" font-size="13" fill="#252A33">server.proxy 免跨域</text>
  <circle cx="331" cy="148" r="3" fill="#8491B4"/>
  <text x="345" y="152" font-size="13" fill="#252A33">.env.development 注入变量</text>
  <circle cx="331" cy="186" r="3" fill="#8491B4"/>
  <text x="345" y="190" font-size="13" fill="#252A33">HMR 秒级热替换</text>
  <text x="410" y="216" text-anchor="middle" font-size="11" fill="#6B7280">vite.config 主宰本阶段</text>

  <!-- 面板 C：生产期 -->
  <rect x="550" y="40" width="230" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="570" y="72" font-size="18" font-weight="700" fill="#3C5488">C</text>
  <text x="592" y="71" font-size="14" font-weight="600" fill="#252A33">生产期 · vite build</text>
  <circle cx="586" cy="110" r="3" fill="#8491B4"/>
  <text x="600" y="114" font-size="13" fill="#252A33">同名 .env.production 替换</text>
  <circle cx="586" cy="148" r="3" fill="#8491B4"/>
  <text x="600" y="152" font-size="13" fill="#252A33">产物 dist/ 待部署上线</text>
  <circle cx="586" cy="186" r="3" fill="#E64B35"/>
  <text x="600" y="190" font-size="13" fill="#252A33">vue-tsc 把不住门就别发货</text>
  <text x="665" y="216" text-anchor="middle" font-size="11" fill="#6B7280">类型检查是上线前置闸门</text>

  <text x="410" y="256" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜根目录配置文件的三阶段分工——按生命周期归位就不再眼花</text>
</svg>
