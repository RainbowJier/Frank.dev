<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="356" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="355" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：hash -->
  <rect x="28" y="24" width="764" height="140" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="48" y="56" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="72" y="56" font-size="16" font-weight="600" fill="#252A33">hash 模式</text>

  <rect x="48" y="78" width="240" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="168" y="96" text-anchor="middle" font-size="11" fill="#6B7280">URL 形态</text>
  <text x="168" y="119" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">example.com/#/orders/42</text>

  <line x1="294" y1="106" x2="320" y2="106" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="324" y="78" width="220" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="434" y="96" text-anchor="middle" font-size="11" fill="#6B7280">原理</text>
  <text x="434" y="113" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33"># 后变化不发请求</text>
  <text x="434" y="128" text-anchor="middle" font-size="11" fill="#6B7280">hashchange 事件驱动</text>

  <rect x="572" y="78" width="192" height="56" rx="6" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1.5"/>
  <text x="668" y="99" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">部署零配置</text>
  <text x="668" y="120" text-anchor="middle" font-size="11" fill="#6B7280">代价：URL 丑、SEO 弱</text>

  <!-- 面板 B：history -->
  <rect x="28" y="180" width="764" height="140" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="48" y="212" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="72" y="212" font-size="16" font-weight="600" fill="#252A33">history 模式</text>

  <rect x="48" y="234" width="240" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="168" y="252" text-anchor="middle" font-size="11" fill="#6B7280">URL 形态</text>
  <text x="168" y="275" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">example.com/orders/42</text>

  <line x1="294" y1="262" x2="320" y2="262" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="324" y="234" width="220" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="434" y="252" text-anchor="middle" font-size="11" fill="#6B7280">原理</text>
  <text x="434" y="269" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">pushState 改地址不刷新</text>
  <text x="434" y="284" text-anchor="middle" font-size="11" fill="#6B7280">刷新 / 直开则会真请求</text>

  <rect x="572" y="234" width="192" height="56" rx="6" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="1.5"/>
  <text x="668" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">需要服务端兜底</text>
  <text x="668" y="276" text-anchor="middle" font-size="11" fill="#6B7280">nginx try_files（第 8 篇）</text>

  <text x="410" y="344" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜hash 与 history：两种"不发请求改 URL"的方式，差异集中在部署侧</text>
</svg>
