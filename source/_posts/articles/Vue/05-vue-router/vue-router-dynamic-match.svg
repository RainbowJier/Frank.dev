<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="340" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="339" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 动态路由匹配 -->
  <rect x="40" y="44" width="170" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="125" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">浏览器 URL</text>
  <text x="125" y="90" text-anchor="middle" font-size="12" fill="#6B7280">/orders/42</text>

  <line x1="214" y1="74" x2="240" y2="74" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="244" y="44" width="170" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="329" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">查路由表</text>
  <text x="329" y="90" text-anchor="middle" font-size="12" fill="#6B7280">/orders/:id 命中</text>

  <line x1="418" y1="74" x2="444" y2="74" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="448" y="44" width="170" height="60" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="533" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">提取参数</text>
  <text x="533" y="90" text-anchor="middle" font-size="12" fill="#6B7280">params = { id: 42 }</text>

  <line x1="622" y1="74" x2="648" y2="74" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="652" y="44" width="130" height="60" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="717" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">渲染组件</text>
  <text x="717" y="90" text-anchor="middle" font-size="12" fill="#6B7280">OrderDetail</text>

  <!-- 嵌套路由 -->
  <text x="40" y="170" font-size="14" font-weight="600" fill="#252A33">嵌套路由：壳与洞</text>

  <rect x="40" y="186" width="380" height="100" rx="10" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="230" y="212" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">SettingsLayout（壳：常驻侧边栏）</text>
  <rect x="80" y="228" width="200" height="42" rx="6" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="180" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">router-view（洞）</text>
  <text x="180" y="263" text-anchor="middle" font-size="11" fill="#6B7280">子路由组件的出入口</text>
  <text x="364" y="274" text-anchor="end" font-size="11" fill="#6B7280">/settings/profile</text>

  <rect x="500" y="196" width="170" height="44" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="585" y="215" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Profile 子组件</text>
  <text x="585" y="232" text-anchor="middle" font-size="11" fill="#6B7280">children 声明</text>

  <line x1="496" y1="218" x2="286" y2="243" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="216" text-anchor="middle" font-size="11" fill="#6B7280">渲染进出户口</text>

  <text x="410" y="326" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜动态路由匹配与嵌套出口：path 模式对账提取参数，子组件渲染进父组件的洞</text>
</svg>
