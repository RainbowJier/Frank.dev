<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="420" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="419" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F39B7F"/>
    </marker>
  </defs>

  <!-- 面板 A：读流程 -->
  <rect x="40" y="40" width="740" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">读：Cache Aside 旁路缓存</text>

  <rect x="70" y="95" width="80" height="44" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="110" y="122" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">请求</text>
  <line x1="152" y1="117" x2="178" y2="117" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="182" y="95" width="90" height="44" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="227" y="122" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">读缓存</text>
  <line x1="274" y1="117" x2="300" y2="117" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="109" text-anchor="middle" font-size="11" fill="#6B7280">命中</text>
  <rect x="304" y="95" width="100" height="44" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="354" y="122" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">直接返回</text>

  <!-- miss 分支 -->
  <path d="M227 141 L227 165" stroke="#5A6472" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="244" y="160" font-size="11" fill="#6B7280">未命中</text>
  <rect x="182" y="170" width="90" height="44" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="227" y="197" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">读 MySQL</text>
  <line x1="274" y1="192" x2="300" y2="192" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="304" y="170" width="100" height="44" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="354" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">回写缓存</text>
  <text x="354" y="207" text-anchor="middle" font-size="11" fill="#6B7280">设置 TTL</text>

  <text x="470" y="110" font-size="12" fill="#6B7280">命中：只查缓存，速度最快</text>
  <text x="470" y="130" font-size="12" fill="#6B7280">未命中：回源并回写，</text>
  <text x="470" y="150" font-size="12" fill="#6B7280">让下一次请求能命中</text>

  <!-- 面板 B：写流程 -->
  <rect x="40" y="246" width="740" height="130" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="278" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="86" y="277" font-size="14" font-weight="600" fill="#252A33">写：先更新库，再删缓存（延迟双删）</text>

  <rect x="70" y="300" width="110" height="44" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="125" y="327" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">更新 MySQL</text>
  <line x1="182" y1="322" x2="208" y2="322" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="212" y="300" width="90" height="44" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="257" y="327" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">删缓存</text>
  <path d="M304 322 C334 322 334 322 364 322" stroke="#F39B7F" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="334" y="314" text-anchor="middle" font-size="11" fill="#6B7280">延迟 ~500ms</text>
  <rect x="368" y="300" width="100" height="44" rx="6" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="418" y="327" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">再删一次</text>

  <text x="510" y="316" font-size="12" fill="#6B7280">为什么删而不是更新：并发写时缓存</text>
  <text x="510" y="336" font-size="12" fill="#6B7280">更新可能乱序；删除天然幂等</text>

  <text x="410" y="404" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜Cache Aside 模式与延迟双删：先更新数据库，再删除缓存</text>
</svg>
