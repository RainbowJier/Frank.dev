<text x="40" y="38" font-size="18" font-weight="700" fill="#3C5488">A</text><text x="66" y="38" font-size="15" font-weight="600" fill="#252A33">查询性能优化闭环</text><rect x="46" y="75" width="150" height="74" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/><text x="121.0" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">1 建基线</text><text x="121.0" y="130.0" text-anchor="middle" font-size="11" fill="#6B7280">P50 / P95 / P99</text><rect x="242" y="75" width="150" height="74" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/><text x="317.0" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">2 找证据</text><text x="317.0" y="130.0" text-anchor="middle" font-size="11" fill="#6B7280">Profile / 慢日志</text><rect x="438" y="75" width="150" height="74" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/><text x="513.0" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">3 改一项</text><text x="513.0" y="130.0" text-anchor="middle" font-size="11" fill="#6B7280">DSL / Mapping / 分片</text><rect x="634" y="75" width="140" height="74" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/><text x="704.0" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">4 回归</text><text x="704.0" y="130.0" text-anchor="middle" font-size="11" fill="#6B7280">压测 / 回滚</text><line x1="202" y1="112" x2="236" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="398" y1="112" x2="432" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="594" y1="112" x2="628" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="46" y="190" width="728" height="128" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/><text x="70" y="219" font-size="14" font-weight="600" fill="#252A33">检查清单</text><circle cx="78" cy="247" r="3" fill="#3C5488"/><text x="91" y="251" font-size="12" fill="#252A33">filter 承载精确条件；控制 _source、track_total_hits 与响应体</text><circle cx="78" cy="276" r="3" fill="#4DBBD5"/><text x="91" y="280" font-size="12" fill="#252A33">深分页用 search_after；需要一致视图时配合 PIT</text><circle cx="78" cy="305" r="3" fill="#E64B35"/><text x="91" y="309" font-size="12" fill="#252A33">避免前导 wildcard、高基数 terms、逐文档 script</text><path d="M704 165 C704 370 121 370 121 165" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="410" y="365" text-anchor="middle" font-size="11" fill="#6B7280">上线后持续采样：结果正确性与资源预算同时达标</text><text x="410.0" y="404" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜从基线到回归的 Elasticsearch 查询性能优化检查清单</text></svg>
