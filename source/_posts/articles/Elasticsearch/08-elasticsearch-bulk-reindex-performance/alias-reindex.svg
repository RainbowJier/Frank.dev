<text x="40" y="38" font-size="18" font-weight="700" fill="#3C5488">A</text><text x="66" y="38" font-size="15" font-weight="600" fill="#252A33">Alias 原子切换</text><rect x="46" y="80" width="174" height="66" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/><text x="133.0" y="111.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">products-v1</text><text x="133.0" y="131.0" text-anchor="middle" font-size="11" fill="#6B7280">旧 Mapping</text><rect x="324" y="80" width="174" height="66" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/><text x="411.0" y="111.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">products-v2</text><text x="411.0" y="131.0" text-anchor="middle" font-size="11" fill="#6B7280">新 Mapping / Reindex</text><rect x="602" y="80" width="174" height="66" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/><text x="689.0" y="111.0" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">products-read</text><text x="689.0" y="131.0" text-anchor="middle" font-size="11" fill="#6B7280">应用只见 Alias</text><line x1="228" y1="113" x2="316" y2="113" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/><text x="272.0" y="105.0" text-anchor="middle" font-size="11" fill="#6B7280">全量</text><line x1="506" y1="113" x2="594" y2="113" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/><text x="550.0" y="105.0" text-anchor="middle" font-size="11" fill="#6B7280">校验后切换</text><path d="M133 155 C133 211 411 211 411 155" fill="none" stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="272" y="207" text-anchor="middle" font-size="11" fill="#6B7280">增量事件补偿 / 版本保护</text><rect x="46" y="246" width="730" height="58" rx="9" fill="#F4F7FA" stroke="#D9DFE8"/><text x="72" y="270" font-size="13" fill="#252A33">切换前：_count、抽样哈希、关键查询、聚合、延迟</text><text x="72" y="292" font-size="13" fill="#252A33">