<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <rect x="38" y="70" width="126" height="66" rx="8" fill="#3C5488" fill-opacity="0.11" stroke="#3C5488" stroke-width="1.5"/>
  <text x="101" y="97" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">用户关键词</text>
  <text x="101" y="118" text-anchor="middle" font-size="12" fill="#6B7280">Spring 事务</text>

  <rect x="196" y="70" width="126" height="66" rx="8" fill="#4DBBD5" fill-opacity="0.13" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="259" y="97" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">查询分析</text>
  <text x="259" y="118" text-anchor="middle" font-size="12" fill="#6B7280">词项与查询规则</text>

  <rect x="354" y="70" width="126" height="66" rx="8" fill="#4DBBD5" fill-opacity="0.13" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="417" y="97" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">倒排索引</text>
  <text x="417" y="118" text-anchor="middle" font-size="12" fill="#6B7280">词项 → 文档列表</text>

  <rect x="512" y="70" width="126" height="66" rx="8" fill="#00A087" fill-opacity="0.11" stroke="#00A087" stroke-width="1.5"/>
  <text x="575" y="97" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">召回与过滤</text>
  <text x="575" y="118" text-anchor="middle" font-size="12" fill="#6B7280">候选文档收敛</text>

  <rect x="670" y="70" width="112" height="66" rx="8" fill="#3C5488" fill-opacity="0.11" stroke="#3C5488" stroke-width="1.5"/>
  <text x="726" y="97" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">结果排序</text>
  <text x="726" y="118" text-anchor="middle" font-size="12" fill="#6B7280">_score + 业务规则</text>

  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="167" y1="103" x2="190" y2="103" marker-end="url(#arrow)"/>
    <line x1="325" y1="103" x2="348" y2="103" marker-end="url(#arrow)"/>
    <line x1="483" y1="103" x2="506" y2="103" marker-end="url(#arrow)"/>
    <line x1="641" y1="103" x2="664" y2="103" marker-end="url(#arrow)"/>
  </g>

  <rect x="152" y="179" width="516" height="84" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="176" y="205" font-size="13" font-weight="600" fill="#252A33">bool 查询的职责拆分</text>
  <rect x="176" y="220" width="132" height="28" rx="5" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.2"/>
  <text x="242" y="239" text-anchor="middle" font-size="12" fill="#252A33">must：全文匹配</text>
  <rect x="342" y="220" width="132" height="28" rx="5" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.2"/>
  <text x="408" y="239" text-anchor="middle" font-size="12" fill="#252A33">filter：精确条件</text>
  <rect x="508" y="220" width="136" height="28" rx="5" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1.2"/>
  <text x="576" y="239" text-anchor="middle" font-size="12" fill="#252A33">sort：结果排序</text>
  <line x1="575" y1="139" x2="575" y2="173" stroke="#9AA4B2" stroke-width="1" stroke-dasharray="5 4"/>
  <circle cx="575" cy="176" r="2.5" fill="#9AA4B2"/>

  <text x="410" y="308" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜关键词经过分析、召回、过滤与排序后返回命中结果</text>
</svg>
