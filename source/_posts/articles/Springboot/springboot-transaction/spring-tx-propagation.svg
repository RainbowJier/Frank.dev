<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="399" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：REQUIRED -->
  <rect x="40" y="40" width="240" height="310" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="60" y="68" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="82" y="67" font-size="14" font-weight="600" fill="#252A33">REQUIRED</text>
  <text x="82" y="84" font-size="11" fill="#6B7280">加入当前事务（默认）</text>

  <text x="58" y="133" font-size="11" fill="#6B7280">方法 A</text>
  <text x="58" y="183" font-size="11" fill="#6B7280">方法 B</text>

  <rect x="102" y="116" width="155" height="22" rx="4" fill="#3C5488" fill-opacity="0.35" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="147" y="166" width="70" height="22" rx="4" fill="#3C5488" fill-opacity="0.55" stroke="#3C5488" stroke-width="1.5"/>

  <rect x="94" y="106" width="171" height="92" rx="8" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="179" y="214" text-anchor="middle" font-size="11" fill="#6B7280">同一个物理事务</text>

  <circle cx="64" cy="244" r="3.5" fill="#00A087"/>
  <text x="76" y="248" font-size="12" fill="#252A33">共进退：一处失败整体回滚</text>
  <circle cx="64" cy="272" r="3.5" fill="#8491B4"/>
  <text x="76" y="276" font-size="12" fill="#252A33">默认值，绝大多数场景够用</text>

  <!-- 面板 B：REQUIRES_NEW -->
  <rect x="300" y="40" width="240" height="310" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="320" y="68" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="342" y="67" font-size="14" font-weight="600" fill="#252A33">REQUIRES_NEW</text>
  <text x="342" y="84" font-size="11" fill="#6B7280">挂起当前，另起新事务</text>

  <text x="318" y="133" font-size="11" fill="#6B7280">方法 A</text>
  <text x="318" y="183" font-size="11" fill="#6B7280">方法 B</text>

  <rect x="362" y="116" width="62" height="22" rx="4" fill="#3C5488" fill-opacity="0.35" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="482" y="116" width="35" height="22" rx="4" fill="#3C5488" fill-opacity="0.35" stroke="#3C5488" stroke-width="1.5"/>
  <text x="453" y="132" text-anchor="middle" font-size="11" fill="#6B7280">挂起</text>

  <rect x="430" y="166" width="46" height="22" rx="4" fill="#00A087" fill-opacity="0.35" stroke="#00A087" stroke-width="1.5"/>
  <rect x="422" y="158" width="62" height="38" rx="8" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="453" y="214" text-anchor="middle" font-size="11" fill="#6B7280">独立新事务</text>

  <circle cx="324" cy="244" r="3.5" fill="#00A087"/>
  <text x="336" y="248" font-size="12" fill="#252A33">B 独立提交或回滚</text>
  <circle cx="324" cy="272" r="3.5" fill="#8491B4"/>
  <text x="336" y="276" font-size="12" fill="#252A33">典型：记操作日志、发通知</text>

  <!-- 面板 C：NESTED -->
  <rect x="560" y="40" width="240" height="310" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="580" y="68" font-size="18" font-weight="700" fill="#3C5488">C</text>
  <text x="602" y="67" font-size="14" font-weight="600" fill="#252A33">NESTED</text>
  <text x="602" y="84" font-size="11" fill="#6B7280">嵌套事务（保存点）</text>

  <text x="578" y="133" font-size="11" fill="#6B7280">方法 A</text>
  <text x="578" y="183" font-size="11" fill="#6B7280">方法 B</text>

  <rect x="622" y="116" width="155" height="22" rx="4" fill="#3C5488" fill-opacity="0.35" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="663" y="123" width="8" height="8" fill="#FFFFFF" stroke="#F39B7F" stroke-width="1.5" transform="rotate(45 667 127)"/>
  <rect x="667" y="166" width="70" height="22" rx="4" fill="#F39B7F" fill-opacity="0.35" stroke="#F39B7F" stroke-width="1.5"/>
  <rect x="659" y="158" width="86" height="38" rx="8" fill="none" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="702" y="214" text-anchor="middle" font-size="11" fill="#6B7280">嵌套子事务</text>

  <circle cx="584" cy="244" r="3.5" fill="#F39B7F"/>
  <text x="596" y="248" font-size="12" fill="#252A33">B 回滚到保存点，A 继续</text>
  <circle cx="584" cy="272" r="3.5" fill="#8491B4"/>
  <text x="596" y="276" font-size="12" fill="#252A33">典型：批处理失败重试</text>

  <text x="410" y="378" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜三种常用传播行为的事务边界对比（方法 B 在方法 A 内部被调用）</text>
</svg>
