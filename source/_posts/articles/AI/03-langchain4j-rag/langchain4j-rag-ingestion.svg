<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 五个节点 -->
  <g stroke-width="1.5">
    <rect x="40"  y="70" width="132" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="192" y="70" width="132" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="344" y="70" width="132" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="496" y="70" width="132" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="648" y="70" width="132" height="64" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="106" y="93">文档加载与解析</text>
    <text x="258" y="93">切分</text>
    <text x="410" y="93">分段与元数据</text>
    <text x="562" y="93">批量向量化</text>
    <text x="714" y="93">向量入库</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="106" y="111">DocumentParser</text>
    <text x="106" y="126">PDF · Word · HTML</text>
    <text x="258" y="111">DocumentSplitter</text>
    <text x="258" y="126">递归 / 滑窗 + overlap</text>
    <text x="410" y="111">TextSegment</text>
    <text x="410" y="126">+ Metadata</text>
    <text x="562" y="111">embedAll</text>
    <text x="562" y="126">本地 / API 模型</text>
    <text x="714" y="111">EmbeddingStore</text>
    <text x="714" y="126">addAll(向量, 分段)</text>
  </g>

  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="172" y1="102" x2="186" y2="102" marker-end="url(#arrow)"/>
    <line x1="324" y1="102" x2="338" y2="102" marker-end="url(#arrow)"/>
    <line x1="476" y1="102" x2="490" y2="102" marker-end="url(#arrow)"/>
    <line x1="628" y1="102" x2="642" y2="102" marker-end="url(#arrow)"/>
  </g>

  <text x="40" y="182" font-size="11" fill="#6B7280">EmbeddingStoreIngestor 可以把第 2~5 步串成一条链路一次跑完；逐步手工控制则能插入状态机、进度跟踪与失败重试</text>
  <text x="40" y="206" font-size="11" fill="#6B7280">chunk 大小与 overlap 是检索质量的两个主旋钮：太大稀释语义、太小丢上下文，overlap 防关键句被切断在边界</text>
  <text x="40" y="230" font-size="11" fill="#6B7280">写入的向量维度必须与 EmbeddingStore 建表维度一致（换模型 = 换维度 = 重建库）</text>

  <text x="410" y="296" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜RAG 摄入管道：解析 → 切分 → 分段 → 向量化 → 入库</text>
</svg>
