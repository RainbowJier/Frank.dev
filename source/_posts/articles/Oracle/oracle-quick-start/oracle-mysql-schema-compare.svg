<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 375" width="820" height="375"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="375" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="374" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：MySQL -->
  <rect x="40" y="40" width="360" height="270" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="74" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="88" y="73" font-size="14" font-weight="600" fill="#252A33">MySQL：按「库」组织</text>

  <rect x="90" y="92" width="260" height="42" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="220" y="118" text-anchor="middle" font-size="13" fill="#252A33">实例 mysqld</text>
  <line x1="220" y1="134" x2="220" y2="150" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="154" width="220" height="42" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="220" y="180" text-anchor="middle" font-size="13" fill="#252A33">数据库 mysql_zero_to_one</text>
  <line x1="220" y1="196" x2="220" y2="212" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="216" width="180" height="42" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="220" y="242" text-anchor="middle" font-size="13" fill="#252A33">表 users、orders…</text>

  <text x="220" y="290" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Consolas,Menlo,monospace">USE mysql_zero_to_one; SELECT * FROM users;</text>

  <!-- 面板 B：Oracle -->
  <rect x="420" y="40" width="360" height="270" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="74" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="468" y="73" font-size="14" font-weight="600" fill="#252A33">Oracle：按「用户 / schema」组织</text>

  <rect x="470" y="92" width="260" height="42" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="600" y="118" text-anchor="middle" font-size="13" fill="#252A33">实例（内存 + 进程）</text>
  <line x1="600" y1="134" x2="600" y2="150" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="154" width="220" height="42" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="600" y="180" text-anchor="middle" font-size="13" fill="#252A33">用户 frank ＝ schema</text>
  <line x1="600" y1="196" x2="600" y2="212" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="216" width="180" height="42" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
  <text x="600" y="236" text-anchor="middle" font-size="13" fill="#252A33">表 users、orders…</text>
  <text x="600" y="254" text-anchor="middle" font-size="11" fill="#6B7280">逻辑属于 frank</text>

  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Consolas,Menlo,monospace">SELECT * FROM frank.users;</text>

  <text x="410" y="340" text-anchor="middle" font-size="11" fill="#6B7280">Oracle 建用户时指定默认表空间：表在逻辑上属于 schema，物理上落在表空间的数据文件中</text>
  <text x="410" y="362" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜命名空间对照：MySQL 的「库」≈ Oracle 的「用户（schema）」</text>
</svg>
