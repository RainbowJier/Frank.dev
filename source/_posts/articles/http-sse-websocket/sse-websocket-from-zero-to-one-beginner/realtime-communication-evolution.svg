<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="17" font-weight="600" fill="#252A33">实时通信的连接形态</text>
  <text x="40" y="65" font-size="11" fill="#6B7280">请求次数减少，通信方向逐步扩展</text>
  <line x1="72" y1="168" x2="752" y2="168" stroke="#5A6472" stroke-width="1.5"/>
  <g stroke-width="1.5">
    <rect x="40" y="110" width="145" height="92" rx="9" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="225" y="110" width="145" height="92" rx="9" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="410" y="110" width="145" height="92" rx="9" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
    <rect x="595" y="110" width="185" height="92" rx="9" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
  </g>
  <g fill="#252A33" text-anchor="middle">
    <text x="112" y="137" font-size="15" font-weight="600">短轮询</text>
    <text x="112" y="159" font-size="11" fill="#6B7280">定时发起请求</text>
    <text x="112" y="179" font-size="11" fill="#6B7280">双向但大量空请求</text>
    <text x="297" y="137" font-size="15" font-weight="600">长轮询</text>
    <text x="297" y="159" font-size="11" fill="#6B7280">请求保持等待</text>
    <text x="297" y="179" font-size="11" fill="#6B7280">减少空请求</text>
    <text x="482" y="137" font-size="15" font-weight="600">SSE</text>
    <text x="482" y="159" font-size="11" fill="#6B7280">HTTP 长连接</text>
    <text x="482" y="179" font-size="11" fill="#6B7280">服务器单向推送</text>
    <text x="687" y="137" font-size="15" font-weight="600">WebSocket</text>
    <text x="687" y="159" font-size="11" fill="#6B7280">协议升级后保持连接</text>
    <text x="687" y="179" font-size="11" fill="#6B7280">客户端与服务器双向</text>
  </g>
  <g stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="156" x2="218" y2="156"/>
    <line x1="375" y1="156" x2="403" y2="156"/>
    <line x1="560" y1="156" x2="588" y2="156"/>
  </g>
  <g font-size="12" fill="#6B7280" text-anchor="middle">
    <text x="112" y="246">浏览器：问“有变化吗？”</text>
    <text x="297" y="246">服务器：有变化才返回</text>
    <text x="482" y="246">服务器：持续发送事件</text>
    <text x="687" y="246">双方：随时发送消息</text>
  </g>
  <text x="410" y="302" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜从轮询到持久连接的实时通信演进</text>
</svg>
