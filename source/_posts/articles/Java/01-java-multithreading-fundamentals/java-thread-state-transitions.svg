<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="470" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="469" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 顶行：NEW 与 TERMINATED（灰紫弱化） -->
  <g stroke="#8491B4" stroke-width="1.5" fill="#8491B4" fill-opacity="0.12">
    <rect x="60"  y="60" width="130" height="52" rx="8"/>
    <rect x="630" y="60" width="130" height="52" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="125" y="82"  font-size="14" font-weight="600" fill="#252A33">NEW</text>
    <text x="125" y="100" font-size="11" fill="#6B7280">已创建未启动</text>
    <text x="695" y="82"  font-size="14" font-weight="600" fill="#252A33">TERMINATED</text>
    <text x="695" y="100" font-size="11" fill="#6B7280">run() 结束</text>
  </g>

  <!-- 中枢：RUNNABLE（青绿） -->
  <rect x="120" y="180" width="580" height="60" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="410" y="205" font-size="15" font-weight="600" fill="#252A33">RUNNABLE</text>
    <text x="410" y="225" font-size="11" fill="#6B7280">就绪 + 运行中（Java 不再细分）</text>
  </g>

  <!-- NEW → RUNNABLE / RUNNABLE → TERMINATED -->
  <line x1="165" y1="112" x2="240" y2="178" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="152" text-anchor="middle" font-size="11" fill="#6B7280">start()</text>
  <line x1="580" y1="180" x2="655" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="158" text-anchor="middle" font-size="11" fill="#6B7280">run() 正常结束</text>

  <!-- 底行：三个非运行态（深蓝） -->
  <g stroke="#3C5488" stroke-width="1.5" fill="#3C5488" fill-opacity="0.12">
    <rect x="90"  y="330" width="160" height="52" rx="8"/>
    <rect x="330" y="330" width="160" height="52" rx="8"/>
    <rect x="565" y="330" width="170" height="52" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="170" y="352" font-size="14" font-weight="600" fill="#252A33">BLOCKED</text>
    <text x="170" y="370" font-size="11" fill="#6B7280">等待监视器锁</text>
    <text x="410" y="352" font-size="14" font-weight="600" fill="#252A33">WAITING</text>
    <text x="410" y="370" font-size="11" fill="#6B7280">无限期等待</text>
    <text x="650" y="352" font-size="14" font-weight="600" fill="#252A33">TIMED_WAITING</text>
    <text x="650" y="370" font-size="11" fill="#6B7280">限时等待</text>
  </g>

  <!-- BLOCKED：下行（进入）/ 上行（返回） -->
  <line x1="140" y1="240" x2="140" y2="326" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="330" x2="180" y2="244" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="278" text-anchor="end" font-size="11" fill="#6B7280">竞争锁失败</text>
  <text x="188" y="312" font-size="11" fill="#6B7280">获得锁</text>

  <!-- WAITING -->
  <line x1="400" y1="240" x2="400" y2="326" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="330" x2="440" y2="244" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="278" text-anchor="end" font-size="11" fill="#6B7280">wait()/join()/park()</text>
  <text x="448" y="312" font-size="11" fill="#6B7280">notify()/unpark()</text>

  <!-- TIMED_WAITING -->
  <line x1="610" y1="240" x2="610" y2="326" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="330" x2="650" y2="244" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="278" text-anchor="end" font-size="11" fill="#6B7280">sleep(ms)/wait(ms)</text>
  <text x="658" y="312" font-size="11" fill="#6B7280">超时或被唤醒</text>

  <text x="410" y="442" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜Thread.State 六种状态及转换路径</text>
</svg>
