<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="470" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="469" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>
  <text x="38" y="42" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="64" y="42" font-size="15" font-weight="600" fill="#252A33">ThreadPoolExecutor 的组件协作</text>

  <rect x="214" y="72" width="392" height="326" rx="12" fill="#3C5488" fill-opacity="0.05" stroke="#3C5488" stroke-width="2"/>
  <text x="410" y="104" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">ThreadPoolExecutor</text>
  <line x1="240" y1="120" x2="580" y2="120" stroke="#D9DFE8" stroke-width="1"/>

  <rect x="246" y="144" width="148" height="76" rx="8" fill="#4DBBD5" fill-opacity="0.13" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="320" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">核心 worker</text>
  <text x="320" y="197" text-anchor="middle" font-size="11" fill="#6B7280">稳定处理常规流量</text>

  <rect x="426" y="144" width="148" height="76" rx="8" fill="#F39B7F" fill-opacity="0.13" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="500" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">非核心 worker</text>
  <text x="500" y="197" text-anchor="middle" font-size="11" fill="#6B7280">队列满后临时扩容</text>

  <rect x="246" y="248" width="328" height="58" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="410" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">workQueue：等待中的任务</text>
  <text x="410" y="291" text-anchor="middle" font-size="11" fill="#6B7280">容量决定积压上限，也决定何时扩容</text>

  <rect x="246" y="330" width="148" height="42" rx="7" fill="#8491B4" fill-opacity="0.13" stroke="#8491B4" stroke-width="1.5"/>
  <text x="320" y="356" text-anchor="middle" font-size="13" fill="#252A33">threadFactory</text>
  <rect x="426" y="330" width="148" height="42" rx="7" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="1.5"/>
  <text x="500" y="356" text-anchor="middle" font-size="13" fill="#252A33">rejectedHandler</text>

  <line x1="164" y1="182" x2="238" y2="182" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="42" y="155" width="120" height="54" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="102" y="187" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">调用方提交任务</text>

  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="206" y1="164" x2="128" y2="126"/>
    <line x1="606" y1="180" x2="688" y2="142"/>
    <line x1="606" y1="278" x2="688" y2="278"/>
    <line x1="394" y1="350" x2="184" y2="350"/>
    <line x1="574" y1="350" x2="686" y2="350"/>
  </g>
  <g fill="#9AA4B2">
    <circle cx="210" cy="166" r="2.5"/><circle cx="602" cy="180" r="2.5"/><circle cx="602" cy="278" r="2.5"/><circle cx="398" cy="350" r="2.5"/><circle cx="578" cy="350" r="2.5"/>
  </g>
  <g font-size="12" fill="#6B7280">
    <text x="48" y="122">corePoolSize：常驻数量</text>
    <text x="694" y="132" font-size="11">maximumPoolSize</text>
    <text x="694" y="148" font-size="11">扩容上限</text>
    <text x="694" y="268" font-size="11">有界队列：限制积压</text>
    <text x="694" y="284" font-size="11">与内存</text>
    <text x="48" y="346">命名、优先级、异常处理</text>
    <text x="692" y="346">满载时明确反馈给上游</text>
  </g>

  <text x="410" y="446" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜线程池以 worker、队列和过载策略共同管理任务生命周期</text>
</svg>
