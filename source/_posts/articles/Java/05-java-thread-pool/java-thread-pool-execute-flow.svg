<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="500" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="499" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>
  <text x="38" y="42" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="64" y="42" font-size="15" font-weight="600" fill="#252A33">ThreadPoolExecutor.execute(task) 决策</text>

  <rect x="310" y="66" width="200" height="54" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="410" y="98" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">提交任务 task</text>

  <line x1="410" y1="121" x2="410" y2="153" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="410,156 555,208 410,260 265,208" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="410" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">workerCount &lt; corePoolSize？</text>

  <line x1="265" y1="208" x2="145" y2="208" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="196" text-anchor="middle" font-size="11" fill="#6B7280">是</text>
  <rect x="38" y="181" width="104" height="54" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="90" y="204" text-anchor="middle" font-size="13" fill="#252A33">创建核心</text>
  <text x="90" y="222" text-anchor="middle" font-size="13" fill="#252A33">线程执行</text>

  <line x1="410" y1="260" x2="410" y2="292" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="296" width="260" height="54" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="410" y="328" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">workQueue.offer(task) 成功？</text>

  <line x1="280" y1="323" x2="145" y2="323" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="211" y="311" text-anchor="middle" font-size="11" fill="#6B7280">是</text>
  <rect x="38" y="296" width="104" height="54" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="90" y="319" text-anchor="middle" font-size="13" fill="#252A33">任务入队</text>
  <text x="90" y="337" text-anchor="middle" font-size="13" fill="#252A33">等待领取</text>

  <line x1="540" y1="323" x2="650" y2="323" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="594" y="311" text-anchor="middle" font-size="11" fill="#6B7280">否，队列满</text>
  <polygon points="665,271 780,323 665,375 550,323" fill="#F39B7F" fill-opacity="0.14" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="665" y="320" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">workerCount &lt;</text>
  <text x="665" y="338" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">maximumPoolSize？</text>

  <line x1="665" y1="375" x2="665" y2="399" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="391" font-size="11" fill="#6B7280">否</text>
  <rect x="586" y="405" width="158" height="52" rx="8" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="1.5"/>
  <text x="665" y="436" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">拒绝策略 handler</text>

  <line x1="780" y1="323" x2="792" y2="323" stroke="#5A6472" stroke-width="1.5"/>
  <line x1="792" y1="323" x2="792" y2="192" stroke="#5A6472" stroke-width="1.5"/>
  <line x1="792" y1="192" x2="707" y2="192" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="180" text-anchor="middle" font-size="11" fill="#6B7280">是</text>
  <rect x="565" y="166" width="140" height="52" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="635" y="189" text-anchor="middle" font-size="13" fill="#252A33">创建非核心</text>
  <text x="635" y="207" text-anchor="middle" font-size="13" fill="#252A33">线程执行</text>

  <text x="410" y="480" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜先核心线程，再入队，再扩至最大线程，最后拒绝</text>
</svg>
