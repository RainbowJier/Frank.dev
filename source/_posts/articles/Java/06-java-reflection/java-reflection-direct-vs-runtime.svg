<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="399" fill="none" stroke="#D9DFE8"/>

  <rect x="40" y="38" width="360" height="300" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="70" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="88" y="69" font-size="14" font-weight="600" fill="#252A33">编译期直接调用</text>
  <rect x="64" y="92" width="312" height="48" rx="7" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488"/>
  <text x="220" y="121" text-anchor="middle" font-size="12" fill="#252A33" font-family="'Courier New',monospace">userService.save(user)</text>
  <g font-size="13" fill="#252A33">
    <circle cx="78" cy="174" r="3" fill="#00A087"/>
    <text x="92" y="178">编译器检查类型与参数</text>
    <circle cx="78" cy="214" r="3" fill="#00A087"/>
    <text x="92" y="218">IDE 可追踪调用与重构</text>
    <circle cx="78" cy="254" r="3" fill="#8491B4"/>
    <text x="92" y="258">调用关系清晰，适合业务热路径</text>
  </g>
  <text x="220" y="306" text-anchor="middle" font-size="12" fill="#6B7280">类型已知 · 约束前置 · 可维护</text>

  <rect x="420" y="38" width="360" height="300" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="70" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="468" y="69" font-size="14" font-weight="600" fill="#252A33">运行时反射调用</text>
  <rect x="444" y="92" width="312" height="48" rx="7" fill="#4DBBD5" fill-opacity="0.10" stroke="#4DBBD5"/>
  <text x="600" y="121" text-anchor="middle" font-size="12" fill="#252A33" font-family="'Courier New',monospace">method.invoke(target, args)</text>
  <g font-size="13" fill="#252A33">
    <circle cx="458" cy="174" r="3" fill="#00A087"/>
    <text x="472" y="178">运行时发现类、成员与注解</text>
    <circle cx="458" cy="214" r="3" fill="#00A087"/>
    <text x="472" y="218">适合框架、插件与扩展点</text>
    <circle cx="458" cy="254" r="3" fill="#E64B35"/>
    <text x="472" y="258">类型错误晚发现，需白名单约束</text>
  </g>
  <text x="600" y="306" text-anchor="middle" font-size="12" fill="#6B7280">类型未知 · 约束后置 · 需治理</text>

  <line x1="410" y1="82" x2="410" y2="318" stroke="#D9DFE8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="410" y="370" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜类型确定时优先直接调用，运行时扩展才选择反射</text>
</svg>
