    <rect x="284" y="316" width="252" height="42" rx="7" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#252A33">
    <text x="410" y="134">构造器 Constructor</text>
    <text x="410" y="186">字段 Field</text>
    <text x="410" y="238">方法 Method</text>
