    <circle cx="540" cy="233" r="2.5"/><circle cx="540" cy="285" r="2.5"/>
    <circle cx="280" cy="337" r="2.5"/>
  </g>
  <g font-size="12" fill="#6B7280">
    <text x="220" y="124" text-anchor="end" font-family="'Courier New',monospace">getDeclaredConstructor()</text>
    <text x="220" y="176" text-anchor="end" font-family="'Courier New',monospace">getDeclaredFields()</text>
    <text x="600" y="228" font-family="'Courier New',monospace">getDeclaredMethods()</text>
