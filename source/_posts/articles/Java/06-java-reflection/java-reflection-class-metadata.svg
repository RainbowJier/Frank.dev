  </g>

  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="232" y1="129" x2="276" y2="129"/>
    <line x1="232" y1="181" x2="276" y2="181"/>
    <line x1="544" y1="233" x2="588" y2="233"/>
    <line x1="544" y1="285" x2="588" y2="285"/>
    <line x1="232" y1="337" x2="276" y2="337"/>
