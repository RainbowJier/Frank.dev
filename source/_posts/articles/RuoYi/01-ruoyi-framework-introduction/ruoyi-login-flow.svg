<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="260" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="259" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 节点 1-7，使用同色系，目标态用青绿 -->
  <g stroke-width="1.5">
    <rect x="30" y="70" width="92" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="140" y="70" width="92" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="250" y="70" width="92" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="360" y="70" width="92" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="470" y="70" width="92" height="64" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="580" y="70" width="92" height="64" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="690" y="70" width="92" height="64" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
  </g>

  <!-- 节点文字 -->
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="76" y="98">前端登录</text>
    <text x="186" y="98">Security</text>
    <text x="186" y="113">验证</text>
    <text x="296" y="98">生成</text>
    <text x="296" y="113">JWT</text>
    <text x="406" y="98">存入</text>
    <text x="406" y="113">Redis</text>
    <text x="516" y="98">返回</text>
    <text x="516" y="113">Token</text>
    <text x="626" y="98">携带</text>
    <text x="626" y="113">Token</text>
    <text x="736" y="98">权限</text>
    <text x="736" y="113">加载</text>
  </g>

  <!-- 箭头连接 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="124" y1="102" x2="135" y2="102" marker-end="url(#arrow)"/>
    <line x1="234" y1="102" x2="245" y2="102" marker-end="url(#arrow)"/>
    <line x1="344" y1="102" x2="355" y2="102" marker-end="url(#arrow)"/>
    <line x1="454" y1="102" x2="465" y2="102" marker-end="url(#arrow)"/>
    <line x1="564" y1="102" x2="575" y2="102" marker-end="url(#arrow)"/>
    <line x1="674" y1="102" x2="685" y2="102" marker-end="url(#arrow)"/>
  </g>

  <!-- 底部标注 -->
  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="76" y="156">用户名</text>
    <text x="76" y="170">密码</text>
    <text x="186" y="156">过滤器链</text>
    <text x="186" y="170">认证</text>
    <text x="296" y="156">TokenService</text>
    <text x="296" y="170">生成令牌</text>
    <text x="406" y="156">缓存用户</text>
    <text x="406" y="170">权限信息</text>
    <text x="516" y="156">前端接收</text>
    <text x="516" y="170">localStorage</text>
    <text x="626" y="156">Header</text>
    <text x="626" y="170">Authorization</text>
    <text x="736" y="156">从 Redis</text>
    <text x="736" y="170">获取权限</text>
  </g>

  <!-- 返回箭头（虚线，表示后续请求） -->
  <g stroke="#F39B7F" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M 575 134 Q 575 200, 235 200 Q 140 200, 140 138" fill="none" marker-end="url(#arrow)"/>
  </g>
  <text x="350" y="215" text-anchor="middle" font-size="11" fill="#F39B7F">后续请求循环</text>

  <text x="410" y="244" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜JWT Token 认证完整流程</text>
</svg>
