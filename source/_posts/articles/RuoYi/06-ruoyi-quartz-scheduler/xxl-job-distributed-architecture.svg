<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="480" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="479" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="410" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#3C5488">XXL-Job 分布式任务调度架构</text>

  <!-- 调度中心 -->
  <rect x="290" y="70" width="240" height="120" rx="10" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <text x="410" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#3C5488">调度中心（xxl-job-admin）</text>
  <g font-size="10" fill="#6B7280">
    <text x="310" y="125">• 任务配置与管理</text>
    <text x="310" y="142">• Cron 调度触发</text>
    <text x="310" y="159">• 执行器注册与发现</text>
    <text x="310" y="176">• 执行日志收集</text>
  </g>

  <!-- 执行器集群 -->
  <g>
    <!-- 执行器 1 -->
    <rect x="60" y="250" width="200" height="110" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="2"/>
    <text x="160" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#00A087">执行器 1</text>
    <text x="160" y="292" text-anchor="middle" font-size="9" fill="#6B7280">192.168.1.101:9999</text>
    <g font-size="10" fill="#6B7280">
      <text x="80" y="312">• JobHandler 1</text>
      <text x="80" y="327">• JobHandler 2</text>
      <text x="80" y="342">• JobHandler 3</text>
    </g>

    <!-- 执行器 2 -->
    <rect x="310" y="250" width="200" height="110" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="2"/>
    <text x="410" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#00A087">执行器 2</text>
    <text x="410" y="292" text-anchor="middle" font-size="9" fill="#6B7280">192.168.1.102:9999</text>
    <g font-size="10" fill="#6B7280">
      <text x="330" y="312">• JobHandler 1</text>
      <text x="330" y="327">• JobHandler 2</text>
      <text x="330" y="342">• JobHandler 3</text>
    </g>

    <!-- 执行器 3 -->
    <rect x="560" y="250" width="200" height="110" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="2"/>
    <text x="660" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#00A087">执行器 3</text>
    <text x="660" y="292" text-anchor="middle" font-size="9" fill="#6B7280">192.168.1.103:9999</text>
    <g font-size="10" fill="#6B7280">
      <text x="580" y="312">• JobHandler 1</text>
      <text x="580" y="327">• JobHandler 2</text>
      <text x="580" y="342">• JobHandler 3</text>
    </g>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#5A6472" stroke-width="2">
    <line x1="350" y1="195" x2="160" y2="245" marker-end="url(#arrow)"/>
    <line x1="410" y1="195" x2="410" y2="245" marker-end="url(#arrow)"/>
    <line x1="470" y1="195" x2="660" y2="245" marker-end="url(#arrow)"/>
  </g>

  <!-- 注册与调度标注 -->
  <g font-size="9" fill="#6B7280">
    <text x="220" y="220">注册</text>
    <text x="220" y="232">调度</text>
    
    <text x="415" y="220">注册</text>
    <text x="415" y="232">调度</text>
    
    <text x="550" y="220">注册</text>
    <text x="550" y="232">调度</text>
  </g>

  <!-- 核心特性 -->
  <rect x="40" y="390" width="740" height="55" rx="8" fill="#4DBBD5" fill-opacity="0.08" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="410" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#3C5488">XXL-Job 核心特性</text>
  <g font-size="10" fill="#6B7280">
    <text x="60" y="430">✓ 去中心化（执行器自动注册）</text>
    <text x="260" y="430">✓ 路由策略（轮询/随机/故障转移）</text>
    <text x="510" y="430">✓ 分片广播（海量数据并行处理）</text>
  </g>

  <text x="410" y="464" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜XXL-Job 调度中心管理多执行器，支持路由策略与分片广播</text>
</svg>