<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="480" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="479" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="410" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#3C5488">Druid 数据源监控功能</text>

  <!-- 访问路径 -->
  <rect x="220" y="70" width="380" height="50" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <text x="410" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">访问地址</text>
  <text x="410" y="112" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#3C5488">http://localhost/druid/login.html</text>

  <!-- SQL 监控 -->
  <rect x="40" y="150" width="230" height="140" rx="10" fill="#00A087" fill-opacity="0.08" stroke="#00A087" stroke-width="2"/>
  <text x="155" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#00A087">SQL 监控</text>
  
  <g font-size="10" fill="#252A33">
    <text x="60" y="205" font-weight="500">监控内容：</text>
    <text x="60" y="223" fill="#6B7280">• SQL 执行次数</text>
    <text x="60" y="238" fill="#6B7280">• 平均执行耗时</text>
    <text x="60" y="253" fill="#6B7280">• 最慢 SQL</text>
    <text x="60" y="268" fill="#6B7280">• 执行失败次数</text>
  </g>

  <!-- SQL 防火墙 -->
  <rect x="295" y="150" width="230" height="140" rx="10" fill="#4DBBD5" fill-opacity="0.08" stroke="#4DBBD5" stroke-width="2"/>
  <text x="410" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#4DBBD5">SQL 防火墙</text>
  
  <g font-size="10" fill="#252A33">
    <text x="315" y="205" font-weight="500">安全功能：</text>
    <text x="315" y="223" fill="#6B7280">• 防止 SQL 注入</text>
    <text x="315" y="238" fill="#6B7280">• 黑名单拦截</text>
    <text x="315" y="253" fill="#6B7280">• 白名单放行</text>
    <text x="315" y="268" fill="#6B7280">• 敏感信息过滤</text>
  </g>

  <!-- 连接池监控 -->
  <rect x="550" y="150" width="230" height="140" rx="10" fill="#F39B7F" fill-opacity="0.08" stroke="#F39B7F" stroke-width="2"/>
  <text x="665" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#F39B7F">连接池监控</text>
  
  <g font-size="10" fill="#252A33">
    <text x="570" y="205" font-weight="500">监控指标：</text>
    <text x="570" y="223" fill="#6B7280">• 活跃连接数</text>
    <text x="570" y="238" fill="#6B7280">• 空闲连接数</text>
    <text x="570" y="253" fill="#6B7280">• 等待获取连接数</text>
    <text x="570" y="268" fill="#6B7280">• 连接泄漏检测</text>
  </g>

  <!-- Web 应用监控 -->
  <rect x="40" y="310" width="230" height="130" rx="10" fill="#8491B4" fill-opacity="0.08" stroke="#8491B4" stroke-width="2"/>
  <text x="155" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#8491B4">Web 应用</text>
  
  <g font-size="10" fill="#252A33">
    <text x="60" y="365" font-weight="500">监控内容：</text>
    <text x="60" y="383" fill="#6B7280">• URI 请求统计</text>
    <text x="60" y="398" fill="#6B7280">• 请求耗时分布</text>
    <text x="60" y="413" fill="#6B7280">• Session 统计</text>
    <text x="60" y="428" fill="#6B7280">• Spring 监控</text>
  </g>

  <!-- URL 监控 -->
  <rect x="295" y="310" width="230" height="130" rx="10" fill="#E64B35" fill-opacity="0.08" stroke="#E64B35" stroke-width="2"/>
  <text x="410" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#E64B35">URL 监控</text>
  
  <g font-size="10" fill="#252A33">
    <text x="315" y="365" font-weight="500">统计维度：</text>
    <text x="315" y="383" fill="#6B7280">• 请求次数（QPS）</text>
    <text x="315" y="398" fill="#6B7280">• 并发数</text>
    <text x="315" y="413" fill="#6B7280">• 错误次数</text>
    <text x="315" y="428" fill="#6B7280">• 平均响应时间</text>
  </g>

  <!-- 慢 SQL 示例 -->
  <rect x="550" y="310" width="230" height="130" rx="10" fill="#FFF3E0" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="665" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#E64B35">慢 SQL 阈值</text>
  
  <g font-size="10" fill="#252A33">
    <text x="570" y="365" font-weight="500">配置：</text>
    <rect x="570" y="372" width="190" height="50" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="580" y="389">druid:</text>
      <text x="590" y="402">  slow-sql-millis:</text>
      <text x="600" y="415" fill="#E64B35" font-weight="600">    3000 (3秒)</text>
    </g>
  </g>

  <text x="410" y="464" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜Druid 监控：SQL 执行/防火墙/连接池/Web 应用/URL 统计/慢 SQL 检测</text>
</svg>