<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="480" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="479" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="410" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#3C5488">服务器性能监控指标</text>

  <!-- CPU 监控 -->
  <rect x="40" y="70" width="230" height="160" rx="10" fill="#3C5488" fill-opacity="0.08" stroke="#3C5488" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#3C5488">CPU 信息</text>
  
  <g font-size="10" fill="#252A33">
    <text x="60" y="125" font-weight="500">核心数：</text>
    <text x="60" y="143" fill="#6B7280">物理核心 + 逻辑核心</text>
    
    <text x="60" y="165" font-weight="500">使用率：</text>
    <rect x="60" y="172" width="190" height="40" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="70" y="189">用户使用率：65.2%</text>
      <text x="70" y="202">系统使用率：12.5%</text>
      <text x="70" y="215" fill="#3C5488" font-weight="600">当前空闲率：22.3%</text>
    </g>
  </g>

  <!-- 内存监控 -->
  <rect x="295" y="70" width="230" height="160" rx="10" fill="#00A087" fill-opacity="0.08" stroke="#00A087" stroke-width="2"/>
  <text x="410" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#00A087">内存信息</text>
  
  <g font-size="10" fill="#252A33">
    <text x="315" y="125" font-weight="500">物理内存：</text>
    <rect x="315" y="132" width="190" height="40" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="325" y="149">总内存：16.0 GB</text>
      <text x="325" y="162">已用：10.2 GB (63.8%)</text>
      <text x="325" y="175" fill="#00A087" font-weight="600">可用：5.8 GB</text>
    </g>
    
    <text x="315" y="195" font-weight="500">JVM 内存：</text>
    <rect x="315" y="202" width="190" height="20" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <text x="325" y="217" font-family="'Courier New',monospace" font-size="9">堆内存：2048 MB / 4096 MB</text>
  </g>

  <!-- 磁盘监控 -->
  <rect x="550" y="70" width="230" height="160" rx="10" fill="#4DBBD5" fill-opacity="0.08" stroke="#4DBBD5" stroke-width="2"/>
  <text x="665" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#4DBBD5">磁盘信息</text>
  
  <g font-size="10" fill="#252A33">
    <text x="570" y="125" font-weight="500">分区列表：</text>
    
    <rect x="570" y="132" width="190" height="30" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="580" y="147">C:\ 300 GB / 500 GB</text>
      <text x="580" y="160" fill="#4DBBD5">使用率：60%</text>
    </g>
    
    <rect x="570" y="167" width="190" height="30" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="580" y="182">D:\ 850 GB / 1000 GB</text>
      <text x="580" y="195" fill="#4DBBD5">使用率：85%</text>
    </g>
    
    <text x="570" y="218" font-size="9" fill="#E64B35" font-weight="600">⚠ 使用率 &gt; 80% 需清理</text>
  </g>

  <!-- 服务器基本信息 -->
  <rect x="40" y="260" width="360" height="180" rx="10" fill="#F39B7F" fill-opacity="0.08" stroke="#F39B7F" stroke-width="2"/>
  <text x="220" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#3C5488">服务器基本信息</text>
  
  <g font-size="10" fill="#252A33">
    <text x="60" y="315" font-family="'Courier New',monospace">服务器名称：</text>
    <text x="180" y="315" fill="#6B7280">DESKTOP-ABC123</text>
    
    <text x="60" y="332" font-family="'Courier New',monospace">服务器 IP：</text>
    <text x="180" y="332" fill="#6B7280">192.168.1.100</text>
    
    <text x="60" y="349" font-family="'Courier New',monospace">操作系统：</text>
    <text x="180" y="349" fill="#6B7280">Windows 10 x64</text>
    
    <text x="60" y="366" font-family="'Courier New',monospace">系统架构：</text>
    <text x="180" y="366" fill="#6B7280">amd64</text>
    
    <text x="60" y="383" font-family="'Courier New',monospace">运行时长：</text>
    <text x="180" y="383" fill="#6B7280">15 天 6 小时 32 分钟</text>
    
    <text x="60" y="400" font-family="'Courier New',monospace">Java 版本：</text>
    <text x="180" y="400" fill="#6B7280">1.8.0_291</text>
    
    <text x="60" y="417" font-family="'Courier New',monospace">项目路径：</text>
    <text x="180" y="417" fill="#6B7280" font-size="9">D:\Projects\ruoyi</text>
  </g>

  <!-- JVM 详细信息 -->
  <rect x="420" y="260" width="360" height="180" rx="10" fill="#8491B4" fill-opacity="0.08" stroke="#8491B4" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#3C5488">JVM 详细信息</text>
  
  <g font-size="10" fill="#252A33">
    <text x="440" y="315" font-family="'Courier New',monospace">JVM 名称：</text>
    <text x="560" y="315" fill="#6B7280">Java HotSpot(TM) 64-Bit</text>
    
    <text x="440" y="332" font-family="'Courier New',monospace">运行时长：</text>
    <text x="560" y="332" fill="#6B7280">2 天 8 小时 15 分钟</text>
    
    <text x="440" y="349" font-family="'Courier New',monospace">启动时间：</text>
    <text x="560" y="349" fill="#6B7280">2026-08-22 10:30:00</text>
    
    <text x="440" y="370" font-weight="500">堆内存：</text>
    <text x="440" y="387" font-family="'Courier New',monospace" font-size="9">初始内存：256 MB</text>
    <text x="440" y="402" font-family="'Courier New',monospace" font-size="9">最大内存：4096 MB</text>
    <text x="440" y="417" font-family="'Courier New',monospace" font-size="9" fill="#8491B4" font-weight="600">已用内存：2048 MB (50%)</text>
    <text x="440" y="432" font-family="'Courier New',monospace" font-size="9">可用内存：2048 MB</text>
  </g>

  <text x="410" y="464" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜实时监控 CPU/内存/磁盘使用率 + 服务器基本信息与 JVM 状态</text>
</svg>