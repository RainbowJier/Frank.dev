<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="500" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="499" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="410" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#3C5488">自定义模板开发流程</text>

  <!-- 步骤 1：复制原始模板 -->
  <rect x="40" y="70" width="200" height="80" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">1. 复制原始模板</text>
  <g font-size="10" fill="#6B7280" font-family="'Courier New',monospace">
    <text x="60" y="118">ruoyi-generator/</text>
    <text x="65" y="133">resources/vm/java/</text>
    <text x="75" y="148">controller.java.vm</text>
  </g>

  <!-- 步骤 2：修改模板内容 -->
  <rect x="280" y="70" width="200" height="80" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="2"/>
  <text x="380" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">2. 修改模板内容</text>
  <g font-size="10" fill="#6B7280">
    <text x="300" y="118">• 调整包名/类名</text>
    <text x="300" y="133">• 添加自定义方法</text>
    <text x="300" y="148">• 修改注解/注释</text>
  </g>

  <!-- 步骤 3：配置模板路径 -->
  <rect x="520" y="70" width="260" height="80" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="2"/>
  <text x="650" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33">3. 配置模板路径</text>
  <g font-size="10" fill="#6B7280" font-family="'Courier New',monospace">
    <text x="540" y="118">VelocityInitializer.java</text>
    <text x="540" y="133">→ initVelocity()</text>
    <text x="540" y="148">→ 添加模板文件路径</text>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#5A6472" stroke-width="2">
    <line x1="245" y1="110" x2="275" y2="110" marker-end="url(#arrow)"/>
    <line x1="485" y1="110" x2="515" y2="110" marker-end="url(#arrow)"/>
  </g>

  <!-- 示例：自定义 Controller 模板 -->
  <rect x="40" y="180" width="740" height="280" rx="10" fill="#F4F7FA" stroke="#D9DFE8" stroke-width="1"/>
  <text x="410" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#3C5488">示例：添加批量导入方法</text>

  <!-- 原始模板 -->
  <g font-size="10">
    <text x="60" y="235" font-weight="600" fill="#252A33">原始 controller.java.vm：</text>
    <rect x="60" y="245" width="330" height="190" rx="6" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="75" y="265">@RestController</text>
      <text x="75" y="280">@RequestMapping("/${businessName}")</text>
      <text x="75" y="295">public class ${ClassName}Controller {</text>
      <text x="85" y="310"></text>
      <text x="85" y="325">@GetMapping("/list")</text>
      <text x="85" y="340">public TableDataInfo list(${ClassName} ${className}) {</text>
      <text x="95" y="355">startPage();</text>
      <text x="95" y="370">List&lt;${ClassName}&gt; list = ${className}Service.selectList(${className});</text>
      <text x="95" y="385">return getDataTable(list);</text>
      <text x="85" y="400">}</text>
      <text x="75" y="415"></text>
      <text x="75" y="430">// 其他 CRUD 方法...</text>
      <text x="75" y="445">}</text>
    </g>
  </g>

  <!-- 修改后模板 -->
  <g font-size="10">
    <text x="430" y="235" font-weight="600" fill="#00A087">自定义后 controller.java.vm：</text>
    <rect x="430" y="245" width="330" height="190" rx="6" fill="#E8F5E9" stroke="#00A087" stroke-width="1"/>
    <g font-family="'Courier New',monospace" font-size="9" fill="#252A33">
      <text x="445" y="265">@RestController</text>
      <text x="445" y="280">@RequestMapping("/${businessName}")</text>
      <text x="445" y="295">public class ${ClassName}Controller {</text>
      <text x="455" y="310"></text>
      <text x="455" y="325">@GetMapping("/list")</text>
      <text x="455" y="340">public TableDataInfo list(${ClassName} ${className}) { ... }</text>
      <text x="455" y="355"></text>
      <text x="455" y="370" fill="#00A087" font-weight="600">/** 批量导入（自定义新增） */</text>
      <text x="455" y="385" fill="#00A087" font-weight="600">@PostMapping("/importData")</text>
      <text x="455" y="400" fill="#00A087" font-weight="600">public AjaxResult importData(MultipartFile file) {</text>
      <text x="465" y="415" fill="#00A087" font-weight="600">  return toAjax(${className}Service.importData(file));</text>
      <text x="455" y="430" fill="#00A087" font-weight="600">}</text>
      <text x="445" y="445">}</text>
    </g>
  </g>

  <text x="410" y="484" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜自定义模板：复制 vm 文件 → 添加业务代码 → 重新生成即可获得定制化代码</text>
</svg>