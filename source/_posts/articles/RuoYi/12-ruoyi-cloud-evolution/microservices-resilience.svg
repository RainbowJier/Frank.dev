<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><rect width="820" height="370" fill="#FFFFFF"/><rect x=".5" y=".5" width="819" height="369" fill="none" stroke="#D9DFE8"/><text x="410" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#252A33">微服务韧性与一致性边界</text><rect x="40" y="70" width="350" height="115" rx="10" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/><text x="64" y="101" font-size="18" font-weight="700" fill="#3C5488">A</text><text x="90" y="100" font-size="14" font-weight="600" fill="#252A33">Sentinel 限流</text><circle cx="78" cy="127" r="3" fill="#3C5488"/><text x="90" y="131" font-size="11" fill="#6B7280">控制并发与 QPS</text><circle cx="78" cy="148" r="3" fill="#3C5488"/><text x="90" y="152" font-size="11" fill="#6B7280">热点参数保护</text><rect x="430" y="70" width="350" height="115" rx="10" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/><text x="454" y="101" font-size="18" font-weight="700" fill="#3C5488">B</text><text x="480" y="100" font-size="14" font-weight="600" fill="#252A33">降级与熔断</text><circle cx="468" cy="127" r="3" fill="#4DBBD5"/><text x="480" y="131" font-size="11" fill="#6B7280">超时快速失败</text><circle cx="468" cy="148" r="3" fill="#4DBBD5"/><text x="480" y="152" font-size="11" fill="#6B7280">提供兜底响应</text><rect x="40" y="220" width="350" height="115" rx="10" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/><text x="64" y="251" font-size="18" font-weight="700" fill="#3C5488">C</text><text x="90" y="250" font-size="14" font-weight="600" fill="#252A33">Seata 事务</text><circle cx="78" cy="277" r="3" fill="#00A087"/><text x="90" y="281" font-size="11" fill="#6B7280">仅覆盖真实跨服务事务</text><circle cx="78" cy="298" r="3" fill="#00A087"/><text x="90" y="302" font-size="11" fill="#6B7280">避免长事务</text><rect x="430" y="220" width="350" height="115" rx="10" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/><text x="454" y="251" font-size="18" font-weight="700" fill="#3C5488">D</text><text x="480" y="250" font-size="14" font-weight="600" fill="#252A33">可观测性</text><circle cx="468" cy="277" r="3" fill="#F39B7F"/><text x="480" y="281" font-size="11" fill="#6B7280">TraceId / 指标 / 告警</text><circle cx="468" cy="298" r="3" fill="#F39B7F"/><text x="480" y="302" font-size="11" fill="#6B7280">以证据驱动优化</text><text x="410" y="350" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜超时、重试、限流、降级和事务边界必须组合设计</text></svg>