<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="420" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="419" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 中央核心：ruoyi-admin -->
  <rect x="300" y="160" width="220" height="80" rx="10" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="2"/>
  <text x="410" y="195" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">ruoyi-admin</text>
  <text x="410" y="215" text-anchor="middle" font-size="12" fill="#6B7280">Web 入口模块</text>
  <text x="410" y="230" text-anchor="middle" font-size="11" fill="#6B7280">RuoYiApplication</text>

  <!-- 被依赖模块：framework -->
  <rect x="330" y="280" width="160" height="60" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="410" y="307" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">ruoyi-framework</text>
  <text x="410" y="324" text-anchor="middle" font-size="11" fill="#6B7280">框架核心配置</text>

  <!-- 被依赖模块：common -->
  <rect x="130" y="280" width="160" height="60" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="210" y="307" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">ruoyi-common</text>
  <text x="210" y="324" text-anchor="middle" font-size="11" fill="#6B7280">通用工具模块</text>

  <!-- 被依赖模块：system -->
  <rect x="530" y="280" width="160" height="60" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="610" y="307" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">ruoyi-system</text>
  <text x="610" y="324" text-anchor="middle" font-size="11" fill="#6B7280">系统管理模块</text>

  <!-- 独立功能模块：generator -->
  <rect x="60" y="60" width="160" height="60" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="140" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">ruoyi-generator</text>
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#6B7280">代码生成器</text>

  <!-- 独立功能模块：quartz -->
  <rect x="600" y="60" width="160" height="60" rx="8" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="680" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">ruoyi-quartz</text>
  <text x="680" y="104" text-anchor="middle" font-size="11" fill="#6B7280">定时任务模块</text>

  <!-- 依赖箭头：admin → 其他模块 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="360" y1="240" x2="260" y2="275" marker-end="url(#arrow)"/>
    <line x1="410" y1="240" x2="410" y2="275" marker-end="url(#arrow)"/>
    <line x1="460" y1="240" x2="560" y2="275" marker-end="url(#arrow)"/>
    <line x1="330" y1="180" x2="200" y2="125" marker-end="url(#arrow)"/>
    <line x1="490" y1="180" x2="620" y2="125" marker-end="url(#arrow)"/>
  </g>

  <!-- framework → common + system -->
  <g stroke="#5A6472" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="360" y1="320" x2="270" y2="320" marker-end="url(#arrow)"/>
    <line x1="490" y1="320" x2="550" y2="320" marker-end="url(#arrow)"/>
  </g>

  <!-- 标注说明 -->
  <text x="280" y="260" font-size="10" fill="#E64B35">直接依赖</text>
  <text x="300" y="335" font-size="10" fill="#6B7280">间接依赖</text>

  <text x="410" y="404" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜RuoYi 六大模块依赖关系图</text>
</svg>
