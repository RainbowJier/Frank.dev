<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="440" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="439" fill="none" stroke="#D9DFE8"/>

  <!-- 中央主体：application.yml -->
  <rect x="260" y="50" width="300" height="320" rx="12" fill="#3C5488" fill-opacity="0.05" stroke="#3C5488" stroke-width="2"/>
  <text x="410" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33">application.yml</text>

  <!-- 内部子块：五种配置区域 -->
  <g stroke-width="1.5">
    <rect x="284" y="100" width="252" height="48" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="284" y="160" width="252" height="48" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
    <rect x="284" y="220" width="252" height="48" rx="6" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F"/>
    <rect x="284" y="280" width="252" height="40" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4"/>
    <rect x="284" y="332" width="252" height="26" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="410" y="129">服务配置</text>
    <text x="410" y="189">Token 配置</text>
    <text x="410" y="249">文件上传配置</text>
    <text x="410" y="305">Redis 配置</text>
    <text x="410" y="349">Druid 数据源</text>
  </g>

  <!-- 左侧引线标注 -->
  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="220" y1="124" x2="276" y2="124"/>
    <line x1="220" y1="184" x2="276" y2="184"/>
    <line x1="220" y1="244" x2="276" y2="244"/>
  </g>
  <circle cx="280" cy="124" r="2.5" fill="#9AA4B2"/>
  <circle cx="280" cy="184" r="2.5" fill="#9AA4B2"/>
  <circle cx="280" cy="244" r="2.5" fill="#9AA4B2"/>
  <g font-size="11" fill="#6B7280" text-anchor="end">
    <text x="214" y="118">server.port: 8080</text>
    <text x="214" y="132">spring.application.name</text>
    <text x="214" y="178">token.header: Authorization</text>
    <text x="214" y="192">token.expireTime: 30</text>
    <text x="214" y="238">ruoyi.profile:</text>
    <text x="214" y="252">文件存储路径</text>
  </g>

  <!-- 右侧引线标注 -->
  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="544" y1="300" x2="600" y2="300"/>
    <line x1="544" y1="345" x2="600" y2="345"/>
  </g>
  <circle cx="540" cy="300" r="2.5" fill="#9AA4B2"/>
  <circle cx="540" cy="345" r="2.5" fill="#9AA4B2"/>
  <g font-size="11" fill="#6B7280">
    <text x="606" y="294">redis.host: localhost</text>
    <text x="606" y="308">redis.port: 6379</text>
    <text x="606" y="339">druid.master.url</text>
    <text x="606" y="353">数据库连接信息</text>
  </g>

  <!-- 外部关联文件 -->
  <rect x="40" y="380" width="160" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="120" y="403" text-anchor="middle" font-size="12" fill="#252A33">logback.xml</text>
  
  <rect x="220" y="380" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="310" y="403" text-anchor="middle" font-size="12" fill="#252A33">mybatis-config.xml</text>
  
  <rect x="420" y="380" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="510" y="403" text-anchor="middle" font-size="12" fill="#252A33">application-druid.yml</text>
  
  <rect x="620" y="380" width="160" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="700" y="403" text-anchor="middle" font-size="12" fill="#252A33">i18n/*.properties</text>

  <text x="410" y="428" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜RuoYi 配置文件体系结构</text>
</svg>
