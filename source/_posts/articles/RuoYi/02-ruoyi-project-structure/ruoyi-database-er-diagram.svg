<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="480" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="479" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 核心表：用户表 -->
  <rect x="80" y="60" width="140" height="100" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="150" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">sys_user</text>
  <text x="150" y="102" text-anchor="middle" font-size="11" fill="#6B7280">用户表</text>
  <g font-size="10" fill="#252A33">
    <text x="95" y="122">user_id (PK)</text>
    <text x="95" y="136">user_name</text>
    <text x="95" y="150">dept_id (FK)</text>
  </g>

  <!-- 核心表：角色表 -->
  <rect x="340" y="60" width="140" height="100" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">sys_role</text>
  <text x="410" y="102" text-anchor="middle" font-size="11" fill="#6B7280">角色表</text>
  <g font-size="10" fill="#252A33">
    <text x="355" y="122">role_id (PK)</text>
    <text x="355" y="136">role_name</text>
    <text x="355" y="150">data_scope</text>
  </g>

  <!-- 核心表：菜单表 -->
  <rect x="600" y="60" width="140" height="100" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="670" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">sys_menu</text>
  <text x="670" y="102" text-anchor="middle" font-size="11" fill="#6B7280">菜单权限表</text>
  <g font-size="10" fill="#252A33">
    <text x="615" y="122">menu_id (PK)</text>
    <text x="615" y="136">menu_name</text>
    <text x="615" y="150">perms</text>
  </g>

  <!-- 关联表：用户角色 -->
  <rect x="160" y="220" width="140" height="70" rx="8" fill="#F4F7FA" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="230" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">sys_user_role</text>
  <text x="230" y="260" text-anchor="middle" font-size="11" fill="#6B7280">用户角色关联</text>
  <g font-size="10" fill="#252A33">
    <text x="175" y="278">user_id (FK)</text>
    <text x="175" y="288">role_id (FK)</text>
  </g>

  <!-- 关联表：角色菜单 -->
  <rect x="420" y="220" width="140" height="70" rx="8" fill="#F4F7FA" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="490" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">sys_role_menu</text>
  <text x="490" y="260" text-anchor="middle" font-size="11" fill="#6B7280">角色菜单关联</text>
  <g font-size="10" fill="#252A33">
    <text x="435" y="278">role_id (FK)</text>
    <text x="435" y="288">menu_id (FK)</text>
  </g>

  <!-- 部门表 -->
  <rect x="80" y="330" width="140" height="100" rx="8" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="150" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">sys_dept</text>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#6B7280">部门表（树形）</text>
  <g font-size="10" fill="#252A33">
    <text x="95" y="392">dept_id (PK)</text>
    <text x="95" y="406">parent_id</text>
    <text x="95" y="420">ancestors</text>
  </g>

  <!-- 关联表：角色部门 -->
  <rect x="280" y="350" width="140" height="70" rx="8" fill="#F4F7FA" stroke="#D9DFE8" stroke-width="1.5"/>
  <text x="350" y="375" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">sys_role_dept</text>
  <text x="350" y="390" text-anchor="middle" font-size="11" fill="#6B7280">角色部门关联</text>
  <g font-size="10" fill="#252A33">
    <text x="295" y="408">role_id (FK)</text>
    <text x="295" y="418">dept_id (FK)</text>
  </g>

  <!-- 岗位表 -->
  <rect x="480" y="350" width="140" height="70" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="550" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">sys_post</text>
  <text x="550" y="390" text-anchor="middle" font-size="11" fill="#6B7280">岗位表</text>
  <g font-size="10" fill="#252A33">
    <text x="495" y="408">post_id (PK)</text>
    <text x="495" y="418">post_name</text>
  </g>

  <!-- 关联箭头 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <!-- user → user_role -->
    <line x1="150" y1="160" x2="200" y2="215" marker-end="url(#arrow)"/>
    <!-- role → user_role -->
    <line x1="380" y1="160" x2="260" y2="215" marker-end="url(#arrow)"/>
    <!-- role → role_menu -->
    <line x1="430" y1="160" x2="470" y2="215" marker-end="url(#arrow)"/>
    <!-- menu → role_menu -->
    <line x1="640" y1="160" x2="520" y2="215" marker-end="url(#arrow)"/>
    <!-- dept → user -->
    <line x1="150" y1="330" x2="150" y2="165" marker-end="url(#arrow)"/>
    <!-- dept → role_dept -->
    <line x1="220" y1="380" x2="275" y2="380" marker-end="url(#arrow)"/>
    <!-- role → role_dept -->
    <line x1="380" y1="160" x2="360" y2="345" marker-end="url(#arrow)"/>
  </g>

  <!-- 关系标注 -->
  <g font-size="9" fill="#6B7280">
    <text x="165" y="195">N</text>
    <text x="270" y="195">N</text>
    <text x="445" y="195">N</text>
    <text x="565" y="195">N</text>
    <text x="232" y="387">N</text>
    <text x="365" y="280">1</text>
  </g>

  <text x="410" y="464" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜RuoYi 核心表 ER 关系图（RBAC 权限模型）</text>
</svg>
