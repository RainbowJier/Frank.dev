<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="380" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="379" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 流程节点 -->
  <g fill-opacity="0.12" stroke-width="1.5">
    <rect x="40" y="60" width="110" height="60" rx="8" fill="#3C5488" stroke="#3C5488"/>
    <rect x="190" y="60" width="110" height="60" rx="8" fill="#4DBBD5" stroke="#4DBBD5"/>
    <rect x="340" y="60" width="110" height="60" rx="8" fill="#4DBBD5" stroke="#4DBBD5"/>
    <rect x="490" y="60" width="110" height="60" rx="8" fill="#F39B7F" stroke="#F39B7F"/>
    <rect x="640" y="60" width="110" height="60" rx="8" fill="#00A087" stroke="#00A087"/>
  </g>

  <!-- 节点文字 -->
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="95" y="85">前端请求</text>
    <text x="95" y="102">携带 Token</text>
    <text x="245" y="85">JwtFilter</text>
    <text x="245" y="102">拦截器</text>
    <text x="395" y="85">解析 Token</text>
    <text x="395" y="102">获取 uuid</text>
    <text x="545" y="85">Redis 加载</text>
    <text x="545" y="102">LoginUser</text>
    <text x="695" y="85">放行请求</text>
    <text x="695" y="102">业务处理</text>
  </g>

  <!-- 流程箭头 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="155" y1="90" x2="185" y2="90" marker-end="url(#arrow)"/>
    <line x1="305" y1="90" x2="335" y2="90" marker-end="url(#arrow)"/>
    <line x1="455" y1="90" x2="485" y2="90" marker-end="url(#arrow)"/>
    <line x1="605" y1="90" x2="635" y2="90" marker-end="url(#arrow)"/>
  </g>

  <!-- Header 示例 -->
  <rect x="40" y="155" width="240" height="50" rx="6" fill="#F4F7FA" stroke="#D9DFE8" stroke-width="1"/>
  <text x="50" y="178" font-size="11" font-weight="500" fill="#252A33">Authorization Header:</text>
  <text x="50" y="195" font-size="11" fill="#6B7280" font-family="'Courier New',monospace">Bearer eyJhbGciOiJIUzI1Ni...</text>

  <!-- Redis 数据结构 -->
  <rect x="340" y="155" width="260" height="90" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="470" y="178" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Redis 缓存数据</text>
  <g font-size="11" fill="#6B7280">
    <text x="355" y="198">key: login_tokens:a1b2c3d4</text>
    <text x="355" y="214">value: LoginUser {</text>
    <text x="375" y="228">userId: 1, userName: "admin",</text>
    <text x="375" y="242">permissions: ["system:user:add", ...]</text>
  </g>

  <!-- SecurityContextHolder -->
  <rect x="640" y="155" width="140" height="70" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="710" y="178" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">SecurityContext</text>
  <text x="710" y="198" text-anchor="middle" font-size="11" fill="#6B7280">存储用户信息</text>
  <text x="710" y="213" text-anchor="middle" font-size="11" fill="#6B7280">供业务层使用</text>

  <!-- 连接线 -->
  <line x1="160" y1="125" x2="160" y2="150" stroke="#9AA4B2" stroke-width="1"/>
  <circle cx="160" cy="155" r="2.5" fill="#9AA4B2"/>
  
  <line x1="470" y1="125" x2="470" y2="150" stroke="#9AA4B2" stroke-width="1"/>
  <circle cx="470" cy="155" r="2.5" fill="#9AA4B2"/>
  
  <line x1="545" y1="125" x2="710" y2="150" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="142" font-size="10" fill="#6B7280">存入上下文</text>

  <!-- Controller 使用示例 -->
  <rect x="40" y="270" width="740" height="60" rx="8" fill="#8491B4" fill-opacity="0.08" stroke="#8491B4" stroke-width="1.5"/>
  <text x="60" y="293" font-size="12" font-weight="500" fill="#252A33">Controller 获取当前用户：</text>
  <text x="60" y="312" font-size="11" fill="#6B7280" font-family="'Courier New',monospace">Long userId = SecurityUtils.getUserId();  // 从 SecurityContextHolder 获取</text>

  <text x="410" y="364" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜JWT Token 验证与用户信息加载流程</text>
</svg>
