<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 485" width="820" height="485"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="485" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="484" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4DBBD5"/>
    </marker>
  </defs>

  <!-- ===== 面板 A：fanout ===== -->
  <rect x="40" y="40" width="360" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">fanout 广播</text>
  <text x="64" y="94" font-size="12" fill="#6B7280">忽略 routing key，绑定的队列各得一份</text>

  <text x="115" y="130" text-anchor="middle" font-size="11" fill="#6B7280">忽略 routing key</text>
  <rect x="75" y="140" width="80" height="42" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="115" y="165" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">交换机</text>

  <g fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5">
    <rect x="262" y="108" width="104" height="26" rx="5"/>
    <rect x="262" y="146" width="104" height="26" rx="5"/>
    <rect x="262" y="184" width="104" height="26" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#252A33">
    <text x="314" y="125">队列 A</text>
    <text x="314" y="163">队列 B</text>
    <text x="314" y="201">队列 C</text>
  </g>
  <g stroke="#4DBBD5" stroke-width="1.5">
    <line x1="155" y1="161" x2="258" y2="121" marker-end="url(#arrowTeal)"/>
    <line x1="155" y1="161" x2="258" y2="159" marker-end="url(#arrowTeal)"/>
    <line x1="155" y1="161" x2="258" y2="197" marker-end="url(#arrowTeal)"/>
  </g>

  <!-- ===== 面板 B：direct ===== -->
  <rect x="420" y="40" width="360" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="466" y="71" font-size="14" font-weight="600" fill="#252A33">direct 精确匹配</text>
  <text x="444" y="94" font-size="12" fill="#6B7280">binding key 与 routing key 完全相等才投递</text>

  <text x="495" y="130" text-anchor="middle" font-size="11" fill="#6B7280">rk: order.paid</text>
  <rect x="455" y="140" width="80" height="42" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="495" y="165" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">交换机</text>

  <rect x="642" y="112" width="104" height="30" rx="5" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="694" y="131" text-anchor="middle" font-size="11" fill="#252A33">order.paid</text>
  <rect x="642" y="180" width="104" height="30" rx="5" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1.5"/>
  <text x="694" y="199" text-anchor="middle" font-size="11" fill="#6B7280">order.refund</text>

  <line x1="535" y1="161" x2="638" y2="129" stroke="#4DBBD5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="535" y1="161" x2="638" y2="193" stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ===== 面板 C：topic ===== -->
  <rect x="40" y="250" width="360" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="282" font-size="18" font-weight="700" fill="#3C5488">C</text>
  <text x="86" y="281" font-size="14" font-weight="600" fill="#252A33">topic 通配匹配</text>
  <text x="64" y="304" font-size="12" fill="#6B7280">* 恰好匹配一个词，# 匹配零个或多个词</text>

  <text x="115" y="340" text-anchor="middle" font-size="11" fill="#6B7280">rk: order.paid.gz</text>
  <rect x="75" y="350" width="80" height="42" rx="6" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="115" y="375" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">交换机</text>

  <rect x="262" y="314" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1.5"/>
  <text x="314" y="331" text-anchor="middle" font-size="11" fill="#6B7280">order.*</text>
  <rect x="262" y="353" width="104" height="26" rx="5" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="314" y="370" text-anchor="middle" font-size="11" fill="#252A33">order.#</text>
  <rect x="262" y="392" width="104" height="26" rx="5" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="314" y="409" text-anchor="middle" font-size="11" fill="#252A33">#.gz</text>

  <line x1="155" y1="371" x2="258" y2="327" stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="155" y1="371" x2="258" y2="366" stroke="#4DBBD5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="155" y1="371" x2="258" y2="405" stroke="#4DBBD5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- ===== 面板 D：headers（弱化） ===== -->
  <rect x="420" y="250" width="360" height="190" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="282" font-size="18" font-weight="700" fill="#8491B4">D</text>
  <text x="466" y="281" font-size="14" font-weight="600" fill="#6B7280">headers 头匹配</text>
  <text x="444" y="304" font-size="12" fill="#6B7280">按消息 header 属性匹配，性能差，实际少用</text>

  <text x="495" y="340" text-anchor="middle" font-size="11" fill="#6B7280">header: format=pdf</text>
  <rect x="455" y="350" width="80" height="42" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="495" y="375" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">交换机</text>

  <rect x="642" y="330" width="104" height="30" rx="5" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="694" y="349" text-anchor="middle" font-size="11" fill="#252A33">format=pdf</text>
  <rect x="642" y="392" width="104" height="30" rx="5" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1.5"/>
  <text x="694" y="411" text-anchor="middle" font-size="11" fill="#6B7280">format=xml</text>

  <line x1="535" y1="371" x2="638" y2="347" stroke="#8491B4" stroke-width="1.5"/>
  <line x1="535" y1="371" x2="638" y2="405" stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="410" y="470" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜四种交换机类型的路由行为（实线＝投递成功，虚线＝不匹配，rk＝routing key）</text>
</svg>
