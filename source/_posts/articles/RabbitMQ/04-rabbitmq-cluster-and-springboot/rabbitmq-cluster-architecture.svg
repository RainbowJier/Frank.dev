<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 405" width="820" height="405"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="405" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="404" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- ===== 面板 A：普通集群 ===== -->
  <rect x="40" y="40" width="360" height="320" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="64" y="72" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="86" y="71" font-size="14" font-weight="600" fill="#252A33">普通集群（镜像队列已弃用）</text>
  <text x="64" y="92" font-size="12" fill="#6B7280">只在节点间同步元数据，消息不复制</text>

  <rect x="74" y="102" width="84" height="24" rx="12" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="116" y="118" text-anchor="middle" font-size="11" fill="#6B7280">生产者</text>
  <line x1="116" y1="126" x2="116" y2="134" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- 节点 1：队列所在节点 -->
  <rect x="64" y="138" width="96" height="110" rx="8" fill="#F4F7FA" stroke="#3C5488" stroke-width="1.5"/>
  <text x="112" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">节点 1</text>
  <rect x="82" y="170" width="60" height="28" rx="4" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="112" y="189" text-anchor="middle" font-size="11" fill="#252A33">订单队列</text>
  <text x="112" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#3C5488">队列所在节点</text>

  <!-- 节点 2/3：仅元数据 -->
  <rect x="172" y="138" width="96" height="110" rx="8" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="220" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">节点 2</text>
  <rect x="190" y="170" width="60" height="28" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
  <text x="220" y="189" text-anchor="middle" font-size="11" fill="#6B7280">元数据</text>
  <text x="220" y="224" text-anchor="middle" font-size="11" fill="#6B7280">消息不在此</text>

  <rect x="280" y="138" width="96" height="110" rx="8" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="328" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">节点 3</text>
  <rect x="298" y="170" width="60" height="28" rx="4" fill="#FFFFFF" stroke="#9AA4B2" stroke-width="1"/>
  <text x="328" y="189" text-anchor="middle" font-size="11" fill="#6B7280">元数据</text>
  <text x="328" y="224" text-anchor="middle" font-size="11" fill="#6B7280">消息不在此</text>

  <line x1="64" y1="262" x2="160" y2="262" stroke="#E64B35" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="112" y="280" text-anchor="middle" font-size="11" fill="#6B7280">单点依赖</text>

  <circle cx="70" cy="316" r="3" fill="#E64B35"/>
  <text x="82" y="320" font-size="12" font-weight="500" fill="#252A33">节点 1 宕机 → 队列与消息全部不可用</text>
  <text x="64" y="340" font-size="11" fill="#6B7280">高可用等于没有</text>

  <!-- ===== 面板 B：仲裁队列 ===== -->
  <rect x="420" y="40" width="360" height="320" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="444" y="72" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="466" y="71" font-size="14" font-weight="600" fill="#252A33">仲裁队列 Quorum Queue</text>
  <text x="444" y="92" font-size="12" fill="#6B7280">Raft 多数派复制，过半确认才算写入成功</text>

  <rect x="450" y="102" width="84" height="24" rx="12" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="492" y="118" text-anchor="middle" font-size="11" fill="#6B7280">生产者</text>
  <line x1="492" y1="126" x2="492" y2="134" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="444" y="138" width="96" height="110" rx="8" fill="#F4F7FA" stroke="#3C5488" stroke-width="2"/>
  <text x="492" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">节点 1</text>
  <rect x="462" y="170" width="60" height="28" rx="4" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="492" y="189" text-anchor="middle" font-size="11" fill="#252A33">队列副本</text>
  <text x="492" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#3C5488">Leader</text>

  <rect x="552" y="138" width="96" height="110" rx="8" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="600" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">节点 2</text>
  <rect x="570" y="170" width="60" height="28" rx="4" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="600" y="189" text-anchor="middle" font-size="11" fill="#252A33">队列副本</text>
  <text x="600" y="224" text-anchor="middle" font-size="11" fill="#6B7280">Follower</text>

  <rect x="660" y="138" width="96" height="110" rx="8" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="708" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">节点 3</text>
  <rect x="678" y="170" width="60" height="28" rx="4" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="708" y="189" text-anchor="middle" font-size="11" fill="#252A33">队列副本</text>
  <text x="708" y="224" text-anchor="middle" font-size="11" fill="#6B7280">Follower</text>

  <line x1="444" y1="262" x2="648" y2="262" stroke="#00A087" stroke-width="2"/>
  <text x="546" y="280" text-anchor="middle" font-size="11" fill="#6B7280">2/3 节点确认 = 写入成功</text>

  <circle cx="450" cy="316" r="3" fill="#00A087"/>
  <text x="462" y="320" font-size="12" font-weight="500" fill="#252A33">容忍少数派故障：3 节点容忍 1 台宕机</text>
  <text x="444" y="340" font-size="11" fill="#6B7280">消息天然持久化到多数节点</text>

  <text x="410" y="386" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜普通集群与仲裁队列的高可用对比（RabbitMQ 3.9+ 推荐仲裁队列）</text>
</svg>
