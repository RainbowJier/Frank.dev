<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>

  <!-- 有序 values 条 -->
  <rect x="60" y="56" width="700" height="64" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <text x="410" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">CacheKey = 有序值序列（顺序即语义）</text>
  <g font-family="Consolas,monospace" font-size="12" fill="#252A33" text-anchor="middle">
    <rect x="80"  y="96" width="96"  height="18" rx="3" fill="#FFFFFF" stroke="#3C5488"/><text x="128"  y="110">statement id</text>
    <rect x="184" y="96" width="62"  height="18" rx="3" fill="#FFFFFF" stroke="#3C5488"/><text x="215"  y="110">offset</text>
    <rect x="254" y="96" width="58"  height="18" rx="3" fill="#FFFFFF" stroke="#3C5488"/><text x="283"  y="110">limit</text>
    <rect x="320" y="96" width="150" height="18" rx="3" fill="#FFFFFF" stroke="#3C5488"/><text x="395"  y="110">最终 SQL（动态）</text>
    <rect x="478" y="96" width="150" height="18" rx="3" fill="#FFFFFF" stroke="#3C5488"/><text x="553"  y="110">参数值（按问号序）</text>
    <rect x="636" y="96" width="106" height="18" rx="3" fill="#FFFFFF" stroke="#3C5488"/><text x="689"  y="110">environment</text>
  </g>

  <!-- 差异示例 -->
  <g font-family="Consolas,monospace" font-size="12">
    <rect x="80" y="160" width="340" height="34" rx="6" fill="#00A087" fill-opacity="0.10" stroke="#00A087" stroke-width="1.5"/>
    <text x="96" y="182" fill="#252A33">["User.find", 0, 10, "select ?", 1, "test"]</text>
    <rect x="80" y="206" width="340" height="34" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
    <text x="96" y="228" fill="#252A33">["User.find", 0, 10, "select ?", 2, "test"]</text>
  </g>
  <text x="440" y="182" font-size="13" fill="#252A33">参数 1</text>
  <text x="440" y="228" font-size="13" fill="#252A33">参数 2 → 不相等</text>
  <line x1="430" y1="176" x2="446" y2="176" stroke="#5A6472" stroke-width="1.5"/>

  <!-- 数组快照 -->
  <rect x="80" y="256" width="680" height="36" rx="6" fill="#F4F7FA" stroke="#D9DFE8"/>
  <text x="96" y="279" font-size="12" fill="#6B7280">数组按内容归一化（逐元素快照），不按引用比较；[3,1] 与 [1,3] 是不同 key</text>

  <text x="410" y="318" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜CacheKey 把"什么算同一次查询"定义为有序身份，任一要素不同即不命中</text>
</svg>
