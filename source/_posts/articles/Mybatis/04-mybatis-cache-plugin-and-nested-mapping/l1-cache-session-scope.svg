<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="340" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="339" fill="none" stroke="#D9DFE8"/>

  <!-- Session A 泳道 -->
  <rect x="40" y="40" width="360" height="150" rx="10" fill="#3C5488" fill-opacity="0.05" stroke="#3C5488" stroke-width="1.5"/>
  <text x="60" y="68" font-size="14" font-weight="600" fill="#3C5488">SqlSession A</text>
  <rect x="60" y="84" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="135" y="104" text-anchor="middle" font-size="12" fill="#252A33">findById(1) ①</text>
  <text x="135" y="120" text-anchor="middle" font-size="11" fill="#6B7280">JDBC 执行</text>
  <rect x="230" y="84" width="150" height="44" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="305" y="104" text-anchor="middle" font-size="12" fill="#252A33">localCache 命中</text>
  <text x="305" y="120" text-anchor="middle" font-size="11" fill="#6B7280">② 不再下探</text>
  <line x1="214" y1="106" x2="224" y2="106" stroke="#5A6472" stroke-width="1.5"/>
  <text x="220" y="156" font-size="12" fill="#6B7280" text-anchor="middle">update 后 localCache.clear()，同 session 也不吃旧值</text>

  <!-- Session B 泳道 -->
  <rect x="420" y="40" width="360" height="150" rx="10" fill="#4DBBD5" fill-opacity="0.05" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="440" y="68" font-size="14" font-weight="600" fill="#3C5488">SqlSession B（同参数）</text>
  <rect x="440" y="84" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="515" y="104" text-anchor="middle" font-size="12" fill="#252A33">findById(1)</text>
  <text x="515" y="120" text-anchor="middle" font-size="11" fill="#6B7280">B 的 localCache 为空</text>
  <rect x="610" y="84" width="150" height="44" rx="6" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35" stroke-width="1.5"/>
  <text x="685" y="104" text-anchor="middle" font-size="12" fill="#252A33">必须走 JDBC</text>
  <text x="685" y="120" text-anchor="middle" font-size="11" fill="#6B7280">一级缓存不跨 session</text>
  <line x1="594" y1="106" x2="604" y2="106" stroke="#5A6472" stroke-width="1.5"/>
  <text x="600" y="156" font-size="12" fill="#6B7280" text-anchor="middle">commit/close 时清理：会话结束状态即消失</text>

  <!-- 中间隔离标记 -->
  <line x1="410" y1="48" x2="410" y2="182" stroke="#D9DFE8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="410" y="216" text-anchor="middle" font-size="12" fill="#6B7280">两个事务边界之间互相隔离——这是"session 私有"的含义</text>

  <text x="410" y="252" text-anchor="middle" font-size="12" fill="#6B7280">为什么不做全局静态缓存：跨 session 共享读旧对象 = 事务可见性被破坏</text>

  <text x="410" y="322" text-anchor="middle" font-size="12" fill="#6B7280">图 4｜一级缓存只属于一个 SqlSession，更新与会话结束都清理</text>
</svg>
