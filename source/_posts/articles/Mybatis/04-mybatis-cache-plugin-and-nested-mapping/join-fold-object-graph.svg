<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="380" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="379" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：JOIN 行 -->
  <rect x="40" y="36" width="360" height="286" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="60" y="66" font-size="17" font-weight="700" fill="#3C5488">A</text>
  <text x="82" y="65" font-size="14" font-weight="600" fill="#252A33">LEFT JOIN 的三行结果</text>
  <g font-family="Consolas,monospace" font-size="11.5" fill="#252A33">
    <rect x="60" y="84" width="320" height="56" rx="6" fill="#3C5488" fill-opacity="0.10" stroke="#3C5488" stroke-width="1.5"/>
    <text x="74" y="107">order 10 · item 100 · JAVA-17</text>
    <text x="74" y="127">order 10 · item 101 · H2</text>
    <rect x="60" y="152" width="320" height="34" rx="6" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
    <text x="74" y="174">order 11 · item null · null（无明细）</text>
    <rect x="60" y="198" width="320" height="34" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
    <text x="74" y="220">user 2 · age = SQL NULL</text>
  </g>
  <text x="220" y="266" text-anchor="middle" font-size="12" fill="#6B7280">父行重复、子 id 全 null、SQL NULL——</text>
  <text x="220" y="284" text-anchor="middle" font-size="12" fill="#6B7280">逐行映射会造出 2 个订单 10 和一个空明细</text>

  <!-- 折叠箭头 -->
  <line x1="408" y1="170" x2="444" y2="170" stroke="#5A6472" stroke-width="2" marker-end="url(#d6)"/>
  <text x="426" y="152" text-anchor="middle" font-size="11" fill="#6B7280">折叠</text>

  <!-- 面板 B：对象图 -->
  <rect x="452" y="36" width="328" height="286" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="472" y="66" font-size="17" font-weight="700" fill="#3C5488">B</text>
  <text x="494" y="65" font-size="14" font-weight="600" fill="#252A33">折叠后的对象图</text>
  <rect x="476" y="84" width="280" height="70" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="616" y="108" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Order(id=10)</text>
  <text x="616" y="128" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">items = [item 100, item 101]</text>
  <text x="616" y="146" text-anchor="middle" font-size="11" fill="#6B7280">父 key 去重：一个订单对象</text>
  <rect x="476" y="168" width="280" height="56" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="616" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Order(id=11)</text>
  <text x="616" y="210" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">items = []（不是 [null]）</text>
  <rect x="476" y="238" width="280" height="44" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
  <text x="616" y="258" text-anchor="middle" font-size="12" fill="#252A33">hasIdentity：子 id 全 null → 跳过创建</text>
  <text x="616" y="274" text-anchor="middle" font-size="11" fill="#6B7280">SQL NULL 落包装类型仍是 null</text>

  <text x="410" y="360" text-anchor="middle" font-size="12" fill="#6B7280">图 6｜嵌套映射：parents 去重父、seenChildren 去重子、hasIdentity 过滤空子项</text>
</svg>
