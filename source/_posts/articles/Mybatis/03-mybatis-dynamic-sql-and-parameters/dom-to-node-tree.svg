<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="350" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="349" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 左：DOM 文本 -->
  <rect x="40" y="56" width="330" height="180" rx="8" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
  <text x="205" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">getTextContent() 拍平后</text>
  <text x="205" y="112" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">"select … &lt;if&gt; AND name=#{name}&lt;/if&gt;"</text>
  <text x="205" y="140" text-anchor="middle" font-size="12" fill="#6B7280">标签与条件全部变成纯文本，</text>
  <text x="205" y="158" text-anchor="middle" font-size="12" fill="#6B7280">动态语义丢失</text>
  <text x="205" y="196" text-anchor="middle" font-size="12" fill="#6B7280">若把 &lt;if&gt; 当普通文字拼进 SQL，</text>
  <text x="205" y="214" text-anchor="middle" font-size="12" fill="#6B7280">数据库只会报语法错误</text>

  <!-- 右：SqlNode 树 -->
  <rect x="450" y="40" width="330" height="264" rx="8" fill="#3C5488" fill-opacity="0.06" stroke="#3C5488" stroke-width="2"/>
  <text x="615" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">编译后的 SqlNode 树（注册期定型）</text>
  <rect x="475" y="84" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="535" y="107" text-anchor="middle" font-size="12" fill="#252A33">TextSqlNode</text>
  <rect x="620" y="84" width="136" height="36" rx="6" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="688" y="107" text-anchor="middle" font-size="12" fill="#252A33">WhereSqlNode</text>
  <rect x="475" y="146" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="535" y="169" text-anchor="middle" font-size="12" fill="#252A33">IfSqlNode</text>
  <rect x="620" y="146" width="136" height="36" rx="6" fill="#FFFFFF" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="688" y="169" text-anchor="middle" font-size="12" fill="#252A33">ForEachSqlNode</text>
  <line x1="688" y1="124" x2="688" y2="142" stroke="#5A6472" stroke-width="1.5"/>
  <line x1="535" y1="124" x2="535" y2="142" stroke="#5A6472" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="615" y="216" text-anchor="middle" font-size="12" fill="#6B7280">静态：启动时渲染一次冻结</text>
  <text x="615" y="238" text-anchor="middle" font-size="12" fill="#6B7280">动态：每次调用重新求值</text>
  <text x="615" y="272" text-anchor="middle" font-size="12" fill="#6B7280">未知标签/未知属性 → 启动即失败</text>

  <line x1="376" y1="146" x2="444" y2="146" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c7)"/>
  <text x="410" y="136" text-anchor="middle" font-size="11" fill="#6B7280">XMLScriptBuilder</text>

  <text x="410" y="334" text-anchor="middle" font-size="12" fill="#6B7280">图 7｜DOM 标签必须编译成节点树：结构启动期定型，求值调用期进行</text>
</svg>
