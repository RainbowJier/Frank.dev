<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="c8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 方法实参 -->
  <rect x="36" y="118" width="170" height="76" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="121" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">方法实参</text>
  <text x="121" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">findBy(q, ids, sort)</text>

  <line x1="210" y1="156" x2="252" y2="156" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c8)"/>

  <!-- ParamNameResolver -->
  <rect x="258" y="104" width="210" height="104" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="363" y="134" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">ParamNameResolver</text>
  <text x="363" y="158" text-anchor="middle" font-size="12" fill="#6B7280">单参无注解 → 原样透传</text>
  <text x="363" y="178" text-anchor="middle" font-size="12" fill="#6B7280">多参 → LinkedHashMap</text>
  <text x="363" y="198" text-anchor="middle" font-size="12" fill="#6B7280">值可为 null</text>

  <line x1="472" y1="156" x2="514" y2="156" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c8)"/>

  <!-- 根对象四种形态 -->
  <rect x="520" y="40" width="264" height="236" rx="8" fill="#00A087" fill-opacity="0.06" stroke="#00A087" stroke-width="2"/>
  <text x="652" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33">参数根对象</text>
  <rect x="544" y="84" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="652" y="107" text-anchor="middle" font-size="12" fill="#252A33">Bean / record：getter 读取</text>
  <rect x="544" y="128" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="652" y="151" text-anchor="middle" font-size="12" fill="#252A33">Map：缺 key ≠ 值为 null</text>
  <rect x="544" y="172" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="652" y="195" text-anchor="middle" font-size="12" fill="#252A33">集合/数组：collection / array 别名</text>
  <rect x="544" y="216" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="652" y="239" text-anchor="middle" font-size="12" fill="#252A33">标量：#{_parameter}</text>

  <text x="205" y="250" text-anchor="middle" font-size="12" fill="#6B7280">旧执行链只认 Map + 正则，</text>
  <text x="205" y="268" text-anchor="middle" font-size="12" fill="#6B7280">接不住这四种形态</text>

  <text x="410" y="312" text-anchor="middle" font-size="12" fill="#6B7280">图 9｜实参先收敛为参数根对象，DynamicContext 只认根对象不认方法</text>
</svg>
