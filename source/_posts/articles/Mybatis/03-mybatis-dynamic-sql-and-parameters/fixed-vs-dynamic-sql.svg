<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>

  <!-- 面板 A：调用一 -->
  <rect x="40" y="36" width="360" height="244" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="60" y="66" font-size="17" font-weight="700" fill="#3C5488">A</text>
  <text x="82" y="65" font-size="14" font-weight="600" fill="#252A33">调用一：name = null</text>
  <rect x="60" y="84" width="320" height="40" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
  <text x="220" y="109" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">name=null, ids=[1, 3]</text>
  <rect x="60" y="140" width="320" height="56" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="220" y="163" text-anchor="middle" font-size="12" fill="#252A33" font-family="Consolas,monospace">… WHERE id in (?, ?)</text>
  <text x="220" y="184" text-anchor="middle" font-size="12" fill="#6B7280">参数顺序 = [1, 3]</text>
  <text x="220" y="226" text-anchor="middle" font-size="12" fill="#6B7280">name 条件整体消失，</text>
  <text x="220" y="244" text-anchor="middle" font-size="12" fill="#6B7280">问号数量随之改变</text>

  <!-- 面板 B：调用二 -->
  <rect x="420" y="36" width="360" height="244" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="440" y="66" font-size="17" font-weight="700" fill="#3C5488">B</text>
  <text x="462" y="65" font-size="14" font-weight="600" fill="#252A33">调用二：name = "Frank"</text>
  <rect x="440" y="84" width="320" height="40" rx="6" fill="#8491B4" fill-opacity="0.10" stroke="#8491B4" stroke-width="1.5"/>
  <text x="600" y="109" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">name="Frank", ids=[1, 3]</text>
  <rect x="440" y="140" width="320" height="56" rx="6" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35" stroke-width="1.5"/>
  <text x="600" y="163" text-anchor="middle" font-size="12" fill="#252A33" font-family="Consolas,monospace">… WHERE name = ? AND id in (?, ?)</text>
  <text x="600" y="184" text-anchor="middle" font-size="12" fill="#6B7280">参数顺序 = ["Frank", 1, 3]</text>
  <text x="600" y="226" text-anchor="middle" font-size="12" fill="#6B7280">同一 statement、两个形状：</text>
  <text x="600" y="244" text-anchor="middle" font-size="12" fill="#6B7280">固定 PreparedSql 存不下这份结果</text>

  <text x="410" y="312" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜动态 SQL：SQL 结构与参数顺序随每次调用同步变化</text>
</svg>
