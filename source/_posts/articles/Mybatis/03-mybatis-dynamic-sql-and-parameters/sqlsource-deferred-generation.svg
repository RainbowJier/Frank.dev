<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 注册期 -->
  <rect x="36" y="44" width="748" height="104" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <rect x="60" y="66" width="10" height="10" fill="#3C5488"/>
  <text x="78" y="76" font-size="14" font-weight="600" fill="#3C5488">注册期：只存策略，不存文本</text>
  <rect x="200" y="92" width="250" height="40" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="325" y="117" text-anchor="middle" font-size="13" fill="#252A33">MappedStatement</text>
  <rect x="490" y="92" width="270" height="40" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="625" y="117" text-anchor="middle" font-size="13" fill="#252A33">SqlSource（如何生成 SQL）</text>
  <line x1="454" y1="112" x2="484" y2="112" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c2)"/>

  <!-- 调用期 -->
  <rect x="36" y="180" width="748" height="104" rx="10" fill="#F4F7FA" stroke="#D9DFE8"/>
  <rect x="60" y="202" width="10" height="10" fill="#00A087"/>
  <text x="78" y="212" font-size="14" font-weight="600" fill="#3C5488">调用期：按本次实参生成</text>
  <rect x="200" y="228" width="250" height="40" rx="6" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="325" y="253" text-anchor="middle" font-size="13" fill="#252A33">getBoundSql(参数根对象)</text>
  <rect x="490" y="228" width="270" height="40" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="625" y="246" text-anchor="middle" font-size="12" fill="#252A33" font-family="Consolas,monospace">BoundSql: "… id in (?,?)"</text>
  <text x="625" y="262" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Consolas,monospace">mappings = [__frch_id_0, __frch_id_1]</text>
  <line x1="454" y1="248" x2="484" y2="248" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c2)"/>

  <!-- 跨层箭头 -->
  <line x1="625" y1="136" x2="625" y2="224" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c2)"/>
  <text x="640" y="180" font-size="11" fill="#6B7280">每次调用</text>
  <text x="325" y="306" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜SqlSource 是推迟到调用期的生成策略，最终文本只在 BoundSql 里存活一次</text>
</svg>
