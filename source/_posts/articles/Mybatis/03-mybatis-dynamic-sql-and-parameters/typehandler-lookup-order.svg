<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 查找漏斗：四级 -->
  <g stroke-width="1.5">
    <rect x="90"  y="44" width="640" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="130" y="110" width="560" height="52" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="170" y="176" width="480" height="52" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
    <rect x="210" y="242" width="400" height="52" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="410" y="68">① 精确匹配 (Java 类型, JDBC 类型)</text>
    <text x="410" y="134">② 同 Java 类型默认处理器 (jdbcType = null)</text>
    <text x="410" y="200">③ 枚举按声明类懒创建 EnumTypeHandler</text>
    <text x="410" y="266">④ 仍无 → 明确失败，不落 setObject</text>
  </g>
  <g font-size="12" fill="#6B7280" text-anchor="middle">
    <text x="410" y="88">如 (String, CHAR) 指定专用处理器</text>
    <text x="410" y="154">如 String、Long、LocalDateTime 的默认注册</text>
    <text x="410" y="220">保存 name()，未知值带上下文失败</text>
  </g>
  <line x1="410" y1="98" x2="410" y2="106" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c9)"/>
  <line x1="410" y1="164" x2="410" y2="172" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c9)"/>
  <line x1="410" y1="230" x2="410" y2="238" stroke="#5A6472" stroke-width="1.5" marker-end="url(#c9)"/>

  <text x="748" y="70" font-size="11" fill="#6B7280" text-anchor="end" transform="translate(0,246)">null 只走 setNull，不进本漏斗</text>

  <text x="410" y="316" text-anchor="middle" font-size="12" fill="#6B7280">图 8｜TypeHandler 查找顺序固定为四级，找不到就失败而非交给驱动猜</text>
</svg>
