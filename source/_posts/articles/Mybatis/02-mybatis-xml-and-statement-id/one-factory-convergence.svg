<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 两条来源 -->
  <rect x="40" y="44" width="230" height="70" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="155" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">XMLMapperBuilder</text>
  <text x="155" y="97" text-anchor="middle" font-size="12" fill="#6B7280">读 &lt;select&gt;…&lt;/select&gt; 文本</text>

  <rect x="40" y="196" width="230" height="70" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="155" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">MapperAnnotationBuilder</text>
  <text x="155" y="249" text-anchor="middle" font-size="12" fill="#6B7280">读 @Select/@Insert…</text>

  <!-- 唯一工厂 -->
  <rect x="340" y="112" width="210" height="86" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.5"/>
  <text x="445" y="146" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">fromMapperMethod</text>
  <text x="445" y="170" text-anchor="middle" font-size="12" fill="#6B7280">id 匹配 · 返回形状 · SQL 解析</text>

  <path d="M 274 79 C 310 79, 310 130, 334 140" fill="none" stroke="#5A6472" stroke-width="1.5" marker-end="url(#b2)"/>
  <path d="M 274 231 C 310 231, 310 180, 334 170" fill="none" stroke="#5A6472" stroke-width="1.5" marker-end="url(#b2)"/>

  <!-- 同构产物 -->
  <rect x="600" y="112" width="180" height="86" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="690" y="146" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">MappedStatement</text>
  <text x="690" y="170" text-anchor="middle" font-size="12" fill="#6B7280">同一种注册结构</text>

  <line x1="554" y1="155" x2="594" y2="155" stroke="#5A6472" stroke-width="1.5" marker-end="url(#b2)"/>

  <!-- 底部反例 -->
  <text x="410" y="278" text-anchor="middle" font-size="12" fill="#6B7280">若两条路径各写一套校验：同一句 SQL 因来源不同而行为分叉</text>

  <text x="410" y="312" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜两种来源汇入同一个工厂方法，规则只存在一份</text>
</svg>
