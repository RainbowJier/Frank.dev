<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="430" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="429" fill="none" stroke="#D9DFE8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 本章新建（深蓝） -->
  <rect x="300" y="70" width="190" height="64" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="560" y="70" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="300" y="200" width="190" height="64" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="560" y="200" width="200" height="76" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <!-- 已有（灰紫） -->
  <rect x="50" y="70" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#8491B4" stroke-width="1.5"/>
  <rect x="50" y="330" width="170" height="56" rx="6" fill="#FFFFFF" stroke="#8491B4" stroke-width="1.5"/>
  <rect x="300" y="330" width="170" height="56" rx="6" fill="#FFFFFF" stroke="#8491B4" stroke-width="1.5"/>

  <g text-anchor="middle" fill="#252A33">
    <text x="130" y="94" font-size="13" font-weight="500">UserMapper</text>
    <text x="130" y="114" font-size="11" fill="#6B7280">测试目录 · @Select 等标注</text>
    <text x="395" y="94" font-size="13" font-weight="500">MapperAnnotationBuilder</text>
    <text x="395" y="116" font-size="11" fill="#6B7280">读注解 · 校验 · 生成元数据</text>
    <text x="660" y="94" font-size="13" font-weight="500">MapperProxyFactory</text>
    <text x="660" y="116" font-size="11" fill="#6B7280">造代理 · 绑定会话</text>
    <text x="395" y="224" font-size="13" font-weight="500">MapperRegistry</text>
    <text x="395" y="246" font-size="11" fill="#6B7280">addMapper / getMapper</text>
    <text x="660" y="222" font-size="11" font-style="italic" fill="#6B7280">«implements InvocationHandler»</text>
    <text x="660" y="242" font-size="13" font-weight="500">MapperProxy</text>
    <text x="660" y="262" font-size="11" fill="#6B7280">拼 id · 组参数 · 转发</text>
    <text x="135" y="352" font-size="13" font-weight="500">Configuration</text>
    <text x="135" y="372" font-size="11" fill="#6B7280">session 包 · 注册表</text>
    <text x="385" y="352" font-size="11" font-style="italic" fill="#6B7280">«interface»</text>
    <text x="385" y="372" font-size="13" font-weight="500">SqlSession</text>
  </g>

  <!-- 关系边 -->
  <g fill="none" stroke="#5A6472" stroke-width="1.5">
    <line x1="210" y1="100" x2="295" y2="100" marker-end="url(#arrow)"/>
    <path d="M300,102 H240 V358 H225" marker-end="url(#arrow)"/>
    <line x1="395" y1="200" x2="395" y2="138" marker-end="url(#arrow)"/>
    <path d="M490,220 H525 V102 H555" marker-end="url(#arrow)"/>
    <line x1="660" y1="134" x2="660" y2="196" marker-end="url(#arrow)"/>
    <path d="M560,238 H520 V358 H475" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="216" y="92">读注解</text>
    <text x="120" y="300">addMappedStatement</text>
    <text x="403" y="172">解析时使用</text>
    <text x="498" y="150">登记</text>
    <text x="670" y="168">newInstance(session)</text>
    <text x="528" y="320">转发 selectOne / insert</text>
  </g>

  <rect x="50" y="404" width="12" height="12" fill="#3C5488" fill-opacity="0.85"/>
  <text x="68" y="414" font-size="11" fill="#6B7280">本章新建</text>
  <rect x="150" y="404" width="12" height="12" fill="#8491B4" fill-opacity="0.85"/>
  <text x="168" y="414" font-size="11" fill="#6B7280">已有</text>
  <text x="500" y="414" text-anchor="middle" font-size="12" fill="#6B7280">图 13｜binding 与 builder：注册期解析一次，运行期代理只转发</text>
</svg>
