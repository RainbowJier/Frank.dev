<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="320" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="319" fill="none" stroke="#D9DFE8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 新建类（深蓝） -->
  <rect x="60" y="60" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <rect x="60" y="190" width="170" height="80" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <!-- JDK（灰紫） -->
  <rect x="330" y="120" width="150" height="64" rx="6" fill="#FFFFFF" stroke="#8491B4" stroke-width="1.5"/>
  <rect x="560" y="120" width="140" height="64" rx="6" fill="#FFFFFF" stroke="#8491B4" stroke-width="1.5"/>

  <g text-anchor="middle" fill="#252A33">
    <text x="145" y="82" font-size="11" font-style="italic" fill="#6B7280">«interface»</text>
    <text x="145" y="102" font-size="13" font-weight="500">Transaction</text>
    <text x="145" y="122" font-size="11" fill="#6B7280">getConnection · commit</text>
    <text x="145" y="138" font-size="11" fill="#6B7280">rollback · close</text>
    <text x="145" y="212" font-size="13" font-weight="500">JdbcTransaction</text>
    <text x="145" y="234" font-size="11" fill="#6B7280">构造即借连接</text>
    <text x="145" y="250" font-size="11" fill="#6B7280">并关闭自动提交</text>
    <text x="405" y="144" font-size="13" font-weight="500">DataSource</text>
    <text x="405" y="166" font-size="11" fill="#6B7280">javax.sql · 连接来源</text>
    <text x="630" y="144" font-size="13" font-weight="500">Connection</text>
    <text x="630" y="166" font-size="11" fill="#6B7280">java.sql · 独占持有</text>
  </g>

  <!-- 关系边 -->
  <g fill="none" stroke="#5A6472" stroke-width="1.5">
    <line x1="145" y1="140" x2="145" y2="186" marker-end="url(#hollow)"/>
    <path d="M230,215 H280 V152 H325" marker-end="url(#arrow)"/>
    <path d="M230,245 H530 V152 H555" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="155" y="168">实现</text>
    <text x="236" y="178">getConnection()</text>
    <text x="240" y="268">持有至 close() 归还</text>
  </g>

  <text x="410" y="282" text-anchor="middle" font-size="12" fill="#6B7280">实现 AutoCloseable：close 幂等，关闭后拒绝访问 —— 防止连接被归还两次</text>
  <rect x="50" y="296" width="12" height="12" fill="#3C5488" fill-opacity="0.85"/>
  <text x="68" y="306" font-size="11" fill="#6B7280">本章新建</text>
  <rect x="150" y="296" width="12" height="12" fill="#8491B4" fill-opacity="0.85"/>
  <text x="168" y="306" font-size="11" fill="#6B7280">JDK</text>
  <text x="500" y="306" text-anchor="middle" font-size="12" fill="#6B7280">图 10｜transaction 包：谁借出连接，谁负责提交、回滚与归还</text>
</svg>
