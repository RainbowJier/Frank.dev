<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="320" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="319" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 左：Java 方法与参数 Map -->
  <rect x="36" y="44" width="330" height="106" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="201" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">Java 形参顺序（id 在前）</text>
  <text x="201" y="94" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">rename(Long id, String name)</text>
  <text x="201" y="120" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">Map = { id=1, name="Frank" }</text>

  <!-- 右：SQL 出现顺序 -->
  <rect x="454" y="44" width="330" height="106" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="619" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">SQL 占位符顺序（name 在前）</text>
  <text x="619" y="94" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">set user_name=#{name} where id=#{id}</text>
  <text x="619" y="120" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">parameterNames = [name, id]</text>

  <line x1="372" y1="97" x2="448" y2="97" stroke="#5A6472" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="410" y="86" text-anchor="middle" font-size="11" fill="#6B7280">按名称取值</text>

  <!-- 下：JDBC 绑定下标 -->
  <rect x="36" y="196" width="748" height="70" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="410" y="224" text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">JDBC 下标由 parameterNames 顺序决定，与形参顺序无关</text>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Consolas,monospace">setString(1, "Frank")   setLong(2, 1)</text>

  <line x1="410" y1="156" x2="410" y2="192" stroke="#5A6472" stroke-width="1.5" marker-end="url(#a3)"/>

  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#6B7280">图 5｜参数绑定按 SQL 出现顺序建立下标，名称是唯一桥梁</text>
</svg>
