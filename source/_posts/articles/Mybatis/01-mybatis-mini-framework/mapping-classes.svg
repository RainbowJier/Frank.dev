<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 新建类（深蓝） -->
  <g fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5">
    <rect x="50" y="90" width="160" height="64" rx="6"/>
    <rect x="300" y="60" width="170" height="64" rx="6"/>
  </g>
  <rect x="300" y="180" width="190" height="76" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <g text-anchor="middle" fill="#252A33">
    <text x="130" y="114" font-size="13" font-weight="500">SqlTemplateParser</text>
    <text x="130" y="136" font-size="11" fill="#6B7280">静态工具 · parse(raw)</text>
    <text x="385" y="84" font-size="13" font-weight="500">PreparedSql</text>
    <text x="385" y="106" font-size="11" fill="#6B7280">record · sql + 参数名列表</text>
    <text x="395" y="205" font-size="14" font-weight="500">MappedStatement</text>
    <text x="395" y="227" font-size="11" fill="#6B7280">一条语句的不可变元数据</text>
    <text x="395" y="245" font-size="11" fill="#6B7280">id · commandType · preparedSql ...</text>
  </g>

  <!-- SqlCommandType 枚举（chips） -->
  <text x="580" y="56" font-size="12" font-weight="600" fill="#3C5488">SqlCommandType（enum）</text>
  <g fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5">
    <rect x="580" y="66" width="95" height="32" rx="6"/>
    <rect x="580" y="106" width="95" height="32" rx="6"/>
    <rect x="580" y="146" width="95" height="32" rx="6"/>
    <rect x="580" y="186" width="95" height="32" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="500" fill="#252A33">
    <text x="627.5" y="86">SELECT</text>
    <text x="627.5" y="126">INSERT</text>
    <text x="627.5" y="166">UPDATE</text>
    <text x="627.5" y="206">DELETE</text>
  </g>

  <!-- 关系边 -->
  <g fill="none" stroke="#5A6472" stroke-width="1.5">
    <line x1="210" y1="118" x2="295" y2="100" marker-end="url(#arrow)"/>
    <line x1="385" y1="180" x2="385" y2="130" marker-end="url(#arrow)"/>
    <line x1="490" y1="210" x2="575" y2="160" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="212" y="98">parse(raw)</text>
    <text x="395" y="160">持有</text>
    <text x="498" y="196">取值</text>
  </g>

  <rect x="50" y="292" width="12" height="12" fill="#3C5488" fill-opacity="0.85"/>
  <text x="68" y="302" font-size="11" fill="#6B7280">本章新建</text>
  <text x="440" y="302" text-anchor="middle" font-size="12" fill="#6B7280">图 6｜mapping 包：模板文本启动期一次性解析为不可变元数据</text>
</svg>
