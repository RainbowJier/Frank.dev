<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 365" width="820" height="365" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><rect width="820" height="365" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="819" height="364" fill="none" stroke="#D9DFE8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5 0 10z" fill="#5A6472"/></marker></defs><text x="40" y="36" font-size="18" font-weight="700" fill="#3C5488">A</text><text x="70" y="36" font-size="15" font-weight="600" fill="#252A33">Mapper 代理调用与结果回传</text><g text-anchor="middle" font-size="13" font-weight="600" fill="#252A33"><text x="100" y="70">调用方</text><text x="265" y="70">MapperProxy</text><text x="430" y="70">DefaultSqlSession</text><text x="595" y="70">Executor</text><text x="740" y="70">数据库</text></g><g stroke="#D9DFE8" stroke-dasharray="5 4"><path d="M100 82v230M265 82v230M430 82v230M595 82v230M740 82v230"/></g><g stroke="#5A6472" stroke-width="1.5" marker-end="url(#a)"><path d="M100 110h157M265 150h157M430 190h157M595 230h137"/></g><g text-anchor="middle" font-size="11" fill="#6B7280"><text x="180" y="103">selectById(1)</text><text x="347" y="143">execute(method,args)</text><text x="513" y="183">按 Method 查 statement</text><text x="664" y="223">bind @Param → JDBC</text></g><path d="M740 260H595M595 280H430M430 300H265M265 320H100" fill="none" stroke="#00A087" stroke-width="1.5" marker-end="url(#a)"/><g text-anchor="middle" font-size="11" fill="#6B7280"><text x="667" y="255">ResultSet</text><text x="513" y="275">关闭 statement/resultset</text><text x="347" y="295">映射 User 或 List&lt;User&gt;</text><text x="180" y="315">返回结果；连接仍由 session 持有</text></g><text x="410" y="347" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜Mapper 代理经 SqlSession 与 Executor 访问数据库并回传结果</text></svg>