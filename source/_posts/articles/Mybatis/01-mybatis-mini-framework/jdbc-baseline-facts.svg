<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="330" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="329" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 面板 A：? 只绑值 -->
  <rect x="30" y="28" width="245" height="252" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="50" y="58" font-size="17" font-weight="700" fill="#3C5488">A</text>
  <text x="72" y="57" font-size="14" font-weight="600" fill="#252A33">? 只能绑定值</text>
  <rect x="48" y="76" width="209" height="44" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="152" y="103" text-anchor="middle" font-size="13" fill="#252A33">? = 一个普通字符串值</text>
  <rect x="48" y="140" width="209" height="44" rx="6" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35" stroke-width="1.5"/>
  <text x="152" y="167" text-anchor="middle" font-size="13" fill="#252A33">拼接进 SQL 文本 = 注入</text>
  <text x="152" y="222" text-anchor="middle" font-size="12" fill="#6B7280">后面所有 #{} 走预编译，</text>
  <text x="152" y="240" text-anchor="middle" font-size="12" fill="#6B7280">依据在此钉死</text>

  <!-- 面板 B：NULL 就是 null -->
  <rect x="288" y="28" width="245" height="252" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="308" y="58" font-size="17" font-weight="700" fill="#3C5488">B</text>
  <text x="330" y="57" font-size="14" font-weight="600" fill="#252A33">SQL NULL ≠ 0</text>
  <rect x="306" y="76" width="209" height="44" rx="6" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="410" y="103" text-anchor="middle" font-size="13" fill="#252A33">getObject → Java null</text>
  <rect x="306" y="140" width="209" height="44" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="410" y="167" text-anchor="middle" font-size="13" fill="#252A33">getInt → 0（须查 wasNull）</text>
  <text x="410" y="222" text-anchor="middle" font-size="12" fill="#6B7280">结果映射只准走包装类型，</text>
  <text x="410" y="240" text-anchor="middle" font-size="12" fill="#6B7280">NULL 落进基本类型即失败</text>

  <!-- 面板 C：提交前不可见 -->
  <rect x="546" y="28" width="245" height="252" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="566" y="58" font-size="17" font-weight="700" fill="#3C5488">C</text>
  <text x="588" y="57" font-size="14" font-weight="600" fill="#252A33">提交前不可见</text>
  <rect x="564" y="76" width="209" height="44" rx="6" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="668" y="103" text-anchor="middle" font-size="13" fill="#252A33">连接 A：insert + 未提交</text>
  <rect x="564" y="140" width="209" height="44" rx="6" fill="#8491B4" fill-opacity="0.12" stroke="#8491B4" stroke-width="1.5"/>
  <text x="668" y="167" text-anchor="middle" font-size="13" fill="#252A33">连接 B：count(*) = 0</text>
  <line x1="668" y1="124" x2="668" y2="136" stroke="#5A6472" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="668" y="222" text-anchor="middle" font-size="12" fill="#6B7280">Session 的 commit/rollback</text>
  <text x="668" y="240" text-anchor="middle" font-size="12" fill="#6B7280">语义由这条基线保证</text>

  <text x="410" y="310" text-anchor="middle" font-size="12" fill="#6B7280">图 3｜JDBC 基线钉死的三件事：预编译、NULL 语义、事务可见性</text>
</svg>
