<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="430" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="429" fill="none" stroke="#D9DFE8"/>

  <text x="40" y="47" font-size="18" font-weight="600" fill="#252A33">并发控制：都采用多版本思想，但实现与默认行为不同</text>
  <text x="40" y="70" font-size="12" fill="#6B7280">以下聚焦常用默认配置；真实行为还会受到事务语句、索引和数据库版本影响。</text>

  <!-- MySQL -->
  <rect x="40" y="96" width="230" height="274" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="62" y="128" font-size="18" font-weight="700" fill="#3C5488">A</text>
  <text x="88" y="127" font-size="15" font-weight="600" fill="#252A33">MySQL / InnoDB</text>
  <rect x="62" y="147" width="186" height="44" rx="7" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="1.5"/>
  <text x="155" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Undo Log + Read View</text>
  <text x="62" y="222" font-size="12" font-weight="600" fill="#252A33">默认隔离级别</text>
  <text x="62" y="243" font-size="12" fill="#6B7280">REPEATABLE READ</text>
  <text x="62" y="280" font-size="12" font-weight="600" fill="#252A33">锁与可见性</text>
  <text x="62" y="301" font-size="12" fill="#6B7280">快照读走 MVCC；当前读加锁</text>
  <text x="62" y="322" font-size="12" fill="#6B7280">范围更新可能出现 next-key 锁</text>
  <text x="155" y="350" text-anchor="middle" font-size="11" fill="#6B7280">适合常见 OLTP 写入模型</text>

  <!-- PostgreSQL -->
  <rect x="295" y="96" width="230" height="274" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="317" y="128" font-size="18" font-weight="700" fill="#3C5488">B</text>
  <text x="343" y="127" font-size="15" font-weight="600" fill="#252A33">PostgreSQL</text>
  <rect x="317" y="147" width="186" height="44" rx="7" fill="#4DBBD5" fill-opacity="0.13" stroke="#4DBBD5" stroke-width="1.5"/>
  <text x="410" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">行版本 + VACUUM</text>
  <text x="317" y="222" font-size="12" font-weight="600" fill="#252A33">默认隔离级别</text>
  <text x="317" y="243" font-size="12" fill="#6B7280">READ COMMITTED</text>
  <text x="317" y="280" font-size="12" font-weight="600" fill="#252A33">锁与可见性</text>
  <text x="317" y="301" font-size="12" fill="#6B7280">更新产生新行版本，旧版本待清理</text>
  <text x="317" y="322" font-size="12" fill="#6B7280">需监控 VACUUM 与长事务</text>
  <text x="410" y="350" text-anchor="middle" font-size="11" fill="#6B7280">适合复杂查询和持续演进</text>

  <!-- Oracle -->
  <rect x="550" y="96" width="230" height="274" rx="10" fill="#FFFFFF" stroke="#D9DFE8"/>
  <text x="572" y="128" font-size="18" font-weight="700" fill="#3C5488">C</text>
  <text x="598" y="127" font-size="15" font-weight="600" fill="#252A33">Oracle Database</text>
  <rect x="572" y="147" width="186" height="44" rx="7" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.5"/>
  <text x="665" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">Undo 表空间 + 一致性读</text>
  <text x="572" y="222" font-size="12" font-weight="600" fill="#252A33">默认隔离级别</text>
  <text x="572" y="243" font-size="12" fill="#6B7280">READ COMMITTED</text>
  <text x="572" y="280" font-size="12" font-weight="600" fill="#252A33">锁与可见性</text>
  <text x="572" y="301" font-size="12" fill="#6B7280">读不阻塞写，写也不阻塞读</text>
  <text x="572" y="322" font-size="12" fill="#6B7280">并发写同一行仍需等待行锁</text>
  <text x="665" y="350" text-anchor="middle" font-size="11" fill="#6B7280">适合严谨治理的核心系统</text>

  <line x1="40" y1="392" x2="780" y2="392" stroke="#E8EDF3" stroke-width="1"/>
  <text x="410" y="416" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜三种数据库的 MVCC 与默认隔离级别速览</text>
</svg>
