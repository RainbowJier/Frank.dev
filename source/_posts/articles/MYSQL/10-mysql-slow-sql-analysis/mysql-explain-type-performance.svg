<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <!-- 白底 -->
  <rect width="820" height="320" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="319" fill="none" stroke="#D9DFE8" stroke-width="0.5"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <!-- 渐变色性能指示条 -->
    <linearGradient id="perfGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00A087;stop-opacity:1" />
      <stop offset="42%" style="stop-color:#00A087;stop-opacity:1" />
      <stop offset="43%" style="stop-color:#F39B7F;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#F39B7F;stop-opacity:1" />
      <stop offset="71%" style="stop-color:#E64B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E64B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 顶部性能指示条 -->
  <rect x="60" y="40" width="700" height="8" rx="4" fill="url(#perfGradient)"/>
  <text x="410" y="32" text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">查询性能</text>
  <text x="80" y="64" text-anchor="start" font-size="11" fill="#00A087" font-weight="600">优秀</text>
  <text x="410" y="64" text-anchor="middle" font-size="11" fill="#F39B7F" font-weight="600">可接受</text>
  <text x="730" y="64" text-anchor="end" font-size="11" fill="#E64B35" font-weight="600">需优化</text>
  
  <!-- system 节点 -->
  <rect x="40" y="100" width="88" height="120" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.8"/>
  <text x="84" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">system</text>
  <text x="84" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="84">系统表</tspan>
    <tspan x="84" dy="1.5em">单行记录</tspan>
    <tspan x="84" dy="1.5em">极少见</tspan>
  </text>
  
  <!-- const 节点 -->
  <rect x="142" y="100" width="88" height="120" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.8"/>
  <text x="186" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">const</text>
  <text x="186" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="186">主键或</tspan>
    <tspan x="186" dy="1.5em">唯一索引</tspan>
    <tspan x="186" dy="1.5em">等值查询</tspan>
  </text>
  
  <!-- eq_ref 节点 -->
  <rect x="244" y="100" width="88" height="120" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087" stroke-width="1.8"/>
  <text x="288" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">eq_ref</text>
  <text x="288" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="288">主键或</tspan>
    <tspan x="288" dy="1.5em">唯一索引</tspan>
    <tspan x="288" dy="1.5em">JOIN关联</tspan>
  </text>
  
  <!-- ref 节点 -->
  <rect x="346" y="100" width="88" height="120" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.8"/>
  <text x="390" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">ref</text>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="390">非唯一</tspan>
    <tspan x="390" dy="1.5em">索引</tspan>
    <tspan x="390" dy="1.5em">等值查询</tspan>
  </text>
  
  <!-- range 节点 -->
  <rect x="448" y="100" width="88" height="120" rx="8" fill="#F39B7F" fill-opacity="0.12" stroke="#F39B7F" stroke-width="1.8"/>
  <text x="492" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">range</text>
  <text x="492" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="492">索引范围</tspan>
    <tspan x="492" dy="1.5em">BETWEEN</tspan>
    <tspan x="492" dy="1.5em">IN / &gt; / &lt;</tspan>
  </text>
  
  <!-- index 节点 -->
  <rect x="550" y="100" width="88" height="120" rx="8" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="1.8"/>
  <text x="594" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">index</text>
  <text x="594" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="594">全索引</tspan>
    <tspan x="594" dy="1.5em">扫描</tspan>
    <tspan x="594" dy="1.5em">读整棵树</tspan>
  </text>
  
  <!-- ALL 节点 -->
  <rect x="652" y="100" width="88" height="120" rx="8" fill="#E64B35" fill-opacity="0.12" stroke="#E64B35" stroke-width="1.8"/>
  <text x="696" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">ALL</text>
  <text x="696" y="158" text-anchor="middle" font-size="11" fill="#6B7280">
    <tspan x="696">全表</tspan>
    <tspan x="696" dy="1.5em">扫描</tspan>
    <tspan x="696" dy="1.5em">最慢</tspan>
  </text>
  
  <!-- 连接箭头 -->
  <line x1="130" y1="160" x2="140" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="232" y1="160" x2="242" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="334" y1="160" x2="344" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="160" x2="446" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="538" y1="160" x2="548" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="160" x2="650" y2="160" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 底部说明 -->
  <text x="84" y="248" text-anchor="middle" font-size="10" fill="#8491B4">最快</text>
  <text x="696" y="248" text-anchor="middle" font-size="10" fill="#8491B4">最慢</text>
  
  <!-- 图注 -->
  <text x="410" y="290" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜EXPLAIN type 字段性能等级对比（从左到右性能递减）</text>
</svg>