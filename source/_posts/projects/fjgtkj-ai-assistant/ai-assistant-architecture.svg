<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="590" fill="#FFFFFF"/>
