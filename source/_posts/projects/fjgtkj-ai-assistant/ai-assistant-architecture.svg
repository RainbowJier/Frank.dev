  <!-- 领域层红色标注：全图唯一强调点 -->
  <circle cx="678" cy="323" r="2.5" fill="#E64B35"/>
  <g text-anchor="middle" font-size="11" fill="#E64B35">
    <text x="726" y="320">依赖倒置</text>
    <text x="726" y="336">零框架 import</text>
