<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 445" width="820" height="445"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="445" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="444" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 三条并行导出链路：数据源（青）→ 转换（深蓝） -->
  <g stroke-width="1.5">
    <rect x="40" y="50" width="150" height="56" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="40" y="120" width="150" height="56" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
    <rect x="40" y="190" width="150" height="56" rx="8" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="115" y="74">NAS · GDB 文件</text>
    <text x="115" y="144">Oracle 空间库</text>
    <text x="115" y="214">PostGIS 库</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="115" y="92">基础类数据</text>
    <text x="115" y="162">详细规划 · 24 表</text>
    <text x="115" y="232">临时用地 · 3 表</text>
  </g>

  <g stroke-width="1.5">
    <rect x="230" y="50" width="220" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="230" y="120" width="220" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="230" y="190" width="220" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="340" y="74">按行政区划过滤裁剪</text>
    <text x="340" y="144">元数据驱动表导出</text>
    <text x="340" y="214">三表级联导出</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="340" y="92">GDB_Items 还原数据集结构</text>
    <text x="340" y="162">字段类型映射 · 空间精度参数</text>
    <text x="340" y="232">CID/FID 外键链 · 增量窗口</text>
  </g>

  <!-- 汇聚：导出产物 -->
  <rect x="560" y="50" width="220" height="196" rx="10" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2"/>
  <text x="670" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#252A33">导出 GDB</text>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="670" y="122">临时目录会话隔离</text>
    <text x="670" y="144">保留要素数据集分组</text>
    <text x="670" y="166">字段定义原样复制</text>
    <text x="670" y="188">环方向已纠正</text>
  </g>
  <text x="670" y="226" text-anchor="middle" font-size="11" fill="#6B7280">多 GDB 场景按目录聚合</text>

  <!-- 链路箭头 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="192" y1="78"  x2="226" y2="78"  marker-end="url(#arrow)"/>
    <line x1="192" y1="148" x2="226" y2="148" marker-end="url(#arrow)"/>
    <line x1="192" y1="218" x2="226" y2="218" marker-end="url(#arrow)"/>
    <line x1="452" y1="78"  x2="556" y2="78"  marker-end="url(#arrow)"/>
    <line x1="452" y1="148" x2="556" y2="148" marker-end="url(#arrow)"/>
    <line x1="452" y1="218" x2="556" y2="218" marker-end="url(#arrow)"/>
  </g>

  <!-- 统一后处理管道 -->
  <path d="M 670 246 V 302 H 106 V 326" fill="none" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="388" y="296" text-anchor="middle" font-size="11" fill="#6B7280">统一后处理管道</text>

  <g stroke-width="1.5">
    <rect x="42"  y="330" width="128" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="194" y="330" width="128" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="346" y="330" width="128" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="498" y="330" width="128" height="56" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="650" y="330" width="128" height="56" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="#252A33">
    <text x="106" y="350">数据质检</text>
    <text x="258" y="350">口令加密压缩</text>
    <text x="410" y="350">上传 MinIO</text>
    <text x="562" y="350">登记 file_info</text>
    <text x="714" y="350">返回 fileId</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="106" y="368">重开 GDB</text>
    <text x="106" y="382">核对图层/要素数</text>
    <text x="258" y="368">随机 8 位口令</text>
    <text x="258" y="382">ZIP 加密</text>
    <text x="410" y="368">对象存储桶</text>
    <text x="410" y="382">直传不经业务库</text>
    <text x="562" y="368">OPS 统一</text>
    <text x="562" y="382">文件管理</text>
    <text x="714" y="368">口令随下载</text>
    <text x="714" y="382">记录回填</text>
  </g>
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="170" y1="358" x2="190" y2="358" marker-end="url(#arrow)"/>
    <line x1="322" y1="358" x2="342" y2="358" marker-end="url(#arrow)"/>
    <line x1="474" y1="358" x2="494" y2="358" marker-end="url(#arrow)"/>
    <line x1="626" y1="358" x2="646" y2="358" marker-end="url(#arrow)"/>
  </g>

  <text x="410" y="424" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜三类数据源的 GDB 导出链路与统一后处理</text>
</svg>
