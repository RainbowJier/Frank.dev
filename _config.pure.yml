# ============================================================
# Pure 主题配置覆盖（_config.pure.yml）
# 主题为 Zcxx0322/hexo-theme-pure 官方原版（整个主题，零修改）。
# 本文件覆盖 themes/pure/_config.yml，是主题配置的唯一真源。
# 站点为单语言中文站（标准 hexo init 结构）。
# ============================================================

# 网站图标（用头像兼作 favicon）
favicon: /images/avatar.jpg

# Logo；留空显示站点标题文字
logo: ""

# ----------------------------------------------------------------
# 导航菜单（名称: 路径）
# ----------------------------------------------------------------
menu:
  首页: /
  归档: /archives
  标签: /tags
  分类: /categories
  作品: /projects
  关于: /about

# ----------------------------------------------------------------
# 社交链接（显示在页脚）
# ----------------------------------------------------------------
social:
  github: https://github.com/RainbowJier
  twitter: ""
  email: 3021809270@qq.com
  rss: /atom.xml

# ----------------------------------------------------------------
# 文章设置
# ----------------------------------------------------------------
post:
  excerpt_length: 200
  show_updated: true
  copyright: true
  copyright_text: "本文采用 CC BY-NC-SA 4.0 许可协议，转载请注明出处。"
  series:
    enable: true
  outdated:
    enable: true
    days: 365
    basis: updated
    message: "技术细节可能随版本变化，请结合当前环境验证。"

# 文章目录
toc:
  enable: true
  max_depth: 3
  number: false

# 代码高亮
highlight:
  enable: true
  theme: atom-one-dark
  copy_button: true

# 数学公式
math:
  enable: false
  engine: katex

# 图片灯箱
lightbox:
  enable: true

# 本地搜索
search:
  enable: true
  path: search.xml
  field: post
  content: true

# 评论（未接入评论服务，置 false 不显示空评论块）
comments:
  enable: false
  provider: giscus
  giscus:
    repo: ""
    repo_id: ""
    category: ""
    category_id: ""
    mapping: pathname
    reactions_enabled: 1
    emit_metadata: 0
    theme: preferred_color_scheme
    lang: zh-CN
  waline:
    server_url: ""
    lang: zh-CN
    comment_count: true
    page_view: false
  disqus:
    shortname: ""
  valine:
    app_id: ""
    app_key: ""
    placeholder: "说点什么吧…"
    avatar: mm
    lang: zh-CN

# 站点统计
analytics:
  google:
    enable: false
    id: ""
  baidu:
    enable: false
    id: ""
  umami:
    enable: false
    src: ""
    website_id: ""

# 深色模式
dark_mode:
  enable: true
  default: auto

# 页脚
footer:
  since: 2026
  last_updated: true
  custom_text: ""
  icp: ""

# 关于页（头像 / 名称 / 简介 / 社交；正文写在 about 页 Markdown 里）
about:
  avatar: /images/avatar.jpg
  name: Frank
  bio: "前端开发者 · 终身学习者"
  links:
    github: https://github.com/RainbowJier
    email: 3021809270@qq.com
    twitter: ""
    website: https://frank-dev.site

cdn:
  highlight_css: ""
  katex_css: ""
  katex_js: ""
