<!DOCTYPE html>
<!--
  ============================================================
  ★ 文章模板 —— 新文章请复制本文件使用 ★
  ============================================================
  使用步骤：
  1. 复制本文件为 posts/你的文章.html（如 posts/mybatis-tips.html）
  2. 全文替换 <PREFIX> 为文章英文标识（如 mybatis-tips）：
     包括 <title>、description、data-i18n key 全部
  3. 修改下面「文章元信息」：eyebrow / title / date（在 js/i18n.js 里写内容）
  4. 正文区 <div class="article-body"> 里写你的内容：
     - 段落用 <p data-i18n="<PREFIX>.p1">（连续编号 p1 p2 p3…）
     - 小标题用 <h2 data-i18n="<PREFIX>.h2_1">（编号 h2_1 h2_2…）
     - 列表项 <li data-i18n="<PREFIX>.li1">，引用 <blockquote data-i18n="<PREFIX>.quote">
     - 不需要的元素直接删掉
  5. 在 js/i18n.js 的「新文章字典区」补一篇 zh（必写）+ en（可选）
  6. 在 blog.html 复制一条 post-item（含 data-cat 分类），改日期/标题/链接
  7. 更新 post-nav 上下篇链接
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="<PREFIX>.desc —— Frank's Notes">
  <title><PREFIX> · Frank's Notes</title>
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Saira+Extra+Condensed:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ====== 移动端汉堡按钮 ====== -->
  <button class="sidebar-toggle" aria-label="打开菜单">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay"></div>

  <!-- ====== 侧边栏 ====== -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="avatar-wrap">
        <img src="../assets/avatar.jpg" alt="Frank" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="avatar-placeholder" style="display:none">F</span>
      </div>
      <div class="sidebar-name">Frank</div>
      <div class="sidebar-sub" data-i18n="home.subtitle">前端开发者 · 终身学习者</div>
    </div>
    <nav class="sidebar-nav">
      <ul class="sidebar-links">
        <li><a href="../index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="../blog.html" class="active" data-i18n="nav.blog">文章</a></li>
        <li><a href="../projects.html" data-i18n="nav.projects">作品</a></li>
        <li><a href="../about.html" data-i18n="nav.about">关于</a></li>
      </ul>
    </nav>
    <div class="sidebar-bottom">
      <button class="lang-toggle" data-lang-toggle>English</button>
      <p class="sidebar-copy" data-i18n-year="footer.copyright">© 2026 Frank's Notes</p>
    </div>
  </aside>

  <!-- ====== 主内容 ====== -->
  <main class="container">

    <article class="article measure">

      <!-- ====== 文章头（改这三个 key 的内容在 js/i18n.js） ====== -->
      <header class="article-header reveal">
        <p class="cat" style="margin-bottom:0.5rem;"><a href="../blog.html" data-i18n="<PREFIX>.eyebrow">随笔 · No. 03</a></p>
        <h1 data-i18n="<PREFIX>.title">文章标题</h1>
        <p class="article-meta">
          <span data-i18n="<PREFIX>.date">2026 年 8 月 20 日</span>
          <span class="sep">·</span>
          <span data-i18n="post.reading" data-i18n-placeholder="5">预计阅读 5 分钟</span>
        </p>
      </header>

      <!-- ====== 正文（key 全部换成你的 <PREFIX>，在 js/i18n.js 写内容） ====== -->
      <div class="article-body reveal">

        <p data-i18n="<PREFIX>.p1">正文第一段：交代这篇文章要讲什么。</p>

        <h2 data-i18n="<PREFIX>.h2_1">第一个小标题</h2>
        <p data-i18n="<PREFIX>.p2">正文第二段。</p>
        <ul>
          <li data-i18n="<PREFIX>.li1">列表项一；</li>
          <li data-i18n="<PREFIX>.li2">列表项二。</li>
        </ul>

        <h2 data-i18n="<PREFIX>.h2_2">第二个小标题</h2>
        <p data-i18n="<PREFIX>.p3">正文第三段。</p>
        <blockquote data-i18n="<PREFIX>.quote">一句值得强调的话。</blockquote>

        <h2 data-i18n="<PREFIX>.h2_3">小结</h2>
        <p data-i18n="<PREFIX>.p4">收尾段落。</p>

      </div>

      <!-- ====== 上下篇（按实际顺序改链接，不需要则删） ====== -->
      <nav class="post-nav">
        <a class="prev" href="上一篇.html"><span data-i18n="post.prev">← 上一篇</span></a>
        <a class="next" href="下一篇.html"><span data-i18n="post.next">下一篇 →</span></a>
      </nav>

    </article>

  </main>

  <footer class="footer"></footer>
  <button class="back-top" aria-label="返回顶部">↑</button>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
