<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="420" height="440" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="419" height="439" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 6x6 正方形网格 -->
  <g stroke="#E8EDF3" stroke-width="1">
    <line x1="40" y1="50"  x2="370" y2="50"/>
    <line x1="40" y1="105" x2="370" y2="105"/>
    <line x1="40" y1="160" x2="370" y2="160"/>
    <line x1="40" y1="215" x2="370" y2="215"/>
    <line x1="40" y1="270" x2="370" y2="270"/>
    <line x1="40" y1="325" x2="370" y2="325"/>
    <line x1="40" y1="380" x2="370" y2="380"/>
    <line x1="40"  y1="50" x2="40"  y2="380"/>
    <line x1="95"  y1="50" x2="95"  y2="380"/>
    <line x1="150" y1="50" x2="150" y2="380"/>
    <line x1="205" y1="50" x2="205" y2="380"/>
    <line x1="260" y1="50" x2="260" y2="380"/>
    <line x1="315" y1="50" x2="315" y2="380"/>
    <line x1="370" y1="50" x2="370" y2="380"/>
  </g>

  <!-- 旋转箭头（绕 P 逆时针） -->
  <path d="M165 215 A40 40 0 0 0 205 255" fill="none" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 三角形 ABC -->
  <polygon points="150,105 150,215 260,215" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488" stroke-width="2" stroke-linejoin="round"/>
  <!-- 三角形 DEF（ABC 的像） -->
  <polygon points="95,270 205,270 205,160" fill="#4DBBD5" fill-opacity="0.12" stroke="#4DBBD5" stroke-width="2" stroke-linejoin="round"/>

  <!-- 候选旋转中心 -->
  <g fill="#F39B7F" stroke="#F39B7F" stroke-width="1">
    <circle cx="205" cy="215" r="4"/>
    <circle cx="150" cy="270" r="4"/>
    <circle cx="260" cy="160" r="4"/>
    <circle cx="315" cy="215" r="4"/>
  </g>
  <g font-size="14" font-weight="700" font-style="italic" fill="#252A33">
    <text x="205" y="197" text-anchor="middle">P</text>
    <text x="150" y="259" text-anchor="middle">Q</text>
    <text x="274" y="157" text-anchor="middle">M</text>
    <text x="315" y="197" text-anchor="middle">N</text>
  </g>

  <!-- 顶点标注 -->
  <g font-size="14" font-weight="600" font-style="italic" fill="#252A33">
    <text x="142" y="101" text-anchor="end">A</text>
    <text x="142" y="222" text-anchor="end">B</text>
    <text x="266" y="233" text-anchor="start">C</text>
    <text x="87"  y="276" text-anchor="end">D</text>
    <text x="213" y="290" text-anchor="start">E</text>
    <text x="213" y="156" text-anchor="start">F</text>
  </g>
</svg>
