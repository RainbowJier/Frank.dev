<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="480" height="380" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="479" height="379" fill="none" stroke="#D9DFE8"/>

  <!-- 以 O 为圆心、OC 为半径的圆 -->
  <circle cx="240" cy="198" r="102" fill="#00A087" fill-opacity="0.08" stroke="#00A087" stroke-width="2"/>

  <!-- 等腰三角形 OAB 的两腰 -->
  <g stroke="#3C5488" stroke-width="2">
    <line x1="240" y1="198" x2="104" y2="300"/>
    <line x1="240" y1="198" x2="376" y2="300"/>
  </g>
  <!-- 直线 AB（切线） -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#3C5488" stroke-width="2"/>
  <!-- 半径 OC -->
  <line x1="240" y1="198" x2="240" y2="300" stroke="#E64B35" stroke-width="2"/>
  <!-- 直角记号 -->
  <path d="M228 300 L228 288 L240 288" fill="none" stroke="#252A33" stroke-width="1.2"/>
  <!-- OA、OB 等长记号 -->
  <g stroke="#252A33" stroke-width="1.5">
    <line x1="167.2" y1="242.6" x2="176.8" y2="255.4"/>
    <line x1="303.2" y1="255.4" x2="312.8" y2="242.6"/>
  </g>

  <!-- 顶点 -->
  <g fill="#252A33">
    <circle cx="240" cy="198" r="3.2"/>
    <circle cx="104" cy="300" r="3.2"/>
    <circle cx="376" cy="300" r="3.2"/>
    <circle cx="240" cy="300" r="3.2"/>
  </g>
  <g font-size="15" font-weight="600" font-style="italic" fill="#252A33">
    <text x="230" y="192" text-anchor="end">O</text>
    <text x="96"  y="320" text-anchor="middle">A</text>
    <text x="384" y="320" text-anchor="middle">B</text>
    <text x="240" y="322" text-anchor="middle">C</text>
  </g>
</svg>
