<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="440" height="440" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="439" height="439" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- 单位网格 -->
  <g stroke="#E8EDF3" stroke-width="1">
    <line x1="20"  y1="160" x2="320" y2="160"/>
    <line x1="20"  y1="210" x2="320" y2="210"/>
    <line x1="20"  y1="260" x2="320" y2="260"/>
    <line x1="20"  y1="310" x2="320" y2="310"/>
    <line x1="70"  y1="130" x2="70"  y2="385"/>
    <line x1="170" y1="130" x2="170" y2="385"/>
    <line x1="220" y1="130" x2="220" y2="385"/>
    <line x1="270" y1="130" x2="270" y2="385"/>
  </g>

  <!-- 坐标轴 -->
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="20" y1="360" x2="326" y2="360" marker-end="url(#arrow)"/>
    <line x1="120" y1="385" x2="120" y2="124" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" font-style="italic" fill="#252A33">
    <text x="334" y="365">x</text>
    <text x="113" y="120">y</text>
    <text x="112" y="376" text-anchor="end">O</text>
  </g>
  <!-- 刻度 -->
  <g stroke="#5A6472" stroke-width="1">
    <line x1="70"  y1="360" x2="70"  y2="365"/>
    <line x1="170" y1="360" x2="170" y2="365"/>
    <line x1="220" y1="360" x2="220" y2="365"/>
    <line x1="270" y1="360" x2="270" y2="365"/>
    <line x1="120" y1="160" x2="115" y2="160"/>
    <line x1="120" y1="210" x2="115" y2="210"/>
    <line x1="120" y1="260" x2="115" y2="260"/>
    <line x1="120" y1="310" x2="115" y2="310"/>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="70"  y="378" text-anchor="middle">−1</text>
    <text x="170" y="378" text-anchor="middle">1</text>
    <text x="220" y="378" text-anchor="middle">2</text>
    <text x="270" y="378" text-anchor="middle">3</text>
    <text x="112" y="164" text-anchor="end">4</text>
    <text x="112" y="214" text-anchor="end">3</text>
    <text x="112" y="264" text-anchor="end">2</text>
    <text x="112" y="314" text-anchor="end">1</text>
  </g>

  <!-- 抛物线 y = ax^2 + bx + c -->
  <polyline fill="none" stroke="#3C5488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="70,360 82.5,313.1 95,272.5 107.5,238.1 120,210 132.5,188.1 145,172.5 157.5,163.1 170,160 182.5,163.1 195,172.5 207.5,188.1 220,210 232.5,238.1 245,272.5 257.5,313.1 270,360"/>
  <text x="250" y="135" font-size="13" font-style="italic" fill="#252A33">y＝ax²＋bx＋c</text>

  <!-- 与坐标轴交点 -->
  <g fill="#252A33">
    <circle cx="70"  cy="360" r="3"/>
    <circle cx="270" cy="360" r="3"/>
    <circle cx="120" cy="210" r="3"/>
  </g>
</svg>
