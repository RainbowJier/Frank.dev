# ============================================================
# Hexo 站点配置（Frank's Notes）
# ------------------------------------------------------------
# 双语双构建：
#   中文： hexo generate --config _config.yml,_config.zh.yml  → public/
#   英文： hexo generate --config _config.yml,_config.en.yml  → public/en/
# 本文件为「共享 + 中文默认」配置；英文覆盖见 _config.en.yml。
# ============================================================

# ---------- 站点 ----------
title: Frank's Notes
subtitle: 前端开发者 · 终身学习者
description: Frank 的个人主页与博客 —— 记录学习、思考与作品。
keywords: Frank,前端开发,博客,作品集,个人网站
author: Frank
language: zh-cn
timezone: Asia/Shanghai

# ---------- URL ----------
url: https://frank-dev.site
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------- 目录（默认；英文构建由 _config.en.yml 覆盖）----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------- 文章 ----------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

# ---------- 首页 / 分类 / 归档生成器 ----------
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  enabled: true
  per_page: 0
  yearly: true
  monthly: true
category_generator:
  enable: true
  per_page: 0
tag_generator:
  enable: true
  per_page: 0

# ---------- 代码高亮（主题内置 highlight.js 主题）----------
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: true
prismjs:
  enable: false

# ---------- 分类与标签 ----------
default_category: uncategorized
category_map:
tag_map:

# ---------- 日期 / 元信息 ----------
meta_generator: true

# ---------- 主题 ----------
theme: pure

# ---------- 本地搜索（需 hexo-generator-search）----------
search:
  path: search.xml
  field: post
  content: true
  format: html

# ---------- RSS（需 hexo-generator-feed）----------
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: true
  content_limit:
  content_limit_delim: ' '
  order_by: -date

# ---------- 部署（实际由 GitHub Actions 构建发布，此处仅占位）----------
deploy:
  type: ''
