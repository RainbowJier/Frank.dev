<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Frank's Notes 文章列表。">
  <title>文章 · Frank's Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Saira+Extra+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>

  <!-- ====== 移动端汉堡按钮 ====== -->
  <button class="sidebar-toggle" aria-label="打开菜单">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay"></div>

  <!-- ====== 侧边栏 ====== -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="avatar-wrap">
        <img src="assets/avatar.jpg" alt="Frank" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="avatar-placeholder" style="display:none">F</span>
      </div>
      <div class="sidebar-name">Frank</div>
      <div class="sidebar-sub" data-i18n="home.subtitle">前端开发者 · 终身学习者</div>
    </div>
    <nav class="sidebar-nav">
      <ul class="sidebar-links">
        <li><a href="index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="blog.html" class="active" data-i18n="nav.blog">文章</a></li>
        <li><a href="projects.html" data-i18n="nav.projects">作品</a></li>
        <li><a href="about.html" data-i18n="nav.about">关于</a></li>
      </ul>
    </nav>
    <div class="sidebar-bottom">
      <button class="lang-toggle" data-lang-toggle>English</button>
      <p class="sidebar-copy" data-i18n-year="footer.copyright">© 2026 Frank's Notes</p>
    </div>
  </aside>

    <main class="container">

    <!-- ====== 页头 ====== -->
    <header class="hero reveal">
      <h1 data-i18n="blog.title">文章</h1>
      <p class="subtitle" data-i18n="blog.subtitle">一些关于代码、学习与生活的记录。</p>
    </header>

    <!-- ====== 文章列表 ====== -->
    <section class="section">

      <!-- 分类筛选标签：新分类时复制一个按钮，改 data-filter 和 data-i18n 的 cat.xxx -->
      <div class="filter-bar reveal">
        <button class="filter-btn active" data-filter="all" data-i18n="cat.all">全部</button>
        <button class="filter-btn" data-filter="essay" data-i18n="cat.essay">随笔</button>
        <button class="filter-btn" data-filter="tech" data-i18n="cat.tech">技术</button>
      </div>

      <ul class="post-list">

        <!-- 文章条目：复制一段，改日期/data-cat 分类/标题/链接，并在 js/i18n.js 补对应 key -->
        <li class="post-item reveal" data-cat="essay">
          <span class="date">2026-08-01</span>
          <span class="cat" data-i18n="cat.essay">随笔</span>
          <h3><a href="posts/hello-world.html" data-i18n="post1.title">你好，世界 —— 我的个人网站上线了</a></h3>
        </li>

        <li class="post-item reveal" data-cat="tech">
          <span class="date">2026-07-20</span>
          <span class="cat" data-i18n="cat.tech">技术</span>
          <h3><a href="posts/deploy-static-site.html" data-i18n="post2.title">零服务器部署静态网站：从本地到上线</a></h3>
        </li>

      </ul>
    </section>

  </main>

  <footer class="footer"></footer>

  <button class="back-top" aria-label="返回顶部">↑</button>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
