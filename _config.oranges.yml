# 文章页 AI 阅读助手：提问时把文章全文发给模型，基于本文内容回答
aiChat:
  enable: true
  # OpenAI 兼容接口完整地址，留空则文章页不显示 AI 助手
  endpoint: "https://api.siliconflow.cn/v1/chat/completions"
  # API Key：直接写死（静态博客的 key 本就随页面源码公开）
  apiKey: "sk-wzmqfkehtvevfuuhnmekbciovhvfyaexqibowpxoxatspgch"
  # 模型名，按接口可用模型填写（实测 GLM-4-9B 首token 0.7s 即问即答；
  # 想要更高质量可换 deepseek-ai/DeepSeek-V4-Flash，但需等待 20s+）
  model: "THUDM/GLM-4-9B-0414"
  # 流式输出（需中转站支持 SSE 透传），不支持时改为 false
  stream: true
  # 每次请求携带的最近对话轮数（一轮 = 一问一答）
  maxContextTurns: 6

colorSwitch:
  enable: true

postShare:
  enable: false
  twitter:
    enable: true
  facebook:
    enable: true

codeBlock:
  style: normal
  copy:
    enable: true

themeColor: '#808080'
