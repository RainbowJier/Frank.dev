name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 允许在 Actions 页面手动重跑（如新增 AI_CHAT_KEY Secret 后无需改代码重新触发）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec hexo generate
        env:
          # 文章页 AI 阅读助手的 API Key，在仓库 Settings → Secrets 配置；
          # 未配置时回落到主题配置文件里的 aiChat.apiKey
          AI_CHAT_KEY: ${{ secrets.AI_CHAT_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
