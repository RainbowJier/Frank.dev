name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GitHub Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一条部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (Chinese + English, dual build)
        run: |
          # 清理旧产物与缓存
          npx hexo clean
          # 中文：source/ → public/
          npx hexo generate --config _config.yml,_config.zh.yml
          # 清掉共享缓存 db.json，避免英文构建串入中文资产
          rm -f db.json
          # 英文：source_en/ → public/en/
          npx hexo generate --config _config.yml,_config.en.yml
          # 保险：移除可能误入 /en/ 的 CNAME（自定义域名只在根目录生效）
          rm -f public/en/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
